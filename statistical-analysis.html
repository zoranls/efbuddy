    v.innerHTML = `<div class="card row" style="position:sticky;top:8px;z-index:5;justify-content:space-between"><span>Time left <span class="timer ${M.left < 600 ? 'low' : ''}" id="tm">${mm}:${ss}</span></span><span class="meta">Answered ${M.ans.filter(a => a != null).length} of 15</span><button class="btn" id="fin">Submit</button></div>
    ${qs}<div class="card"><div class="meta">Calculation task (5 points)</div><p class="q">${esc(M.calc.t.intro)}</p><div>${partsHtml(M.calc.t, 'm', false)}</div></div>`;
    v.querySelectorAll('.opt').forEach(b => b.onclick = () => { M.ans[+b.dataset.q] = +b.dataset.i; const sy = window.scrollY; mock(); window.scrollTo(0, sy); });

    return;
  }
  if (M.state === 'done'){
    const r = M.result;
    const rows = M.qs.map((q, i) => { const ok = M.ans[i] === q.a; return `<tr><td>${i + 1}</td><td>${ok ? '✓' : '✗'}</td><td>${esc(TOPICS[q.t])}</td><td>${ok ? '' : 'Correct: ' + esc(q.o[q.a]) + '<br><span class="meta">' + esc(q.e) + '</span>'}</td></tr>`; }).join('');
    v.innerHTML = `<div class="card"><h2 style="margin-top:0">Result: ${r.total} / 20</h2><p>Multiple choice ${r.mc} / 15. Calculation ${r.calc} / 5.</p><button class="btn" id="re">Back to start</button></div>
    <div class="card"><b>Calculation task</b><p>${esc(M.calc.t.intro)}</p>${solHtml(M.calc.t)}</div>
    <div class="card"><b>Multiple choice review</b><table><tr><th>#</th><th></th><th>Topic</th><th>Feedback</th></tr>${rows}</table></div>`;
    $('#re').onclick = () => { M.state = 'idle'; mock(); };
  }
}
function startMock(){
  let qs = [];
  Object.keys(TOPICS).forEach(k => { qs = qs.concat(shuffle(BANK.filter(q => q.t === k)).slice(0, 3)); });
  qs = shuffle(qs); qs.forEach(q => q._o = shuffle(q.o.map((t, i) => ({ t, i }))));
  const key = MOCK_CALC[Math.floor(Math.random() * MOCK_CALC.length)];
  M = { state:'run', qs, ans:Array(15).fill(null), calc:{ key, t:CALC[key].gen() }, left:4200, timer:null, result:null };
  M.timer = setInterval(() => { M.left--; const el = $('#tm'); if (el){ const mm = String(Math.floor(M.left / 60)).padStart(2, '0'), ss = String(M.left % 60).padStart(2, '0'); el.textContent = mm + ':' + ss; if (M.left < 600) el.classList.add('low'); } if (M.left <= 0) finishMock(); }, 1000);
  mock();
}
function finishMock(){
  clearInterval(M.timer);
  let mc = 0; M.qs.forEach((q, i) => { const ok = M.ans[i] === q.a; if (ok) mc++; rec(q.id, ok); });
  const t = M.calc.t; let good = 0;
  t.parts.forEach((p, i) => { const el = document.getElementById('m' + i); if (el && okPart(p, parseNum(el.value))) good++; });
  const cp = Math.round(5 * good / t.parts.length * 2) / 2;
  M.result = { mc, calc:cp, total:mc + cp };
  const c = store.calc[M.calc.key] || { parts:0, good:0, tasks:0 }; c.parts += t.parts.length; c.good += good; c.tasks++; store.calc[M.calc.key] = c;
  store.mocks.push({ date:new Date().toISOString().slice(0, 10), mc, calc:cp, total:mc + cp }); save();
  M.state = 'done'; if (tab === 'mock') mock();
}

/* ---------- Formula sheet ---------- */
function sheet(){
  const steps = (title, lines) => `<div class="card"><b>${title}</b><ol class="steps" style="font-family:inherit">${lines.map(l => `<li style="font-family:inherit;font-size:.95rem">${l}</li>`).join('')}</ol></div>`;
  const methods =
    steps('Always start with the basic terms', ['Population (all units we are interested in) and, for a sample, the sample.', 'Statistical unit (one unit) or sample unit.', 'Variable with its scale (categorical nominal or ordinal, numerical interval or ratio).', 'Parameter (and its estimate from the sample, for example μ and ȳ, Π and p).']) +
    steps('Normal distribution: three numbered steps (Tutorial 2)', [
      'Write Y ~ N(μ, σ). The second number is the standard deviation (if the variance is given, take the square root).',
      '① Standardize: z_a = (a − μ) / σ. Round z to two decimals.',
      '② Table of the standard normal distribution (Statistical Analysis Handbook, pages 64 to 66): F(z_a). Left side: F(z). Right side: 1 − F(z). Between two limits: F(z_b) − F(z_a). For negative z read the negative rows carefully.',
      '③ Interpretation in words, for example "The probability that the IQ of a randomly selected person does not exceed 117 is 84.13%".',
      'Quantile (the value for a given share): ① write the quantile rank P = F(z_a), so "highest 10%" becomes 0.90. ② In the table find the number closest to P and read z_a. ③ a = μ + z_a · σ. Then NAME it: quartile Q1, Q2 (median), Q3, decile D1 to D9, or percentile P1 to P99, and say that it is a quantile of that rank.',
      'R: pnorm(q, mean, sd, lower.tail = TRUE) gives the area on the left, lower.tail = FALSE the right side. qnorm(p, mean, sd, lower.tail = TRUE) gives the value.']) +
    steps('Confidence interval for the mean, a total, a proportion or a number (Lecture 5)', [
      'Parameter and point estimate: ȳ, or total N · ȳ, or p, or N · p.',
      'Estimate the standard error. Mean: se(ȳ) = s / √n · √(1 − n/N). Proportion: se(p) = √( p(1 − p)/n · (1 − n/N) ). Do not forget the population correction when N is given.',
      'Critical value from the risk level α. Two sided: z_α/2 (1.96 for α = 0.05, 2.5758 for 0.01). One sided ("at least", "at most", "minimum", "maximum"): z_α (1.6449 for 0.05, 2.3263 for 0.01). When the standard error is estimated from a small sample use t with df = n − 1, for large samples z is acceptable. In a t table without your df take the first lower df. (SAH page 64.)',
      'Margin of error D = critical value · se. Write the interval as an inequality: ȳ − D < μ < ȳ + D; α = 0.05.',
      'Round OUTWARD: lower limit down, upper limit up. For totals and numbers multiply both unrounded limits by N. For percentages multiply by 100.',
      'End with "INTERPRETATION: Based on the sample, we estimate with a confidence level of 0.95 that ...".']) +
    steps('Sample size (Lecture 5, Examples 5.4 and 5.5, Tutorial 5 Exercise 4)', [
      'Decide the parameter and whether the margin of error is absolute (D, or "percentage points") or relative (D° as a share of the value, "3%").',
      'Step 1, with replacement: mean n_r = (z · σ / D)² or (z · CV / D°)². Proportion n_r = z² Π(1 − Π) / D² or z² (1 − Π) / (D°² Π).',
      'Step 2, without replacement: n = n_r / (1 + n_r / N).',
      'Always round UP to the next whole number. Then state the answer in a sentence.']) +
    steps('Stratified sample (Tutorial 4 Exercise 1c, Example 5.6)', [
      'Name the sampling type (stratified random sampling) and justify it: the variable differs between the groups, so units within a group are more alike, which lowers the standard error.',
      'Sample sizes with a sample proportion f: n_j = f · N_j. Proportional allocation: n_j = n · N_j / N.',
      'ȳ_str = (1/N) Σ N_j · ȳ_j. var(ȳ_str) = (1/N²) Σ N_j² · (s_j² / n_j) · (1 − n_j/N_j). se = √var.',
      'Interval ȳ_str ± z · se for large samples, then the same interpretation sentence.']);
  const rows = [
    ['L01','Sample mean','ȳ = Σyᵢ / n, grouped: ȳ = Σ f_k · y_k / n'],
    ['L01','Sample variance estimate','s² = Σ(yᵢ − ȳ)² / (n − 1), grouped: Σ f_k (y_k − ȳ)² / (n − 1)'],
    ['L01','Coefficient of variation, range','CV = s / ȳ (no unit), r = max − min'],
    ['L01','Frequency table','midpoint y_k, frequency f_k, cumulative F_k, relative f°_k = f_k / n, cumulative relative F°_k = F_k / n'],
    ['L01','Symbols','Population: μ, σ², Π. Sample estimates: ȳ, s², p'],
    ['L02','Standardization','z = (y − μ) / σ, and y = μ + zσ'],
    ['L02','Shares within kσ','k = 1: 68.27%, k = 2: 95.44%, k = 3: 99.73%'],
    ['L02','Interval probability','P(a < Y ≤ b) = F(b) − F(a), P(Y > b) = 1 − F(b)'],
    ['L02','Quartiles of a normal variable','Q1 = μ − 0.67σ, Q2 = μ, Q3 = μ + 0.67σ'],
    ['L02','Absolute and relative change of a share','absolute: difference in percentage points, relative: (new / old − 1) · 100%'],
    ['L03','Inclusion probability, step','n / N, and s = N / n'],
    ['L03','Allocation','n_j = n · N_j / N; quotas from ratios (parts of n)'],
    ['L03','Number of samples without replacement','C(N, n) = N! / (n! (N − n)!)'],
    ['L04','Standard error of the mean','SE(ȳ) = σ/√n · √((N − n)/(N − 1))'],
    ['L04','Estimated standard error','se(ȳ) = s/√n · √(1 − n/N)'],
    ['L04','Unbiased estimator','E(g) = Γ'],
    ['L05','Two sided interval','g − z_α/2 · se < Γ < g + z_α/2 · se; α'],
    ['L05','One sided interval','lower: g − z_α · se < Γ, upper: Γ < g + z_α · se'],
    ['L05','z values (SAH p. 64)','α: 0.10: 1.2816, 0.05: 1.6449, 0.025: 1.96, 0.01: 2.3263, 0.005: 2.5758, 0.001: 3.0902'],
    ['L05','Sample size, mean','n_r = z²σ² / D²,  n = n_r / (1 + n_r/N), round up'],
    ['L05','Sample size, proportion','n_r = z² Π(1 − Π) / D²,  same finite correction'],
    ['L05','Relative margin','D = D° · assumed value']
  ].map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td class="f"><code>${esc(r[2])}</code></td></tr>`).join('');
  $('#view').innerHTML = `<p class="note" style="margin-top:0">Built from your annotated Practice Solutions folder (Tutorials 1, 2, 4, 5 and Lectures 1, 2, 5), so the layout matches how the lecturer solves tasks. Check every formula and table value against your original Statistical Analysis Handbook.</p>${methods}<div class="card"><b>Formulas</b><table><tr><th>Lecture</th><th>What</th><th>Formula</th></tr>${rows}</table></div>`;
}

/* ---------- Progress ---------- */
function progress(){
  const rows = Object.keys(TOPICS).map(k => {
    const qs = BANK.filter(q => q.t === k);
    let tried = 0, right = 0, att = 0;
    qs.forEach(q => { const r = store.mc[q.id]; if (r){ tried++; att += r.r + r.w; if (r.last === 1) right++; } });
    const pct = qs.length ? Math.round(100 * right / qs.length) : 0;
    return `<div class="stat"><div class="meta">${esc(TOPICS[k])}</div><b>${pct}%</b><div class="bar"><i style="width:${pct}%"></i></div><div class="meta">${right} of ${qs.length} last answered right, ${tried} tried, ${att} attempts</div></div>`;
  }).join('');
  const ck = CALC_ORDER.map(k => { const r = store.calc[k]; return `<tr><td>${esc(CALC[k].name)}</td><td>${r ? r.tasks : 0}</td><td>${r ? Math.round(100 * r.good / r.parts) + '%' : 'not tried'}</td></tr>`; }).join('');
  const weak = BANK.filter(q => store.mc[q.id] && store.mc[q.id].last === 0).length;
  $('#view').innerHTML = `<div class="grid">${rows}</div>
  <div class="card" style="margin-top:14px"><b>Calculation tasks</b><table><tr><th>Type</th><th>Tasks</th><th>Parts correct</th></tr>${ck}</table></div>
  <div class="card"><b>${weak}</b> questions currently marked as missed. <button class="btn ghost" id="wk" style="margin-left:8px">Practise them</button></div>
  <div class="card"><b>Session summary for your study record</b><p class="meta">Copy this into your progress notes so the next session can resume from it.</p><textarea id="sum" readonly></textarea><div class="row"><button class="btn" id="cp">Copy</button><button class="btn ghost" id="rs">Reset all progress</button></div></div>
  <p class="note">Progress is kept in this browser when storage is available. If it resets, the summary above is your backup.</p>`;
  $('#sum').value = summaryText();
  $('#cp').onclick = () => { const t = $('#sum'); t.select(); const done = ok => { $('#cp').textContent = ok ? 'Copied' : 'Text selected, press Ctrl C or Cmd C'; }; try { navigator.clipboard.writeText(t.value).then(() => done(true), () => done(false)); } catch (e) { done(false); } };
  $('#rs').onclick = () => { const b = $('#rs'); if (b.dataset.arm){ store = { mc:{}, calc:{}, mocks:[] }; save(); P.queue = []; progress(); } else { b.dataset.arm = 1; b.textContent = 'Click again to delete all progress'; } };
  $('#wk').onclick = () => { P.topic = 'ALL'; P.weakFirst = true; buildQueue(); P.queue = P.queue.filter(q => store.mc[q.id] && store.mc[q.id].last === 0); tab = 'practice'; renderTabs(); practice(); };
}
function summaryText(){
  const d = new Date().toISOString().slice(0, 10);
  let s = `Statistical Analysis, Midterm 1 practice, ${d}\n`;
  Object.keys(TOPICS).forEach(k => {
    const qs = BANK.filter(q => q.t === k); let right = 0, tried = 0, miss = [];
    qs.forEach(q => { const r = store.mc[q.id]; if (r){ tried++; if (r.last === 1) right++; else miss.push(q.src); } });
    s += `${TOPICS[k]}: ${right}/${qs.length} last right, ${tried} tried` + (miss.length ? `. To revisit: ${miss.slice(0, 5).join('; ')}` : '') + '\n';
  });
  CALC_ORDER.forEach(k => { const r = store.calc[k]; if (r) s += `Calc ${CALC[k].name}: ${r.tasks} tasks, ${Math.round(100 * r.good / r.parts)}% parts correct\n`; });
  if (store.mocks.length){ const m = store.mocks[store.mocks.length - 1]; s += `Last mock: ${m.total}/20 (MC ${m.mc}/15, calc ${m.calc}/5) on ${m.date}\n`; }
  return s;
}
renderTabs(); show();
</script>
