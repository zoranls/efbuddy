<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Midterm 1 Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#1d1d1b;--muted:#6a675f;--line:#dedad0;--accent:#2f5d50;--accent-soft:#e3eee9;--good:#2e7d4f;--good-soft:#e2f2e8;--bad:#b3392f;--bad-soft:#f8e4e1;--warn:#8a5a00;--warn-soft:#fbf0d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--ink:#eeeae0;--muted:#a09b8f;--line:#37342f;--accent:#7fc4ae;--accent-soft:#25342f;--good:#6fcf97;--good-soft:#1f3326;--bad:#ff8a7d;--bad-soft:#3a2321;--warn:#f0c060;--warn-soft:#38301b}}
:root[data-theme=light]{--bg:#f6f4ef;--card:#ffffff;--ink:#1d1d1b;--muted:#6a675f;--line:#dedad0;--accent:#2f5d50;--accent-soft:#e3eee9;--good:#2e7d4f;--good-soft:#e2f2e8;--bad:#b3392f;--bad-soft:#f8e4e1;--warn:#8a5a00;--warn-soft:#fbf0d6}
:root[data-theme=dark]{--bg:#161614;--card:#211f1d;--ink:#eeeae0;--muted:#a09b8f;--line:#37342f;--accent:#7fc4ae;--accent-soft:#25342f;--good:#6fcf97;--good-soft:#1f3326;--bad:#ff8a7d;--bad-soft:#3a2321;--warn:#f0c060;--warn-soft:#38301b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.45}
body{background:var(--bg);min-height:100vh}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:26px;line-height:1.15}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:84px}
.tile b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px}
.tile span{color:var(--muted);font-size:14px}
.tile.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.tile.main span{color:#e6f2ee}
.tile.wide{grid-column:1 / -1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px;gap:8px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.q{font-size:20px;font-weight:600;margin:12px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{text-align:center;font-weight:600;margin:0}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:16px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:14px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:18px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;width:100%;font-weight:600}
.big{font-family:'Bricolage Grotesque',sans-serif;font-size:44px;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q = [{"lec": "L1", "t": "tf", "q": "According to Kotler, marketing is the process by which companies create value for customers and build strong customer relationships in order to capture value from customers in return.", "a": true, "e": "This is the Kotler definition on the Lecture 1 slides.", "id": "L101"}, {"lec": "L1", "t": "tf", "q": "Kotler's short version of the definition is: meeting the needs of your customer at a profit.", "a": true, "e": "Lecture 1 gives this simple form of the definition.", "id": "L102"}, {"lec": "L1", "t": "tf", "q": "Needs are the form that human wants take as they are shaped by culture and individual personality.", "a": false, "e": "That describes wants. Needs are states of felt deprivation.", "id": "L103"}, {"lec": "L1", "t": "tf", "q": "A demand is a human want that is backed by buying power.", "a": true, "e": "Needs are felt deprivation, wants are shaped by culture and personality, demands are wants backed by buying power.", "id": "L104"}, {"lec": "L1", "t": "tf", "q": "Marketing myopia means focusing on the underlying consumer needs instead of on existing products.", "a": false, "e": "It is the opposite: focusing only on existing wants and losing sight of underlying consumer needs.", "id": "L105"}, {"lec": "L1", "t": "tf", "q": "A market is the set of actual and potential buyers of a product.", "a": true, "e": "Lecture 1 definition of a market.", "id": "L106"}, {"lec": "L1", "t": "tf", "q": "Customer perceived value is the difference between total perceived customer benefits and customer cost.", "a": true, "e": "Lecture 1 definition of customer perceived value.", "id": "L107"}, {"lec": "L1", "t": "tf", "q": "Customer satisfaction is the extent to which perceived performance matches a buyer's expectations.", "a": true, "e": "Lecture 1 definition of customer satisfaction.", "id": "L108"}, {"lec": "L1", "t": "tf", "q": "Under the selling concept, a company first identifies consumer needs and then builds a product to solve them.", "a": false, "e": "Under the selling concept the provider already has a product and then looks for buyers.", "id": "L109"}, {"lec": "L1", "t": "tf", "q": "Under the product concept, marketing communication is considered unnecessary because high quality, innovative products are assumed to sell themselves.", "a": true, "e": "The slide says marketing communication is not needed under the product concept.", "id": "L110"}, {"lec": "L1", "t": "tf", "q": "The marketing concept can end up satisfying current consumer needs at the expense of employees, the environment and society.", "a": true, "e": "That weakness is the reason the societal marketing concept exists.", "id": "L111"}, {"lec": "L1", "t": "tf", "q": "Under the production concept, companies focus on production efficiency and availability and do not consider consumers' wants.", "a": true, "e": "Henry Ford's 'any color as long as it is black' is the slide example.", "id": "L112"}, {"lec": "L1", "t": "tf", "q": "Customer lifetime value is the total combined value of all of a company's customers.", "a": false, "e": "That is customer equity. Customer lifetime value is the value of the stream of purchases of one customer.", "id": "L113"}, {"lec": "L1", "t": "tf", "q": "Consumer generated marketing means brand exchanges created by consumers themselves.", "a": true, "e": "Lecture 1 definition.", "id": "L114"}, {"lec": "L1", "t": "tf", "q": "Share of customer is the portion of the customer's purchasing that a company gets in its product categories.", "a": true, "e": "Lecture 1 definition.", "id": "L115"}, {"lec": "L1", "t": "tf", "q": "In the expanded model of the marketing process on the slides, the last step is capturing value from customers to create profits and customer equity.", "a": true, "e": "Figure 1.6: five steps, the last one is capturing value from customers in return.", "id": "L116"}, {"lec": "L1", "t": "tf", "q": "Marketing management is the art and science of choosing target markets and building profitable relationships with them.", "a": true, "e": "Lecture 1 definition.", "id": "L117"}, {"lec": "L1", "t": "tf", "q": "The slide on the changing marketing landscape lists marketing and AI, sustainable marketing and digital and social media marketing.", "a": true, "e": "It also lists not for profit marketing growth and C2C (P2P).", "id": "L118"}, {"lec": "L1", "t": "mc", "q": "Which concept offers consumers low price and accessibility, with the provider aiming for productivity and high availability?", "o": ["Production concept", "Product concept", "Selling concept", "Societal marketing concept"], "e": "Production concept: low price, accessibility, efficiency.", "id": "L119"}, {"lec": "L1", "t": "mc", "q": "Producers who are in love with their product and do not consider consumers' needs and competition follow which concept?", "o": ["Product concept", "Production concept", "Selling concept", "Marketing concept"], "e": "Product concept: quality and features first, a relatively small niche.", "id": "L120"}, {"lec": "L1", "t": "mc", "q": "Which concept aims for profit from high sales volume through aggressive personal selling?", "o": ["Selling concept", "Production concept", "Product concept", "Societal marketing concept"], "e": "Selling concept: the provider has a product and then looks for buyers.", "id": "L121"}, {"lec": "L1", "t": "mc", "q": "Which concept aims for long term success by identifying consumer needs and satisfying them better than the competition?", "o": ["Marketing concept", "Production concept", "Selling concept", "Product concept"], "e": "Marketing concept: the product is seen as a solution to the consumer's problem.", "id": "L122"}, {"lec": "L1", "t": "mc", "q": "Which concept says marketing decisions should consider consumers' wants, the company's requirements, consumers' long run interests and society's long run interests?", "o": ["Societal marketing concept", "Marketing concept", "Selling concept", "Product concept"], "e": "Only the societal marketing concept adds society's long run interests.", "id": "L123"}, {"lec": "L1", "t": "mc", "q": "Which list shows the five core customer and marketplace concepts?", "o": ["Needs, wants and demands; market offerings; value and satisfaction; exchanges and relationships; markets", "Products, prices, places, promotions, people", "Segmentation, targeting, differentiation, positioning, branding", "Customers, competitors, suppliers, intermediaries, publics"], "e": "Step 1 of the marketing process on Lecture 1.", "id": "L124"}, {"lec": "L1", "t": "mc", "q": "What are the four Ps of the marketing mix?", "o": ["Product, price, place, promotion", "Product, people, process, profit", "Price, publicity, packaging, position", "Product, planning, pricing, performance"], "e": "Lecture 1, step 3: the marketing mix tools.", "id": "L125"}, {"lec": "L1", "t": "mc", "q": "Market offerings are best described as...", "o": ["Some combination of products, services, information or experiences offered to a market to satisfy a need or want", "Only physical goods that a company sells in stores", "The set of actual and potential buyers", "The prices a company charges for its products"], "e": "Lecture 1 definition.", "id": "L126"}, {"lec": "L1", "t": "mc", "q": "According to Lecture 1, customer relationship management (CRM) is...", "o": ["The overall process of building and maintaining profitable customer relationships by delivering superior customer value and satisfaction", "The tools that dig out meaningful patterns in big data", "Brand exchanges created by consumers themselves", "The act of obtaining a desired object by offering something in return"], "e": "Lecture 1 wording. Lecture 3 gives a different, narrower CRM definition about managing detailed information on individual customers.", "id": "L127"}, {"lec": "L1", "t": "mc", "q": "Which term means fostering direct and continuous customer involvement in shaping brand conversations, experiences and community?", "o": ["Customer engagement marketing", "Consumer generated marketing", "Customer equity", "Societal marketing"], "e": "Lecture 1 definition.", "id": "L128"}, {"lec": "L1", "t": "mc", "q": "Which two questions does marketing management answer?", "o": ["Which customers will we serve (target market) and how can we best serve them (value proposition)?", "Which products will we make and at what price?", "Which competitors will we copy and which suppliers will we use?", "Which media will we use and how much will we spend?"], "e": "Lecture 1, step 2.", "id": "L129"}, {"lec": "L1", "t": "mc", "q": "A brand's value proposition is...", "o": ["The set of benefits or values it promises to deliver to customers to satisfy their needs", "The total value of all of the company's customers over time", "The difference between a product's price and its production cost", "The portion of a customer's purchasing a company gets in its category"], "e": "Lecture 1 definition.", "id": "L130"}, {"lec": "L1", "t": "mc", "q": "Segmentation and targeting, and differentiation and positioning, belong to which step of the expanded marketing process model?", "o": ["Designing a customer value driven marketing strategy (step 2)", "Understanding the marketplace and customer needs (step 1)", "Constructing an integrated marketing program (step 3)", "Capturing value from customers (step 5)"], "e": "Figure 1.6 on Lecture 1.", "id": "L131"}, {"lec": "L1", "t": "mc", "q": "Creating satisfied loyal customers, capturing customer lifetime value, and increasing share of market and share of customer belong to which step?", "o": ["Capturing value from customers to create profits and customer equity (step 5)", "Understanding the marketplace and customer needs (step 1)", "Constructing an integrated marketing program (step 3)", "Engaging customers and building profitable relationships (step 4)"], "e": "Figure 1.6 on Lecture 1.", "id": "L132"}, {"lec": "L1", "t": "mc", "q": "Which activity belongs to step 1, understanding the marketplace and customer needs and wants?", "o": ["Researching the marketplace and customers and managing marketing information and customer data", "Deciding on a value proposition", "Creating real value through pricing", "Building engagement through customer relationship management"], "e": "Figure 1.6 on Lecture 1.", "id": "L133"}, {"lec": "L1", "t": "mc", "q": "Product and service design, pricing, distribution and promotion are the tools of which step?", "o": ["Constructing an integrated marketing program that delivers superior value (step 3)", "Designing a customer value driven marketing strategy (step 2)", "Engaging customers and building profitable relationships (step 4)", "Understanding the marketplace and customer needs (step 1)"], "e": "Figure 1.6 on Lecture 1.", "id": "L134"}, {"lec": "L1", "t": "mc", "q": "Which definition of marketing comes from the American Marketing Association?", "o": ["The activity, set of institutions and processes for creating, communicating, delivering and exchanging offerings that have value for customers, clients, partners and society at large", "The process by which companies create value for customers and build strong customer relationships in order to capture value in return", "Meeting the needs of your customer at a profit", "Selling and advertising products to final consumers"], "e": "Lecture 1 shows both the Kotler and the AMA definitions.", "id": "L135"}, {"lec": "L1", "t": "mc", "q": "States of felt deprivation are called...", "o": ["Needs", "Wants", "Demands", "Market offerings"], "e": "Lecture 1.", "id": "L136"}, {"lec": "L1", "t": "mc", "q": "Exchange is...", "o": ["The act of obtaining a desired object from someone by offering something in return", "The set of actual and potential buyers", "A combination of products, services and experiences", "The difference between benefits and costs"], "e": "Lecture 1 definition.", "id": "L137"}, {"lec": "L1", "t": "mc", "q": "Which statement matches customer equity?", "o": ["The total combined customer lifetime values of all of the company's customers", "The value of the entire stream of purchases one customer makes over a lifetime", "The portion of a customer's purchasing a company gets in its categories", "The difference between total perceived benefits and customer cost"], "e": "Lifetime value is one customer, share of customer is the portion of purchasing, equity is all customers combined.", "id": "L138"}, {"lec": "L1", "t": "mc", "q": "Which of the following is NOT listed on the slide as a change in the marketing landscape?", "o": ["Decline of digital and social media marketing", "Marketing and AI", "Sustainable marketing", "C2C (P2P) marketing"], "e": "The slide lists digital and social media marketing as a growing change.", "id": "L139"}, {"lec": "L2", "t": "tf", "q": "The macroenvironment consists of the actors close to the company that affect its ability to serve its customers.", "a": false, "e": "That is the microenvironment. The macroenvironment is the larger societal forces.", "id": "L201"}, {"lec": "L2", "t": "tf", "q": "Demography is the study of human populations in terms of size, density, location, age, gender, race, occupation and other statistics.", "a": true, "e": "Lecture 2 definition.", "id": "L202"}, {"lec": "L2", "t": "tf", "q": "Millennials (Gen Y) are described as comfortable with technology and as having migrated from the analogue to the digital world.", "a": true, "e": "Lecture 2, changing age.", "id": "L203"}, {"lec": "L2", "t": "tf", "q": "Generation Z was born after 1995 and is described as having the internet as part of its DNA.", "a": true, "e": "Lecture 2, changing age.", "id": "L204"}, {"lec": "L2", "t": "tf", "q": "The generation timeline slide calls Generation X the 'Latchkey Kids'.", "a": true, "e": "Also: Generation Z are the 'Digital Natives' and Generation Alpha the 'Google Kids'.", "id": "L205"}, {"lec": "L2", "t": "tf", "q": "The generation timeline slide calls Generation Alpha the 'Google Kids'.", "a": true, "e": "Lecture 2 timeline slide.", "id": "L206"}, {"lec": "L2", "t": "tf", "q": "Baby Boomers were born between 1946 and 1964 and are entering their peak earning years.", "a": true, "e": "Lecture 2: a lucrative market for travel, entertainment, housing and more.", "id": "L207"}, {"lec": "L2", "t": "tf", "q": "In generational marketing, the audience is segmented on the basis of the generation they belong to.", "a": true, "e": "Lecture 2 definition.", "id": "L208"}, {"lec": "L2", "t": "tf", "q": "Industrial economies consume most of their own agricultural and industrial output.", "a": false, "e": "That describes subsistence economies. Industrial economies are richer markets.", "id": "L209"}, {"lec": "L2", "t": "tf", "q": "Value marketing offers financially cautious buyers the right combination of quality and service at a fair price.", "a": true, "e": "Lecture 2 definition.", "id": "L210"}, {"lec": "L2", "t": "tf", "q": "The slide stresses that the company examples on the slides show environmental forces themselves, not company reactions.", "a": false, "e": "The note says the examples demonstrate company reactions to environmental forces, not the forces themselves.", "id": "L211"}, {"lec": "L2", "t": "tf", "q": "Environmental sustainability means developing strategies and practices that create a world economy the planet can support indefinitely.", "a": true, "e": "Lecture 2 definition.", "id": "L212"}, {"lec": "L2", "t": "tf", "q": "The technological environment is described as the most dramatic force in changing the marketplace.", "a": true, "e": "Lecture 2.", "id": "L213"}, {"lec": "L2", "t": "tf", "q": "Secondary beliefs and values are more open to change than core beliefs and values.", "a": true, "e": "Core beliefs are persistent and passed from parents to children.", "id": "L214"}, {"lec": "L2", "t": "tf", "q": "A proactive company takes aggressive actions to affect forces in the environment.", "a": true, "e": "Lecture 2, responding to the marketing environment.", "id": "L215"}, {"lec": "L2", "t": "tf", "q": "Marketing intermediaries include resellers, physical distribution firms, marketing services agencies and financial intermediaries.", "a": true, "e": "Lecture 2, microenvironment.", "id": "L216"}, {"lec": "L2", "t": "tf", "q": "The slide says income distribution is becoming more equal as the middle class grows.", "a": false, "e": "The slide says income distribution is skewed: the rich get richer, the middle class shrinks and the underclass remains poor.", "id": "L217"}, {"lec": "L2", "t": "tf", "q": "Telecommuting, SOHO and digital nomads are listed under changes in where people work.", "a": true, "e": "Lecture 2, geographic shifts in population.", "id": "L218"}, {"lec": "L2", "t": "mc", "q": "Which description fits the marketing environment?", "o": ["The actors and forces outside marketing that affect marketing management's ability to build and maintain successful relationships with target customers", "Only the competitors that sell similar products", "The forces inside the company that shape its marketing mix", "The group of current customers a company serves"], "e": "Lecture 2 definition.", "id": "L219"}, {"lec": "L2", "t": "mc", "q": "Which list shows the six forces of the macroenvironment?", "o": ["Demographic, economic, natural, technological, political, cultural", "Demographic, economic, natural, competitive, political, financial", "Company, suppliers, intermediaries, customers, competitors, publics", "Product, price, place, promotion, people, process"], "e": "Lecture 2, macroenvironment.", "id": "L220"}, {"lec": "L2", "t": "mc", "q": "Which list shows the actors of the microenvironment?", "o": ["Company, suppliers, marketing intermediaries, customer markets, competitors, publics", "Demographic, economic, natural, technological, political, cultural", "Resellers, physical distribution firms, marketing services agencies, financial intermediaries", "Consumer, business, reseller, government, international"], "e": "Lecture 2, microenvironment.", "id": "L221"}, {"lec": "L2", "t": "mc", "q": "Which generation is also known as the 'Digital Natives' on the timeline slide?", "o": ["Generation Z", "Generation X", "Generation Y (Millennials)", "Baby Boomers"], "e": "Lecture 2 timeline slide.", "id": "L222"}, {"lec": "L2", "t": "mc", "q": "Which group is described as having high parental divorce rates, a cautious economic outlook, less materialism and putting family first?", "o": ["Generation X", "Baby Boomers", "Millennials (Gen Y)", "Generation Z"], "e": "Lecture 2, changing age.", "id": "L223"}, {"lec": "L2", "t": "mc", "q": "Which statement defines subsistence economies?", "o": ["They consume most of their own agriculture and industrial output", "They are the richest markets with high purchasing power", "They export most of what they produce", "They are dominated by service industries"], "e": "Lecture 2, economic environment.", "id": "L224"}, {"lec": "L2", "t": "mc", "q": "Which is listed as a trend in the natural environment?", "o": ["Growing shortages of raw materials", "Falling levels of pollution", "Decreasing government intervention", "An unlimited supply of energy"], "e": "Lecture 2: raw material shortages, increased pollution, increased government intervention.", "id": "L225"}, {"lec": "L2", "t": "mc", "q": "Legislation regulating business is intended to protect which parties?", "o": ["Companies from each other, consumers from unfair business practices, and the interests of society", "Only consumers from unfair business practices", "Only companies from foreign competition", "Governments from losing tax revenue"], "e": "Lecture 2, political and social environment.", "id": "L226"}, {"lec": "L2", "t": "mc", "q": "Which is a company response to political and social change listed on the slide?", "o": ["Cause related marketing", "Cutting all advertising", "Ignoring new regulations", "Raising prices on all products"], "e": "Lecture 2: more emphasis on ethics, socially responsible behavior, cause related marketing.", "id": "L227"}, {"lec": "L2", "t": "mc", "q": "The cultural environment consists of...", "o": ["Institutions and other forces that affect a society's basic values, perceptions and behaviors", "Factors that affect consumer purchasing power and spending patterns", "The physical environment and natural resources marketers need", "Groups with an interest in the organization's objectives"], "e": "Lecture 2 definition.", "id": "L228"}, {"lec": "L2", "t": "mc", "q": "Core beliefs and values are...", "o": ["Persistent and passed from parents to children, reinforced by schools, churches, businesses and government", "Open to change and include views of oneself and others", "Defined only by income and occupation", "Created mainly by marketing campaigns"], "e": "Secondary beliefs are the ones that are more open to change.", "id": "L229"}, {"lec": "L2", "t": "mc", "q": "Which of the following is NOT one of the customer markets in the microenvironment?", "o": ["Competitor markets", "Consumer markets", "Reseller markets", "Government markets"], "e": "Lecture 2 lists consumer, business, reseller, government and international markets.", "id": "L230"}, {"lec": "L2", "t": "mc", "q": "According to the slide, how should a company treat its suppliers?", "o": ["As partners to provide customer value", "As adversaries to keep input prices low", "As temporary contractors", "As competitors for resources"], "e": "Lecture 2, microenvironment.", "id": "L231"}, {"lec": "L2", "t": "mc", "q": "Firms must gain strategic advantage by positioning their offerings strongly against competitors' offerings in the minds of whom?", "o": ["Consumers", "Suppliers", "Shareholders", "Government regulators"], "e": "Lecture 2, competitors.", "id": "L232"}, {"lec": "L2", "t": "mc", "q": "On the slide about marketers' use of AI (January 2025 survey), which area was the most common?", "o": ["Content creation and enhancement (37%)", "Chatbots and conversational AI (25%)", "Predictive analytics for customer behavior (22%)", "Voice and visual search optimization (20%)"], "e": "Lecture 2 bar chart.", "id": "L233"}, {"lec": "L2", "t": "mc", "q": "Which is the correct definition of the economic environment?", "o": ["Factors that affect consumer purchasing power and spending patterns", "Institutions that affect a society's basic values", "The study of human populations", "The physical environment and natural resources"], "e": "Lecture 2 definition.", "id": "L234"}, {"lec": "L2", "t": "mc", "q": "Which list of demographic trends appears on the slide?", "o": ["Changing age, changing family structures, geographic population shifts, educational characteristics, population diversity", "Changing prices, changing taxes, changing interest rates, changing wages, changing exports", "Changing climate, changing resources, changing pollution, changing laws, changing technology", "Changing suppliers, changing intermediaries, changing competitors, changing publics, changing customers"], "e": "Lecture 2, demographic environment.", "id": "L235"}, {"lec": "L2", "t": "mc", "q": "Which group of publics is listed on the slide?", "o": ["Financial, media, government, citizen action, local, general and internal publics", "Consumer, business, reseller, government and international publics", "Demographic, economic, natural and cultural publics", "Suppliers, resellers and competitors"], "e": "Lecture 2, microenvironment.", "id": "L236"}, {"lec": "L2", "t": "mc", "q": "Which company groups does marketing management take into account when designing marketing plans?", "o": ["Top management, finance, R&D, purchasing, operations and accounting", "Suppliers, resellers, financial publics and media publics", "Consumers, businesses, governments and international buyers", "Baby Boomers, Generation X, Millennials and Generation Z"], "e": "Lecture 2, the company as part of the microenvironment.", "id": "L237"}, {"lec": "L3", "t": "tf", "q": "Customer insights are fresh marketing information based understandings of customers and the marketplace that become the basis for creating customer value, engagement and relationships.", "a": true, "e": "Lecture 3 definition.", "id": "L301"}, {"lec": "L3", "t": "tf", "q": "Big data refers to the huge and complex data sets generated by today's sophisticated information generation, collection, storage and analysis technologies.", "a": true, "e": "Lecture 3 definition.", "id": "L302"}, {"lec": "L3", "t": "tf", "q": "A marketing information system provides information only to the company's own marketing managers and never to external partners.", "a": false, "e": "It serves marketing and other managers and also external partners such as suppliers, resellers and marketing service agencies.", "id": "L303"}, {"lec": "L3", "t": "tf", "q": "A good MIS balances the information users would like to have against what they need and what is feasible to offer.", "a": true, "e": "Lecture 3.", "id": "L304"}, {"lec": "L3", "t": "tf", "q": "Internal databases collect consumer and market information from data sources outside the company network.", "a": false, "e": "Internal databases come from data sources within the company network.", "id": "L305"}, {"lec": "L3", "t": "tf", "q": "Competitive marketing intelligence is the systematic collection and analysis of publicly available information about consumers, competitors and developments in the marketing environment.", "a": true, "e": "Lecture 3 definition.", "id": "L306"}, {"lec": "L3", "t": "tf", "q": "Secondary data is information collected for the specific purpose at hand.", "a": false, "e": "That is primary data. Secondary data already exists, collected for another purpose.", "id": "L307"}, {"lec": "L3", "t": "tf", "q": "A focus group typically has six to 10 people and a trained moderator.", "a": true, "e": "Lecture 3. Challenges: expensive, hard to generalize, consumers not always open and honest.", "id": "L308"}, {"lec": "L3", "t": "tf", "q": "One challenge of focus groups is that it is easy to generalize from a small group.", "a": false, "e": "Focus groups are expensive, the results are difficult to generalize from a small group and consumers are not always open and honest.", "id": "L309"}, {"lec": "L3", "t": "tf", "q": "Ethnographic research involves sending trained observers to watch and interact with consumers in their natural environments.", "a": true, "e": "Lecture 3 definition.", "id": "L310"}, {"lec": "L3", "t": "tf", "q": "Experimental research gathers primary data by asking people questions about their knowledge, attitudes and preferences.", "a": false, "e": "That is survey research. Experimental research uses matched groups, different treatments and controlled factors.", "id": "L311"}, {"lec": "L3", "t": "tf", "q": "Online contact methods are low cost, fast, give higher response rates and are good for hard to reach groups.", "a": true, "e": "Lecture 3, online contact methods.", "id": "L312"}, {"lec": "L3", "t": "tf", "q": "Questionnaires are the most common research instrument and can be used in person, by phone or online.", "a": true, "e": "Lecture 3, research instruments.", "id": "L313"}, {"lec": "L3", "t": "tf", "q": "Marketing analytics are the tools, technologies and processes used to find meaningful patterns in big data to gain customer insights and gauge marketing performance.", "a": true, "e": "Lecture 3 definition.", "id": "L314"}, {"lec": "L3", "t": "tf", "q": "Customer privacy and the misuse of research findings are ethics issues named on the Lecture 3 slides.", "a": true, "e": "Lecture 3, public policy and ethics.", "id": "L315"}, {"lec": "L3", "t": "tf", "q": "Implementing the research plan means collecting, processing and analyzing the information.", "a": true, "e": "Lecture 3.", "id": "L316"}, {"lec": "L3", "t": "tf", "q": "A sample is a segment of the population selected for marketing research to represent the population as a whole.", "a": true, "e": "Lecture 3 definition.", "id": "L317"}, {"lec": "L3", "t": "tf", "q": "Brand communities are an online contact method, also called netnography.", "a": true, "e": "Lecture 3, online contact methods.", "id": "L318"}, {"lec": "L3", "t": "tf", "q": "Mail, telephone, personal and online are the contact methods shown in Table 4.1 on the slides.", "a": true, "e": "Lecture 3, Table 4.1 Planning Primary Data Collection.", "id": "L319"}, {"lec": "L3", "t": "mc", "q": "Which describes a marketing information system (MIS)?", "o": ["People and procedures dedicated to assessing information needs, developing the needed information and helping decision makers use it to generate and validate actionable customer and market insights", "The analysis of big data to find meaningful patterns", "A written plan listing the research budget", "A collection of information from outside the company only"], "e": "Lecture 3 definition.", "id": "L320"}, {"lec": "L3", "t": "mc", "q": "From which three sources do marketers obtain information?", "o": ["Internal data, marketing intelligence, marketing research", "Surveys, experiments, observation", "Primary data, secondary data, big data", "Customers, suppliers, competitors"], "e": "Lecture 3.", "id": "L321"}, {"lec": "L3", "t": "mc", "q": "Which is the best definition of marketing research?", "o": ["The systematic design, collection, analysis and reporting of data relevant to a specific marketing situation facing an organization", "The collection and analysis of publicly available information about competitors", "Information obtained from data sources within the company network", "Managing detailed information about individual customers"], "e": "Lecture 3 definition.", "id": "L322"}, {"lec": "L3", "t": "mc", "q": "Which list shows the three types of research for defining the problem and research objectives?", "o": ["Exploratory, descriptive, causal", "Primary, secondary, tertiary", "Observation, survey, experiment", "Internal, external, competitive"], "e": "Lecture 3.", "id": "L323"}, {"lec": "L3", "t": "mc", "q": "Exploratory research is used to...", "o": ["Gather preliminary information that helps define the problem and suggest hypotheses", "Test hypotheses about cause and effect relationships", "Describe market potential or the demographics of customers", "Measure customer satisfaction after purchase"], "e": "Exploratory defines the problem, descriptive describes, causal tests cause and effect.", "id": "L324"}, {"lec": "L3", "t": "mc", "q": "Which defines observational research?", "o": ["Gathering primary data by observing relevant people, actions and situations", "Asking people questions about their knowledge, attitudes and preferences", "Giving matched groups different treatments and checking differences", "Collecting information that already exists for another purpose"], "e": "Lecture 3 definition.", "id": "L325"}, {"lec": "L3", "t": "mc", "q": "Which defines survey research?", "o": ["Gathering primary data by asking people questions about their knowledge, attitudes, preferences and buying behavior", "Gathering primary data by observing relevant people, actions and situations", "Selecting matched groups and giving them different treatments", "Collecting information that already exists for another purpose"], "e": "Lecture 3 definition.", "id": "L326"}, {"lec": "L3", "t": "mc", "q": "Which defines experimental research?", "o": ["Selecting matched groups of subjects, giving them different treatments, controlling related factors and checking for differences in group responses", "Sending trained observers to watch consumers in their natural environments", "Gathering primary data by asking people questions", "Using people meters and checkout scanners"], "e": "Lecture 3 definition.", "id": "L327"}, {"lec": "L3", "t": "mc", "q": "In Table 4.1 (planning primary data collection), which are the research approaches?", "o": ["Observation, survey, experiment", "Mail, telephone, personal, online", "Sampling unit, sample size, sampling procedure", "Questionnaire, mechanical instruments"], "e": "Lecture 3, Table 4.1.", "id": "L328"}, {"lec": "L3", "t": "mc", "q": "In Table 4.1, which are the contact methods?", "o": ["Mail, telephone, personal, online", "Observation, survey, experiment", "Sampling unit, sample size, sampling procedure", "Questionnaire, mechanical instruments"], "e": "Lecture 3, Table 4.1.", "id": "L329"}, {"lec": "L3", "t": "mc", "q": "In Table 4.1, which are the elements of the sampling plan?", "o": ["Sampling unit, sample size, sampling procedure", "Observation, survey, experiment", "Mail, telephone, personal, online", "Questionnaire, mechanical instruments"], "e": "Lecture 3, Table 4.1.", "id": "L330"}, {"lec": "L3", "t": "mc", "q": "In Table 4.1, which are the research instruments?", "o": ["Questionnaire, mechanical instruments", "Observation, survey, experiment", "Mail, telephone, personal, online", "Sampling unit, sample size, sampling procedure"], "e": "Lecture 3, Table 4.1.", "id": "L331"}, {"lec": "L3", "t": "mc", "q": "Which is a mechanical research instrument shown on the Lecture 3 slides?", "o": ["Checkout scanners", "Focus groups", "Online panels", "Open ended questions"], "e": "Lecture 3: checkout scanners, people meters, neuromarketing, eye tracking.", "id": "L332"}, {"lec": "L3", "t": "mc", "q": "Which is a challenge of focus groups?", "o": ["Consumers are not always open and honest", "They are very cheap to run", "They allow easy generalization to the whole population", "They need no trained moderator"], "e": "Lecture 3.", "id": "L333"}, {"lec": "L3", "t": "mc", "q": "Which is NOT one of the online contact method types on the slide?", "o": ["Telephone interviews", "Online surveys", "Online panels", "Brand communities (netnography)"], "e": "Lecture 3: online surveys, online focus groups, consumer tracking, experiments, online panels, brand communities.", "id": "L334"}, {"lec": "L3", "t": "mc", "q": "Which of these is a closed ended question?", "o": ["How would you evaluate Brand X on a scale from 1 to 5?", "What is your opinion of Brand X?", "Describe your last purchase of Brand X.", "Why do you prefer Brand X?"], "e": "Lecture 3 slide example.", "id": "L335"}, {"lec": "L3", "t": "mc", "q": "According to Lecture 3, customer relationship management (CRM) is...", "o": ["Managing detailed information about individual customers and carefully managing customer touch points to maximize customer loyalty", "The tools that dig out meaningful patterns in big data", "The systematic collection of publicly available information about competitors", "People and procedures that assess information needs"], "e": "Lecture 3 wording. Lecture 1 gives a broader CRM definition.", "id": "L336"}, {"lec": "L3", "t": "mc", "q": "Netflix's 'What We Watched' data on the Lecture 3 slides is an example of...", "o": ["Internal data", "Marketing intelligence about competitors", "A focus group", "An experiment with matched groups"], "e": "Lecture 3, internal data example.", "id": "L337"}, {"lec": "L3", "t": "mc", "q": "Which is the correct order of the marketing research process?", "o": ["Define the problem and objectives, develop the research plan, implement the plan, interpret and report findings", "Develop the research plan, define the problem, report findings, implement the plan", "Implement the plan, define the problem, develop the research plan, report findings", "Interpret findings, define the problem, develop the plan, implement the plan"], "e": "Lecture 3.", "id": "L338"}, {"lec": "L3", "t": "mc", "q": "Which are the three questions a sampling plan must answer?", "o": ["Who is to be studied, how many people should be studied, how should they be chosen", "What to ask, when to ask, where to ask", "Which approach, which contact method, which instrument", "Which problem, which budget, which deadline"], "e": "Lecture 3 sampling plan.", "id": "L339"}, {"lec": "L3", "t": "mc", "q": "You plan a sushi restaurant near SEB and read competitors' public menus, prices and reviews. This is mainly...", "o": ["Competitive marketing intelligence", "Experimental research", "A causal research study", "Analysis of internal data"], "e": "Lecture 3 slide example.", "id": "L340"}, {"lec": "L3", "t": "mc", "q": "Which describes secondary data?", "o": ["Information that already exists somewhere, having been collected for another purpose", "Information collected for the specific purpose at hand", "Information gathered from a focus group", "Information that comes only from the company's own customers"], "e": "Lecture 3 definition.", "id": "L341"}, {"lec": "L3", "t": "mc", "q": "Which describes marketing analytics?", "o": ["The analysis tools, technologies and processes that dig out meaningful patterns in big data to gain customer insights and gauge marketing performance", "Managing detailed information about individual customers", "The systematic design and reporting of data for a specific situation", "A database within the company network"], "e": "Lecture 3 definition.", "id": "L342"}, {"lec": "L3", "t": "mc", "q": "Which two issues does Lecture 3 name under public policy and ethics?", "o": ["Customer privacy and misuse of research findings", "Product pricing and shelf placement", "Employee wages and working hours", "Advertising frequency and media choice"], "e": "Lecture 3.", "id": "L343"}, {"lec": "L4", "t": "tf", "q": "Consumer buyer behavior is the buying behavior of final consumers: individuals and households that buy goods and services for personal consumption.", "a": true, "e": "Lecture 4 definition.", "id": "L401"}, {"lec": "L4", "t": "tf", "q": "Culture is the set of basic values, perceptions, wants and behaviors learned by a member of society from family and other important institutions.", "a": true, "e": "Lecture 4 definition.", "id": "L402"}, {"lec": "L4", "t": "tf", "q": "Subcultures are groups of people within a culture with shared value systems based on common life experiences and situations.", "a": true, "e": "Lecture 4 definition.", "id": "L403"}, {"lec": "L4", "t": "tf", "q": "Social classes are measured by income alone.", "a": false, "e": "They are measured as a combination of occupation, income, education, wealth and other variables.", "id": "L404"}, {"lec": "L4", "t": "tf", "q": "A reference group is a group that an individual wishes to belong to.", "a": false, "e": "That is an aspirational group. Reference groups form a comparison or reference point for attitudes or behavior.", "id": "L405"}, {"lec": "L4", "t": "tf", "q": "Family is the most important consumer buying organization in society.", "a": true, "e": "Lecture 4, social factors.", "id": "L406"}, {"lec": "L4", "t": "tf", "q": "Lifestyle is a person's pattern of living as expressed in his or her psychographics.", "a": true, "e": "Lecture 4 definition.", "id": "L407"}, {"lec": "L4", "t": "tf", "q": "Selective distortion is the tendency to interpret information in a way that supports what you already believe.", "a": true, "e": "Lecture 4 definition.", "id": "L408"}, {"lec": "L4", "t": "tf", "q": "Selective attention is the tendency to remember good points made about a brand.", "a": false, "e": "That is selective retention. Selective attention is screening out most of the information you are exposed to.", "id": "L409"}, {"lec": "L4", "t": "tf", "q": "A belief is a person's relatively consistent evaluation, feeling and tendency toward an object or idea.", "a": false, "e": "That is an attitude. A belief is a descriptive thought based on knowledge, opinion or faith.", "id": "L410"}, {"lec": "L4", "t": "tf", "q": "Cognitive dissonance is buyer discomfort caused by postpurchase conflict.", "a": true, "e": "Lecture 4 definition.", "id": "L411"}, {"lec": "L4", "t": "tf", "q": "A purchase intention always turns into the purchase decision.", "a": false, "e": "Attitudes of others and unexpected situational factors can interfere.", "id": "L412"}, {"lec": "L4", "t": "tf", "q": "In the buyer decision process, information search comes before evaluation of alternatives.", "a": true, "e": "Order: need recognition, information search, evaluation of alternatives, purchase decision, postpurchase behavior.", "id": "L413"}, {"lec": "L4", "t": "tf", "q": "The customer journey is the sum of the ongoing experiences consumers have with a brand that affect buying behavior, engagement and brand advocacy over time.", "a": true, "e": "Lecture 4 definition.", "id": "L414"}, {"lec": "L4", "t": "tf", "q": "Complex buying behavior occurs when involvement is high and there are few differences between brands.", "a": false, "e": "Complex buying behavior has high involvement and significant differences between brands. High involvement with few differences is dissonance reducing.", "id": "L415"}, {"lec": "L4", "t": "tf", "q": "In the model of buyer behavior, the marketing stimuli are the four Ps: product, price, place and promotion.", "a": true, "e": "Lecture 4, Figure 5.1.", "id": "L416"}, {"lec": "L4", "t": "tf", "q": "Motivation research is quantitative research designed to probe consumers' hidden motivations.", "a": false, "e": "It is qualitative research that probes hidden, subconscious motivations.", "id": "L417"}, {"lec": "L4", "t": "tf", "q": "Personality refers to the unique psychological characteristics that distinguish a person or group.", "a": true, "e": "Lecture 4 definition.", "id": "L418"}, {"lec": "L4", "t": "tf", "q": "On the adopter categories figure, innovators make up 2.5% of all adopters.", "a": true, "e": "Figure 5.6: innovators 2.5%, early adopters 13.5%, early mainstream 34%, late mainstream 34%, lagging adopters 16%.", "id": "L419"}, {"lec": "L4", "t": "mc", "q": "Which four groups of characteristics affect consumer behavior?", "o": ["Cultural, social, personal, psychological", "Cultural, economic, political, personal", "Social, economic, technological, psychological", "Demographic, geographic, behavioral, psychographic"], "e": "Lecture 4, Figure 5.2.", "id": "L420"}, {"lec": "L4", "t": "mc", "q": "Which defines membership groups?", "o": ["Groups with direct influence and to which a person belongs", "Groups an individual wishes to belong to", "Groups that form a comparison or reference in forming attitudes or behavior", "Groups of people within a culture with shared value systems"], "e": "Lecture 4.", "id": "L421"}, {"lec": "L4", "t": "mc", "q": "Which defines aspirational groups?", "o": ["Groups an individual wishes to belong to", "Groups with direct influence and to which a person belongs", "Groups that form a comparison or reference in forming attitudes", "Society's relatively permanent and ordered divisions"], "e": "Lecture 4.", "id": "L422"}, {"lec": "L4", "t": "mc", "q": "Which of these is a PERSONAL factor, not a social factor?", "o": ["Lifestyle", "Family", "Roles and status", "Groups and social networks"], "e": "Social: groups and social networks, family, roles and status. Personal: age and life cycle stage, occupation, economic situation, lifestyle, personality and self concept.", "id": "L423"}, {"lec": "L4", "t": "mc", "q": "Which is NOT one of the five brand personality traits on the slides?", "o": ["Humility", "Sincerity", "Excitement", "Ruggedness"], "e": "The five traits are sincerity, excitement, competence, sophistication, ruggedness.", "id": "L424"}, {"lec": "L4", "t": "mc", "q": "Which list shows the psychological factors?", "o": ["Motivation, perception, learning, beliefs and attitudes", "Age, occupation, lifestyle, personality", "Culture, subculture, social class", "Groups, family, roles and status"], "e": "Lecture 4, Figure 5.2.", "id": "L425"}, {"lec": "L4", "t": "mc", "q": "A motive (or drive) is...", "o": ["A need that is sufficiently pressing to direct the person to seek satisfaction of the need", "A descriptive thought a person has about something", "A change in behavior arising from experience", "A tendency to screen out most information"], "e": "Lecture 4 definition.", "id": "L426"}, {"lec": "L4", "t": "mc", "q": "Which three perceptual processes does perception involve?", "o": ["Selective attention, selective distortion, selective retention", "Motivation, learning, attitude", "Need recognition, search, evaluation", "Awareness, interest, trial"], "e": "Lecture 4.", "id": "L427"}, {"lec": "L4", "t": "mc", "q": "Selective retention is...", "o": ["The tendency to remember good points made about a brand", "The tendency to screen out most of the information exposed to", "The tendency to interpret information to support existing beliefs", "The tendency to buy the same brand repeatedly"], "e": "Lecture 4 definition.", "id": "L428"}, {"lec": "L4", "t": "mc", "q": "Learning occurs through the interplay of which elements?", "o": ["Drives, stimuli, cues, responses, reinforcement", "Motives, beliefs, attitudes, lifestyle, personality", "Culture, class, family, status, role", "Need, search, evaluation, purchase, postpurchase"], "e": "Lecture 4.", "id": "L429"}, {"lec": "L4", "t": "mc", "q": "Which is the correct order of the buyer decision process?", "o": ["Need recognition, information search, evaluation of alternatives, purchase decision, postpurchase behavior", "Information search, need recognition, purchase decision, evaluation of alternatives, postpurchase behavior", "Need recognition, evaluation of alternatives, information search, purchase decision, postpurchase behavior", "Need recognition, information search, purchase decision, evaluation of alternatives, postpurchase behavior"], "e": "Lecture 4 figure.", "id": "L430"}, {"lec": "L4", "t": "mc", "q": "Which are the four sources of information in the information search stage?", "o": ["Personal, commercial, public, experiential", "Internal, external, primary, secondary", "Family, friends, media, retailers", "Observation, survey, experiment, panel"], "e": "Lecture 4.", "id": "L431"}, {"lec": "L4", "t": "mc", "q": "Need recognition can be triggered by...", "o": ["Internal stimuli or external stimuli", "Only advertising", "Only price changes", "Only social media"], "e": "Lecture 4.", "id": "L432"}, {"lec": "L4", "t": "mc", "q": "High involvement and significant differences between brands describes which type of buying behavior?", "o": ["Complex buying behavior", "Variety seeking buying behavior", "Dissonance reducing buying behavior", "Habitual buying behavior"], "e": "Lecture 4 grid of buying decision behavior.", "id": "L433"}, {"lec": "L4", "t": "mc", "q": "Low involvement and significant differences between brands describes which type of buying behavior?", "o": ["Variety seeking buying behavior", "Complex buying behavior", "Dissonance reducing buying behavior", "Habitual buying behavior"], "e": "Lecture 4 grid of buying decision behavior.", "id": "L434"}, {"lec": "L4", "t": "mc", "q": "High involvement and few differences between brands describes which type of buying behavior?", "o": ["Dissonance reducing buying behavior", "Complex buying behavior", "Variety seeking buying behavior", "Habitual buying behavior"], "e": "Lecture 4 grid of buying decision behavior.", "id": "L435"}, {"lec": "L4", "t": "mc", "q": "Low involvement and few differences between brands describes which type of buying behavior?", "o": ["Habitual buying behavior", "Complex buying behavior", "Variety seeking buying behavior", "Dissonance reducing buying behavior"], "e": "Lecture 4 grid of buying decision behavior.", "id": "L436"}, {"lec": "L4", "t": "mc", "q": "Which list shows the stages of the adoption process?", "o": ["Awareness, interest, evaluation, trial, adoption", "Need recognition, search, evaluation, purchase, postpurchase", "Awareness, search, purchase, trial, loyalty", "Interest, evaluation, purchase, advocacy, adoption"], "e": "Lecture 4.", "id": "L437"}, {"lec": "L4", "t": "mc", "q": "Which five characteristics influence the rate of adoption of a new product?", "o": ["Relative advantage, compatibility, complexity, divisibility, communicability", "Price, quality, brand, packaging, promotion", "Innovators, early adopters, early mainstream, late mainstream, lagging adopters", "Awareness, interest, evaluation, trial, adoption"], "e": "Lecture 4.", "id": "L438"}, {"lec": "L4", "t": "mc", "q": "In the model of buyer behavior, the buyer's characteristics and decision process together are called...", "o": ["The buyer's black box", "The marketing stimuli", "The buyer responses", "The choice set"], "e": "Lecture 4, Figure 5.1.", "id": "L439"}, {"lec": "L4", "t": "mc", "q": "On the adopter categories figure, which category is 16% of all adopters?", "o": ["Lagging adopters", "Innovators", "Early adopters", "Late mainstream"], "e": "Figure 5.6.", "id": "L440"}, {"lec": "L4", "t": "mc", "q": "On the adopter categories figure, which category is 13.5% of all adopters?", "o": ["Early adopters", "Innovators", "Early mainstream", "Lagging adopters"], "e": "Figure 5.6.", "id": "L441"}, {"lec": "L4", "t": "mc", "q": "Social classes are measured as a combination of...", "o": ["Occupation, income, education, wealth and other variables", "Age, gender and location", "Lifestyle and personality", "Family size and role"], "e": "Lecture 4.", "id": "L442"}, {"lec": "L4", "t": "mc", "q": "Word of mouth, opinion leaders, influencer marketing and online social networks are examples of which social factor?", "o": ["Groups and social networks", "Family", "Roles and status", "Social class"], "e": "Lecture 4.", "id": "L443"}, {"lec": "L4", "t": "mc", "q": "Which defines an attitude?", "o": ["A person's relatively consistent evaluations, feelings and tendencies toward an object or idea", "A descriptive thought a person has about something", "A need sufficiently pressing to direct the person", "The process by which people select, organize and interpret information"], "e": "Lecture 4 definition.", "id": "L444"}, {"lec": "L4", "t": "mc", "q": "Postpurchase behavior depends on...", "o": ["The consumer's satisfaction or dissatisfaction after the purchase", "The price of the product only", "The number of competing brands", "The stage of the product life cycle"], "e": "Lecture 4 definition.", "id": "L445"}, {"lec": "CASES", "t": "tf", "q": "According to the Google Glass article, the fundamental reason Glass bombed was that Google failed to do quality market research.", "a": true, "e": "The team never researched which customer Glass was for and which needs it fulfilled.", "id": "CASES01"}, {"lec": "CASES", "t": "mc", "q": "Which two things did the Glass team never figure out through market research, according to the article?", "o": ["Which kind of customer Glass was created for and which of that customer's needs it fulfilled", "The best retail price and the best color range", "The best battery size and the best screen resolution", "The best retail partner and the best country to launch in"], "e": "Google Glass article.", "id": "CASES02"}, {"lec": "CASES", "t": "mc", "q": "How much did the Glass Explorer program charge tech insiders for the headset?", "o": ["$1,500", "$150", "$500", "$5,000"], "e": "Google Glass article.", "id": "CASES03"}, {"lec": "CASES", "t": "mc", "q": "The Explorer program, which gave Glass first to tech insiders at a high price, unintentionally positioned Glass as...", "o": ["A tool for wealthy geeks, not ordinary consumers", "A mass market product for everyday use", "A medical device for professionals", "A low cost gadget for students"], "e": "Google Glass article.", "id": "CASES04"}, {"lec": "CASES", "t": "tf", "q": "The first Glass commercials clearly showed which customer needs Glass would satisfy.", "a": false, "e": "The ad focused on adrenaline situations and never clarified which needs Glass fulfilled.", "id": "CASES05"}, {"lec": "CASES", "t": "mc", "q": "In which month and year did Google pull the Glass headset, according to the article?", "o": ["January 2015", "May 2014", "February 2012", "November 2014"], "e": "It was released to the public in May 2014 and pulled in January 2015.", "id": "CASES06"}, {"lec": "CASES", "t": "mc", "q": "In the Fitbit case, competition from the Apple Watch is which kind of environmental factor?", "o": ["Microenvironment (competitors)", "Macroenvironment (cultural force)", "Macroenvironment (demographic force)", "Microenvironment (suppliers)"], "e": "Fitbit case, chapter 3 environment.", "id": "CASES07"}, {"lec": "CASES", "t": "mc", "q": "Fitbit's concern about HIPAA compliance and unregulated tracker data is mainly which macroenvironment force?", "o": ["Political (laws and regulation)", "Demographic", "Natural", "Cultural"], "e": "Fitbit case.", "id": "CASES08"}, {"lec": "CASES", "t": "mc", "q": "Companies that buy Fitbits in bulk for employee wellness programs are which microenvironment actor?", "o": ["Customer markets (business customers)", "Suppliers", "Marketing intermediaries", "Competitors"], "e": "Fitbit case.", "id": "CASES09"}, {"lec": "CASES", "t": "tf", "q": "The Fitbit case says corporate sales account for about 10 percent of Fitbit revenues.", "a": true, "e": "Fitbit case.", "id": "CASES10"}, {"lec": "CASES", "t": "tf", "q": "The Fitbit case concludes that a fitness tracker is a product that competitors like Apple cannot easily copy.", "a": false, "e": "The case says a fitness tracker is not a product but a feature.", "id": "CASES11"}, {"lec": "CASES", "t": "tf", "q": "Fitbit made user information private by default after early information was public by default.", "a": true, "e": "Fitbit case, privacy issues.", "id": "CASES12"}, {"lec": "CASES", "t": "mc", "q": "Compared with hardware companies like Garmin, what did Fitbit's founders put more into?", "o": ["The software", "The packaging", "The retail stores", "The advertising"], "e": "Fitbit case.", "id": "CASES13"}, {"lec": "CASES", "t": "tf", "q": "GoldieBlox toys are designed for boys ages 3 through 11.", "a": false, "e": "They are designed for girls ages 3 through 11.", "id": "CASES14"}, {"lec": "CASES", "t": "mc", "q": "GoldieBlox construction sets are described as part erector set and part...", "o": ["Storybook", "Board game", "Video game", "Puzzle book"], "e": "GoldieBlox case.", "id": "CASES15"}, {"lec": "CASES", "t": "mc", "q": "What is the main criticism that critics make of GoldieBlox?", "o": ["That it uses princess culture and pink stereotypes to sell STEM toys, so it may not really change the stereotypes", "That its toys are far too expensive for families", "That it sells only through its own online store", "That it ignores girls and targets only boys"], "e": "GoldieBlox case.", "id": "CASES16"}, {"lec": "CASES", "t": "tf", "q": "Debbie Sterling says there is nothing wrong with being a princess and that girls can build their own castles too.", "a": true, "e": "GoldieBlox case.", "id": "CASES17"}, {"lec": "CASES", "t": "mc", "q": "Toy aisles split into pink for girls and blue for boys reflect gender expectations learned from family and society. Which factor group does this MOST directly illustrate?", "o": ["Cultural factors", "Personal factors such as age and life cycle stage", "Psychological factors such as perception", "Economic situation"], "e": "GoldieBlox case the discussion question on gender and Lecture 4: culture is learned from family and other important institutions.", "id": "CASES18"}, {"lec": "CASES", "t": "mc", "q": "How fast did the GoldieBlox Kickstarter campaign reach its funding goal?", "o": ["In four days", "In one day", "In two weeks", "In three months"], "e": "GoldieBlox case.", "id": "CASES19"}, {"lec": "L1", "t": "tf", "q": "Under the marketing concept, a company first builds a product and then looks for buyers through aggressive selling.", "a": false, "e": "That is the selling concept. The marketing concept starts from customer needs.", "id": "L140"}, {"lec": "L1", "t": "tf", "q": "Customer equity is the value of the entire stream of purchases a single customer makes over a lifetime.", "a": false, "e": "That is customer lifetime value. Equity is all customers combined.", "id": "L141"}, {"lec": "L2", "t": "tf", "q": "The microenvironment consists of the larger societal forces such as demographic, economic and natural forces.", "a": false, "e": "Those form the macroenvironment.", "id": "L238"}, {"lec": "L2", "t": "tf", "q": "Generation Z is called the 'Latchkey Kids' on the generation timeline slide.", "a": false, "e": "Latchkey Kids is Generation X. Generation Z are the Digital Natives.", "id": "L239"}, {"lec": "L3", "t": "tf", "q": "Primary data is information that already exists, collected for another purpose.", "a": false, "e": "That is secondary data.", "id": "L344"}, {"lec": "L3", "t": "tf", "q": "Descriptive questions such as 'What is your opinion of Brand X?' are closed ended questions.", "a": false, "e": "Open ended questions let people answer in their own words. A 1 to 5 rating is closed ended.", "id": "L345"}, {"lec": "L3", "t": "tf", "q": "Competitive marketing intelligence is information taken from the company's own internal databases.", "a": false, "e": "It is publicly available information about consumers, competitors and the environment.", "id": "L346"}, {"lec": "L4", "t": "tf", "q": "Habitual buying behavior occurs when involvement is high and brands differ a lot.", "a": false, "e": "Habitual is low involvement with few differences between brands.", "id": "L446"}, {"lec": "L4", "t": "tf", "q": "The five brand personality traits include sincerity, excitement, competence, sophistication and humility.", "a": false, "e": "The fifth is ruggedness, not humility.", "id": "L447"}, {"lec": "L4", "t": "tf", "q": "Selective distortion means remembering only the good points made about a brand.", "a": false, "e": "That is selective retention.", "id": "L448"}, {"lec": "CASES", "t": "tf", "q": "The Google Glass article says Glass was pulled from the market in 2012.", "a": false, "e": "Glass launched in beta in 2012, was released to the public in 2014 and pulled in January 2015.", "id": "CASES20"}, {"lec": "CASES", "t": "tf", "q": "GoldieBlox funded its first production run through a bank loan.", "a": false, "e": "It used a Kickstarter crowdfunding campaign.", "id": "CASES21"}, {"lec": "CASES", "t": "tf", "q": "In the Fitbit case, user information was private by default from the very start.", "a": false, "e": "Early information was public by default and was later changed to private.", "id": "CASES22"}];
const LABELS = {L1:"Lecture 1 Introduction",L2:"Lecture 2 Environment",L3:"Lecture 3 Information",L4:"Lecture 4 Consumer behavior",CASES:"Three cases"};
const KEY = "marketing-quiz-v1";
const app = document.getElementById("app");

function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return {seen:{},missed:{},hist:[],theme:""}; }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function applyTheme(){ if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); else document.documentElement.removeAttribute("data-theme"); }
applyTheme();

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

let run = null;

function pool(section){
  if(section==="ALL") return Q.slice();
  if(section==="MISSED") return Q.filter(q=>S.missed[q.id]);
  return Q.filter(q=>q.lec===section);
}
function startRun(section, mode){
  let items;
  if(mode==="exam"){
    items = shuffle(Q.filter(q=>q.t==="tf")).slice(0,10).concat(shuffle(Q.filter(q=>q.t==="mc")).slice(0,20));
    items = shuffle(items);
  } else {
    items = shuffle(pool(section));
    if(mode==="fifty") items = items.slice(0,50);
  }
  if(!items.length){ run=null; home("Nothing missed yet. Do a round first."); return; }
  run = {items, i:0, correct:0, wrong:[], mode, section, answered:false, started:Date.now(), deadline: mode==="exam"? Date.now()+30*60*1000 : 0, tick:null, optOrder:null};
  if(mode==="exam") run.tick = setInterval(tickTimer, 1000);
  showQ();
}
function tickTimer(){
  if(!run || run.mode!=="exam"){ return; }
  const left = Math.max(0, run.deadline-Date.now());
  const el = document.getElementById("timer");
  if(el){ const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000); el.textContent = m+":"+String(s).padStart(2,"0"); el.className = "timer"+(left<300000?" low":""); }
  if(left<=0){ finish(true); }
}

function home(msg){
  if(run && run.tick) clearInterval(run.tick);
  run=null;
  const total=Q.length, seen=Object.keys(S.seen).length, missed=Object.keys(S.missed).length;
  const counts={}; Q.forEach(q=>counts[q.lec]=(counts[q.lec]||0)+1);
  const last = S.hist.slice(-5).reverse();
  app.innerHTML = `
  <div class="top"><h1>Marketing Midterm 1 Practice</h1><button class="iconbtn" id="th" aria-label="Change theme">Theme</button></div>
  <p class="sub">${total} original questions built only from the Canvas slides and the three cases. Exam: Mon 9 Nov, 17:00, 30 questions, 30 minutes (10 True or False, 20 multiple choice).</p>
  ${msg?`<div class="hint">${esc(msg)}</div>`:""}
  <div class="grid" style="margin-top:12px">
    <button class="tile main wide" data-go="fifty:ALL"><b>Quick round: 50 random questions</b><span>About 30 minutes. Instant feedback after every answer.</span></button>
    <button class="tile wide" data-go="exam:ALL"><b>Exam simulation</b><span>10 True or False plus 20 multiple choice, 30 minute timer, score at the end.</span></button>
    <button class="tile" data-go="all:L1"><b>Lecture 1</b><span>${counts.L1} questions</span></button>
    <button class="tile" data-go="all:L2"><b>Lecture 2</b><span>${counts.L2} questions</span></button>
    <button class="tile" data-go="all:L3"><b>Lecture 3</b><span>${counts.L3} questions</span></button>
    <button class="tile" data-go="all:L4"><b>Lecture 4</b><span>${counts.L4} questions</span></button>
    <button class="tile" data-go="all:CASES"><b>Three cases</b><span>${counts.CASES} questions</span></button>
    <button class="tile" data-go="all:MISSED"><b>My missed ones</b><span>${missed} waiting</span></button>
    <button class="tile wide" data-go="all:ALL"><b>Endless drill, everything</b><span>Every question once, shuffled. Stop any time.</span></button>
  </div>
  <div class="card">
    <div class="meta"><span>Questions seen at least once</span><span>${seen} of ${total}</span></div>
    <div class="bar"><i style="width:${Math.round(100*seen/total)}%"></i></div>
    ${last.length?`<h2 style="font-size:18px;margin-top:16px">Recent rounds</h2><table>${last.map(h=>`<tr><td>${esc(h.d)}</td><td>${esc(h.n)}</td><td><b>${h.c} of ${h.t}</b></td></tr>`).join("")}</table>`:""}
  </div>
  <p class="sub" style="margin-top:14px">Method: read the answer options, say your answer out loud, then tap. When you miss one, say the correct answer out loud and move on. Note only the question number if you want to.</p>`;
  document.getElementById("th").onclick=()=>{ S.theme = S.theme==="dark"?"light":(S.theme==="light"?"":"dark"); save(); applyTheme(); };
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const [m,s]=b.dataset.go.split(":"); startRun(s,m); });
}

function showQ(){
  const q = run.items[run.i];
  run.answered=false;
  const n=run.items.length;
  let body="";
  if(q.t==="tf"){
    body = `<div class="tfrow"><button class="opt" data-v="true">True</button><button class="opt" data-v="false">False</button></div>`;
    run.optOrder=null;
  } else {
    const order = shuffle(q.o.map((t,i)=>({t,i})));
    run.optOrder = order;
    body = order.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("");
  }
  app.innerHTML = `
  <div class="meta"><button class="iconbtn" id="quit">Stop</button><span>${run.i+1} of ${n}</span>${run.mode==="exam"?`<span class="timer" id="timer"></span>`:`<span>${run.correct} correct</span>`}</div>
  <div class="bar"><i style="width:${Math.round(100*run.i/n)}%"></i></div>
  <div class="card">
    <div class="meta"><span class="tag">${esc(LABELS[q.lec])}</span><span>${q.t==="tf"?"True or False":"Multiple choice"}</span></div>
    <div class="q">${esc(q.q)}</div>
    <div id="opts">${body}</div>
    <div id="fb"></div>
  </div>`;
  document.getElementById("quit").onclick=()=>{ if(run.i>0) finish(false); else home(); };
  app.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>answer(b));
  if(run.mode==="exam") tickTimer();
}

function answer(btn){
  if(run.answered) return;
  const q = run.items[run.i];
  run.answered=true;
  let ok, picked, correctBtn;
  const btns=[...app.querySelectorAll("#opts .opt")];
  if(q.t==="tf"){
    picked = btn.dataset.v==="true";
    ok = picked===q.a;
    correctBtn = btns.find(b=>b.dataset.v===String(q.a));
  } else {
    const o = run.optOrder[+btn.dataset.k];
    ok = o.i===0;
    correctBtn = btns[run.optOrder.findIndex(x=>x.i===0)];
  }
  S.seen[q.id]=1;
  if(ok){ run.correct++; delete S.missed[q.id]; } else { run.wrong.push(q.id); S.missed[q.id]=1; }
  save();
  if(run.mode==="exam"){
    btns.forEach(b=>b.disabled=true);
    btn.classList.add("good");
    btn.style.borderColor="var(--accent)"; btn.classList.remove("good"); btn.style.background="var(--accent-soft)";
    document.getElementById("fb").innerHTML = `<button class="next" id="nx">${run.i+1===run.items.length?"Finish":"Next"}</button>`;
  } else {
    btns.forEach(b=>b.disabled=true);
    correctBtn.classList.add("good");
    if(!ok) btn.classList.add("bad");
    document.getElementById("fb").innerHTML = `<div class="fb ${ok?"good":"bad"}"><b>${ok?"Correct.":"Not quite. Say the correct answer out loud."}</b>${esc(q.e)}</div><button class="next" id="nx">${run.i+1===run.items.length?"Finish":"Next"}</button>`;
  }
  document.getElementById("nx").onclick=next;
  document.getElementById("nx").focus();
}
function next(){
  run.i++;
  if(run.i>=run.items.length) finish(false); else showQ();
}
function finish(timeUp){
  if(run && run.tick) clearInterval(run.tick);
  const answeredCount = Math.min(run.items.length, run.i + ((run.answered && run.i<run.items.length)?1:0));
  const total = run.mode==="exam" ? run.items.length : Math.max(answeredCount,1);
  const c = run.correct;
  const pct = Math.round(100*c/total);
  const d = new Date();
  const name = run.mode==="exam"?"Exam simulation":(run.mode==="fifty"?"Quick round":(run.section==="ALL"?"Everything":(run.section==="MISSED"?"Missed":LABELS[run.section])));
  S.hist.push({d:d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), n:name, c, t:total});
  S.hist = S.hist.slice(-30); save();
  const wrongItems = run.wrong.map(id=>Q.find(q=>q.id===id));
  const review = wrongItems.length ? `<h2 style="font-size:18px;margin-top:18px">Review what you missed</h2>` + wrongItems.map(q=>{
    const ans = q.t==="tf" ? (q.a?"True":"False") : q.o[0];
    return `<div class="card" style="margin-top:8px"><div style="font-weight:600">${esc(q.q)}</div><div class="fb good" style="margin-top:8px"><b>Answer: ${esc(ans)}</b>${esc(q.e)}</div></div>`;
  }).join("") : "";
  const ex = run.mode==="exam";
  const lastRun = run;
  app.innerHTML = `
  <div class="card">
    ${timeUp?`<div class="hint">Time is up. Unanswered questions count as wrong.</div>`:""}
    <div class="big">${c} of ${total}</div>
    <p class="sub" style="margin-top:8px">${pct} percent${ex?" in the exam simulation":""}.</p>
    <div class="row">
      ${wrongItems.length?`<button class="ghost" id="redo">Redo the ${wrongItems.length} missed</button>`:""}
      <button class="ghost" id="again">Go again</button>
      <button class="ghost" id="hm">Home</button>
    </div>
  </div>${review}`;
  document.getElementById("hm").onclick=()=>home();
  document.getElementById("again").onclick=()=>startRun(lastRun.section, lastRun.mode);
  const r=document.getElementById("redo");
  if(r) r.onclick=()=>{ run={items:shuffle(wrongItems),i:0,correct:0,wrong:[],mode:"all",section:"MISSED",answered:false,started:Date.now(),deadline:0,tick:null,optOrder:null}; showQ(); };
  run=null;
}
home();
</script>
</body>
