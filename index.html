<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EF Buddy</title>
    <style>
        :root {
            --u: 2.1s; /* splash starts to lift: title fades, blur and tint ease away */
            --p: 1.4s; /* panel starts rising a little before the lift */
            --o: 1.6s; /* content starts popping in half a second before the lift, like icons
                          appearing while the swipe up is still in progress */
        }
        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #e4e4e7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 100vh on iOS Safari / Chrome / Google app counts the area hidden
               behind the browser toolbars, which pushes the box off-centre and
               adds a needless scroll. dvh tracks the visible viewport. */
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .container {
            box-sizing: border-box;
            width: 100%;
            text-align: center;
            max-width: 600px;
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2e2e33;
            /* Soft flowing light: three glow layers drift around the box at
               different speeds, so each edge brightens and fades independently. */
            box-shadow:
                0 4px 20px rgba(0,0,0,0.3),
                var(--g1x) var(--g1y) var(--g1b) var(--g1s) rgba(147,197,253,var(--g1a)),
                var(--g2x) var(--g2y) var(--g2b) var(--g2s) rgba(196,181,253,var(--g2a)),
                var(--g3x) var(--g3y) var(--g3b) var(--g3s) rgba(110,231,183,var(--g3a));
            animation:
                intro-box 1.1s cubic-bezier(0.22, 1, 0.36, 1) var(--p) backwards,
                glow1 11s ease-in-out infinite,
                glow2 14s ease-in-out infinite,
                glow3 17s ease-in-out infinite;
        }
        @property --g1x { syntax: '<length>'; inherits: false; initial-value: 0px; }
        @property --g1y { syntax: '<length>'; inherits: false; initial-value: -12px; }
        @property --g1b { syntax: '<length>'; inherits: false; initial-value: 40px; }
        @property --g1s { syntax: '<length>'; inherits: false; initial-value: -6px; }
        @property --g1a { syntax: '<number>'; inherits: false; initial-value: 0.18; }
        @property --g2x { syntax: '<length>'; inherits: false; initial-value: 14px; }
        @property --g2y { syntax: '<length>'; inherits: false; initial-value: 6px; }
        @property --g2b { syntax: '<length>'; inherits: false; initial-value: 46px; }
        @property --g2s { syntax: '<length>'; inherits: false; initial-value: -8px; }
        @property --g2a { syntax: '<number>'; inherits: false; initial-value: 0.12; }
        @property --g3x { syntax: '<length>'; inherits: false; initial-value: -14px; }
        @property --g3y { syntax: '<length>'; inherits: false; initial-value: 10px; }
        @property --g3b { syntax: '<length>'; inherits: false; initial-value: 42px; }
        @property --g3s { syntax: '<length>'; inherits: false; initial-value: -8px; }
        @property --g3a { syntax: '<number>'; inherits: false; initial-value: 0.10; }
        @keyframes glow1 {
            0%, 100% { --g1x: 0px;   --g1y: -14px; --g1b: 36px; --g1s: -6px;  --g1a: 0.20; }
            25%      { --g1x: 16px;  --g1y: -6px;  --g1b: 54px; --g1s: -2px;  --g1a: 0.28; }
            50%      { --g1x: 6px;   --g1y: 10px;  --g1b: 30px; --g1s: -10px; --g1a: 0.08; }
            75%      { --g1x: -14px; --g1y: -4px;  --g1b: 48px; --g1s: -4px;  --g1a: 0.18; }
        }
        @keyframes glow2 {
            0%, 100% { --g2x: 14px;  --g2y: 6px;   --g2b: 46px; --g2s: -8px;  --g2a: 0.10; }
            33%      { --g2x: -4px;  --g2y: 16px;  --g2b: 60px; --g2s: -2px;  --g2a: 0.22; }
            66%      { --g2x: -16px; --g2y: -8px;  --g2b: 34px; --g2s: -10px; --g2a: 0.06; }
        }
        @keyframes glow3 {
            0%, 100% { --g3x: -14px; --g3y: 10px;  --g3b: 42px; --g3s: -8px;  --g3a: 0.06; }
            40%      { --g3x: 8px;   --g3y: -12px; --g3b: 56px; --g3s: -3px;  --g3a: 0.18; }
            70%      { --g3x: 16px;  --g3y: 12px;  --g3b: 32px; --g3s: -10px; --g3a: 0.10; }
        }
        /* Intro: the panel rises and comes into focus, then its contents
           drift in one after another. */
        @keyframes intro-box {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: none;
                filter: blur(0);
            }
        }
        @keyframes intro-item {
            from {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: none;
                filter: blur(0);
            }
        }
        .container > .lead,
        .button-group > .btn,
        .container > .status,
        .container > .schedule,
        .container > .footer {
            animation: intro-item 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }
        .container > .lead { animation-delay: calc(var(--o) + 0.4s); }
        .button-group > .btn:nth-child(1) { animation-delay: calc(var(--o) + 0.65s); }
        .button-group > .btn:nth-child(2) { animation-delay: calc(var(--o) + 0.75s); }
        .button-group > .btn:nth-child(3) { animation-delay: calc(var(--o) + 0.85s); }
        .button-group > .btn:nth-child(4) { animation-delay: calc(var(--o) + 0.95s); }
        .button-group > .btn:nth-child(5) { animation-delay: calc(var(--o) + 1.05s); }
        /* Finished guides fade in already faded and grey, so they never
           flash green and then snap to the dimmed look. */
        @keyframes intro-item-done {
            from {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(6px) saturate(0.5);
            }
            to {
                opacity: 0.45;
                transform: none;
                filter: blur(0) saturate(0.5);
            }
        }
        .button-group > .btn.btn-done { animation-name: intro-item-done; }
        .container > .status { animation-delay: calc(var(--o) + 1.15s); }
        .container > .schedule { animation-delay: calc(var(--o) + 1.3s); }
        .container > .footer { animation-delay: calc(var(--o) + 1.45s); }
        @media (prefers-reduced-motion: reduce) {
            .container,
            .container > h1,
            .container > p,
            .button-group > .btn,
            .container > .status,
            .container > .schedule,
            .container > .footer { animation: none; }
        }
        /* Lead line: the old welcome heading's look, scaled down to an H2. */
        .lead {
            color: #ffffff;
            margin: 0 0 30px;
            font-size: 1.4rem;
            text-wrap: balance;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        /* Liquid glass buttons: translucent tinted fill, frosted blur,
           a bright top-edge highlight and a soft sheen that slides on hover. */
        .btn {
            --tint: 147, 197, 253;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            display: inline-block;
            padding: 14px 32px;
            min-width: 140px;
            color: #f4f4f5;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.02) 100%),
                radial-gradient(120% 140% at 50% 120%, rgba(var(--tint), 0.35) 0%, rgba(var(--tint), 0.08) 60%, transparent 100%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            backdrop-filter: blur(14px) saturate(160%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(255, 255, 255, 0.06),
                inset 0 0 18px rgba(var(--tint), 0.12),
                0 8px 24px rgba(0, 0, 0, 0.35),
                0 0 22px rgba(var(--tint), 0.12);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.22) 48%, transparent 66%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(var(--tint), 0.45);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.45),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08),
                inset 0 0 22px rgba(var(--tint), 0.2),
                0 12px 30px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(var(--tint), 0.28);
        }
        .btn:hover::before { transform: translateX(120%); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn:focus-visible {
            outline: 2px solid rgba(var(--tint), 0.8);
            outline-offset: 3px;
        }
        .btn-law { --tint: 110, 231, 183; }
        /* Finished midterm guides: still clickable, but faded. */
        .btn-done { opacity: 0.45; filter: saturate(0.5); }
        .btn-done:hover { opacity: 0.8; }
        .btn-disabled,
        .btn-disabled:hover,
        .btn-disabled:active {
            --tint: 161, 161, 170;
            color: rgba(244, 244, 245, 0.55);
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            cursor: not-allowed;
            transform: none;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 6px 18px rgba(0, 0, 0, 0.3);
        }
        .btn-disabled::before,
        .btn-disabled:hover::before { transform: translateX(-120%); }
        @media (prefers-reduced-motion: reduce) {
            .btn, .btn::before { transition: none; }
        }

        /* Upcoming exams: one liquid glass panel under the status line. */
        .schedule {
            --tint: 147, 197, 253;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            margin-top: 28px;
            padding: 18px 18px 14px;
            text-align: left;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.02) 100%),
                radial-gradient(120% 90% at 50% 130%, rgba(var(--tint), 0.22) 0%, rgba(var(--tint), 0.05) 60%, transparent 100%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            backdrop-filter: blur(14px) saturate(160%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05),
                inset 0 0 24px rgba(var(--tint), 0.08),
                0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .schedule-title {
            margin: 0 0 10px 6px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #a1a1aa;
        }
        .schedule ul { list-style: none; margin: 0; padding: 0; }
        .exam {
            --c: 161, 161, 170;
            display: grid;
            grid-template-columns: 46px 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 9px 8px;
            border-radius: 14px;
            transition: background 0.2s ease;
        }
        .exam + .exam { border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .exam:hover { background: rgba(255, 255, 255, 0.04); }
        .exam-date {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 13px;
            border: 1px solid rgba(var(--c), 0.35);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02)),
                rgba(var(--c), 0.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
            line-height: 1;
        }
        .exam-date b { font-size: 1.15rem; color: #fff; font-weight: 700; }
        .exam-date i {
            margin-top: 3px;
            font-style: normal;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(var(--c), 1);
            font-weight: 700;
        }
        .exam-main { min-width: 0; }
        .exam-name { font-size: 0.98rem; font-weight: 600; color: #f4f4f5; }
        .exam-sub { margin-top: 2px; font-size: 0.8rem; color: #8b8b94; }
        .exam-chip {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            color: rgba(var(--c), 1);
            background: rgba(var(--c), 0.12);
            border: 1px solid rgba(var(--c), 0.25);
        }
        .exam-chip.soon { background: rgba(var(--c), 0.22); }
        .schedule-note {
            margin: 10px 6px 0;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.78rem;
            color: #71717a;
        }
        @media (max-width: 420px) {
            .exam { grid-template-columns: 42px 1fr; }
            .exam-chip { grid-column: 2; justify-self: start; }
        }
        .footer {
            margin-top: 36px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px 24px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #52525b;
        }
        /* Status line under the buttons. */
        .status {
            margin-top: 22px;
            /* Slightly larger than the 16px clock. */
            font-size: 1.2rem;
            line-height: 1;
            color: #71717a;
            letter-spacing: 0.02em;
        }
        /* Flat clock: light grey ring and hand. The hand ticks a quarter turn
           (12, 3, 6, 9) and wobbles a little each time it lands. */
        .status-clock {
            position: relative;
            display: inline-block;
            box-sizing: border-box;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: 0;
            border: 2px solid #c9c9cf;
            border-radius: 50%;
        }
        .status-clock::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 50%;
            width: 2px;
            height: 4px;
            margin-left: -1px;
            border-radius: 1px;
            background: #c9c9cf;
            transform-origin: 50% 100%;
            animation: clock-tick 8s ease-in-out infinite;
        }
        @keyframes clock-tick {
            0% { transform: rotate(0deg); }
            13% { transform: rotate(0deg); }
            15.5% { transform: rotate(100deg); }
            18% { transform: rotate(85deg); }
            20.5% { transform: rotate(93deg); }
            23% { transform: rotate(89deg); }
            25% { transform: rotate(90deg); }
            38% { transform: rotate(90deg); }
            40.5% { transform: rotate(190deg); }
            43% { transform: rotate(175deg); }
            45.5% { transform: rotate(183deg); }
            48% { transform: rotate(179deg); }
            50% { transform: rotate(180deg); }
            63% { transform: rotate(180deg); }
            65.5% { transform: rotate(280deg); }
            68% { transform: rotate(265deg); }
            70.5% { transform: rotate(273deg); }
            73% { transform: rotate(269deg); }
            75% { transform: rotate(270deg); }
            88% { transform: rotate(270deg); }
            90.5% { transform: rotate(370deg); }
            93% { transform: rotate(355deg); }
            95.5% { transform: rotate(363deg); }
            98% { transform: rotate(359deg); }
            100% { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .status-clock::before { animation: none; }
        }

        /* Splash: dark blurred veil with the title sweeping in light, then it
           fades away and reveals the page. */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background-color: rgba(14, 14, 16, 0.7);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
            animation: splash-out 1s cubic-bezier(0.32, 0.72, 0, 1) var(--u) forwards;
        }
        /* Unlock: the veil does not just vanish, the blur and tint ease away
           so the page underneath sharpens into view. */
        @keyframes splash-out {
            from {
                background-color: rgba(14, 14, 16, 0.7);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                backdrop-filter: blur(14px) saturate(140%);
            }
            99% { visibility: visible; }
            to {
                background-color: rgba(14, 14, 16, 0);
                -webkit-backdrop-filter: blur(0px) saturate(100%);
                backdrop-filter: blur(0px) saturate(100%);
                visibility: hidden;
            }
        }
        @keyframes splash-title-out {
            to { opacity: 0; transform: scale(1.08); filter: blur(8px); }
        }
        .splash-title {
            margin: 0;
            font-size: clamp(2.4rem, 11vw, 3.6rem);
            font-weight: 800;
            letter-spacing: -0.01em;
            text-align: center;
            color: #8b8b94;
            background-image: linear-gradient(
                100deg,
                #6b6b74 0%,
                #6b6b74 40%,
                rgba(255, 255, 255, 0.98) 50%,
                #6b6b74 60%,
                #6b6b74 100%
            );
            background-size: 300% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:
                splash-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards,
                splash-wave 1.7s ease-in-out 0.4s forwards,
                splash-title-out 0.6s cubic-bezier(0.32, 0.72, 0, 1) var(--u) forwards;
        }
        @keyframes splash-in {
            from { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(8px); }
            to   { opacity: 1; transform: none; filter: blur(0); }
        }
        @keyframes splash-wave {
            from { background-position: 100% 0; }
            to   { background-position: 0% 0; }
        }
        @media (max-width: 600px) {
            .splash { padding: 32px; }
            .splash-title { font-size: clamp(2.1rem, 9.5vw, 2.8rem); }
        }
        @media (prefers-reduced-motion: reduce) {
            .splash { display: none; }
            :root { --o: 0s; --u: 0s; --p: 0s; }
        }
        .footer-brand {
            color: #71717a;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .footer-sep {
            color: #3f3f46;
            margin: 0 4px;
        }
        /* "More courses to come..." with a soft white wave that sweeps
           through the letters every few seconds. */
        .footer-note {
            font-style: italic;
            padding-right: 2px; /* keep the italic tail inside the clip */
            color: #52525b;
            background-image: linear-gradient(
                100deg,
                #52525b 0%,
                #52525b 40%,
                rgba(255, 255, 255, 0.95) 50%,
                #52525b 60%,
                #52525b 100%
            );
            background-size: 300% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: note-wave 4.5s ease-in-out 1.8s infinite;
        }
        @keyframes note-wave {
            0%        { background-position: 100% 0; }
            55%, 100% { background-position: 0% 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .footer-note { animation: none; }
        }
        /* Phones and other tall/narrow screens: stack and centre the footer. */
        @media (max-width: 600px), (orientation: portrait) and (max-aspect-ratio: 3/4) {
            .container { padding: 32px 24px; }
            .footer {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="splash" aria-hidden="true"><h1 class="splash-title">EF Buddy</h1></div>

    <div class="container">
        <h2 class="lead">Please choose what you wanna learn &amp; practice:</h2>
        
        <div class="button-group">
            <a href="math.html" class="btn btn-law">Math 1</a>
            <span class="btn btn-disabled" aria-disabled="true" title="Coming soon">Operations Management</span>
            <a href="statistical-analysis.html" class="btn btn-law">Statistical Analysis</a>
            <a href="marketing.html" class="btn btn-law btn-done" title="Midterm done">Marketing 1</a>
            <a href="law.html" class="btn btn-law btn-done" title="Midterm done">Law 1</a>
        </div>

        <div class="status"><span class="status-clock" aria-hidden="true"></span>OM scheduled</div>

        <section class="schedule" aria-label="Upcoming exams">
            <h3 class="schedule-title">Upcoming exams</h3>
            <ul id="exam-list"></ul>
            <p class="schedule-note">Math and Operations Management final exam dates are not published yet.</p>
        </section>

        <div class="footer">
            <span class="footer-brand">SEB LU <span class="footer-sep">|</span> International Business</span>
            <span class="footer-note">More courses to come...</span>
        </div>
    </div>


    <script>
    (function () {
        var C = { sa: '110, 231, 183', math: '147, 197, 253', om: '252, 211, 77', mkt: '196, 181, 253' };
        // Source: Canvas syllabi and course info (Ljubljana time, UTC+1 in winter).
        var EXAMS = [
            { c: 'sa',   n: 'Statistical Analysis', t: 'Midterm 1', d: '2026-11-13T13:00:00+01:00', time: '13:00' },
            { c: 'math', n: 'Mathematics',          t: 'Midterm 1', d: '2026-11-18T17:00:00+01:00', time: '17:00' },
            { c: 'om',   n: 'Operations Management', t: 'Midterm', d: '2026-11-23T17:00:00+01:00', time: '17:00' },
            { c: 'mkt',  n: 'Marketing',            t: 'Midterm 2', d: '2026-12-07T17:00:00+01:00', time: '17:00' },
            { c: 'math', n: 'Mathematics',          t: 'Midterm 2', d: '2026-12-15T18:00:00+01:00', time: '18:00' },
            { c: 'sa',   n: 'Statistical Analysis', t: 'Midterm 2', d: '2026-12-18T13:00:00+01:00', time: '13:00' },
            { c: 'mkt',  n: 'Marketing',            t: 'Midterm 3', d: '2027-01-15T13:00:00+01:00', time: '13:00' },
            { c: 'sa',   n: 'Statistical Analysis', t: 'Final exam', d: '2027-01-22T09:00:00+01:00', time: 'or 5 Feb' }
        ];
        var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var ul = document.getElementById('exam-list');
        EXAMS.forEach(function (e) {
            var d = new Date(e.d);
            if (now.getTime() > d.getTime() + 3 * 3600 * 1000) return;
            var day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            var diff = Math.round((day - today) / 86400000);
            var chip = diff <= 0 ? 'Today' : diff === 1 ? 'Tomorrow' : 'in ' + diff + ' days';
            var li = document.createElement('li');
            li.className = 'exam';
            li.style.setProperty('--c', C[e.c]);
            li.innerHTML =
                '<div class="exam-date"><b>' + d.getDate() + '</b><i>' + MON[d.getMonth()] + '</i></div>' +
                '<div class="exam-main"><div class="exam-name">' + e.n + '</div>' +
                '<div class="exam-sub">' + e.t + ' &middot; ' + WD[d.getDay()] + ' &middot; ' + e.time + '</div></div>' +
                '<span class="exam-chip' + (diff <= 3 ? ' soon' : '') + '">' + chip + '</span>';
            ul.appendChild(li);
        });
    })();
    </script>
