<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBLU efbuddy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #e4e4e7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #2e2e33;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p {
            color: #a1a1aa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            min-width: 140px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-law {
            background-color: #059669;
        }
        .btn-law:hover {
            background-color: #047857;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #52525b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to SEBLU efbuddy</h1>
        <p>Please choose what you wanna practice:</p>
        
        <div class="button-group">
            <a href="math.html" class="btn">Math</a>
            <a href="law.html" class="btn btn-law">Law</a>
        </div>

        <div class="footer">
            More to come...
        </div>
    </div>

</body>
</html>
