<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EF Buddy</title>
    <style>
        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #e4e4e7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 100vh on iOS Safari / Chrome / Google app counts the area hidden
               behind the browser toolbars, which pushes the box off-centre and
               adds a needless scroll. dvh tracks the visible viewport. */
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .container {
            box-sizing: border-box;
            width: 100%;
            text-align: center;
            max-width: 600px;
            background: #1a1a1e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2e2e33;
            /* Soft flowing light: three glow layers drift around the box at
               different speeds, so each edge brightens and fades independently. */
            box-shadow:
                0 4px 20px rgba(0,0,0,0.3),
                var(--g1x) var(--g1y) var(--g1b) var(--g1s) rgba(147,197,253,var(--g1a)),
                var(--g2x) var(--g2y) var(--g2b) var(--g2s) rgba(196,181,253,var(--g2a)),
                var(--g3x) var(--g3y) var(--g3b) var(--g3s) rgba(110,231,183,var(--g3a));
            animation:
                intro-box 1.1s cubic-bezier(0.22, 1, 0.36, 1) backwards,
                glow1 11s ease-in-out infinite,
                glow2 14s ease-in-out infinite,
                glow3 17s ease-in-out infinite;
        }
        @property --g1x { syntax: '<length>'; inherits: false; initial-value: 0px; }
        @property --g1y { syntax: '<length>'; inherits: false; initial-value: -12px; }
        @property --g1b { syntax: '<length>'; inherits: false; initial-value: 40px; }
        @property --g1s { syntax: '<length>'; inherits: false; initial-value: -6px; }
        @property --g1a { syntax: '<number>'; inherits: false; initial-value: 0.18; }
        @property --g2x { syntax: '<length>'; inherits: false; initial-value: 14px; }
        @property --g2y { syntax: '<length>'; inherits: false; initial-value: 6px; }
        @property --g2b { syntax: '<length>'; inherits: false; initial-value: 46px; }
        @property --g2s { syntax: '<length>'; inherits: false; initial-value: -8px; }
        @property --g2a { syntax: '<number>'; inherits: false; initial-value: 0.12; }
        @property --g3x { syntax: '<length>'; inherits: false; initial-value: -14px; }
        @property --g3y { syntax: '<length>'; inherits: false; initial-value: 10px; }
        @property --g3b { syntax: '<length>'; inherits: false; initial-value: 42px; }
        @property --g3s { syntax: '<length>'; inherits: false; initial-value: -8px; }
        @property --g3a { syntax: '<number>'; inherits: false; initial-value: 0.10; }
        @keyframes glow1 {
            0%, 100% { --g1x: 0px;   --g1y: -14px; --g1b: 36px; --g1s: -6px;  --g1a: 0.20; }
            25%      { --g1x: 16px;  --g1y: -6px;  --g1b: 54px; --g1s: -2px;  --g1a: 0.28; }
            50%      { --g1x: 6px;   --g1y: 10px;  --g1b: 30px; --g1s: -10px; --g1a: 0.08; }
            75%      { --g1x: -14px; --g1y: -4px;  --g1b: 48px; --g1s: -4px;  --g1a: 0.18; }
        }
        @keyframes glow2 {
            0%, 100% { --g2x: 14px;  --g2y: 6px;   --g2b: 46px; --g2s: -8px;  --g2a: 0.10; }
            33%      { --g2x: -4px;  --g2y: 16px;  --g2b: 60px; --g2s: -2px;  --g2a: 0.22; }
            66%      { --g2x: -16px; --g2y: -8px;  --g2b: 34px; --g2s: -10px; --g2a: 0.06; }
        }
        @keyframes glow3 {
            0%, 100% { --g3x: -14px; --g3y: 10px;  --g3b: 42px; --g3s: -8px;  --g3a: 0.06; }
            40%      { --g3x: 8px;   --g3y: -12px; --g3b: 56px; --g3s: -3px;  --g3a: 0.18; }
            70%      { --g3x: 16px;  --g3y: 12px;  --g3b: 32px; --g3s: -10px; --g3a: 0.10; }
        }
        /* Intro: the panel rises and comes into focus, then its contents
           drift in one after another. */
        @keyframes intro-box {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: none;
                filter: blur(0);
            }
        }
        @keyframes intro-item {
            from {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: none;
                filter: blur(0);
            }
        }
        .container > h1,
        .container > p,
        .button-group > .btn,
        .container > .status,
        .container > .footer {
            animation: intro-item 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }
        .container > h1 { animation-delay: 0.35s; }
        .container > p { animation-delay: 0.5s; }
        .button-group > .btn:nth-child(1) { animation-delay: 0.65s; }
        .button-group > .btn:nth-child(2) { animation-delay: 0.75s; }
        .button-group > .btn:nth-child(3) { animation-delay: 0.85s; }
        .button-group > .btn:nth-child(4) { animation-delay: 0.95s; }
        .button-group > .btn:nth-child(5) { animation-delay: 1.05s; }
        .container > .status { animation-delay: 1.15s; }
        .container > .footer { animation-delay: 1.25s; }
        @media (prefers-reduced-motion: reduce) {
            .container,
            .container > h1,
            .container > p,
            .button-group > .btn,
            .container > .status,
            .container > .footer { animation: none; }
        }
        h1 {
            color: #ffffff;
            /* No default top margin, so the content is optically centred
               inside the panel (equal space above and below). */
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p {
            color: #a1a1aa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        /* Liquid glass buttons: translucent tinted fill, frosted blur,
           a bright top-edge highlight and a soft sheen that slides on hover. */
        .btn {
            --tint: 147, 197, 253;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            display: inline-block;
            padding: 14px 32px;
            min-width: 140px;
            color: #f4f4f5;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.02) 100%),
                radial-gradient(120% 140% at 50% 120%, rgba(var(--tint), 0.35) 0%, rgba(var(--tint), 0.08) 60%, transparent 100%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            backdrop-filter: blur(14px) saturate(160%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(255, 255, 255, 0.06),
                inset 0 0 18px rgba(var(--tint), 0.12),
                0 8px 24px rgba(0, 0, 0, 0.35),
                0 0 22px rgba(var(--tint), 0.12);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.22) 48%, transparent 66%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(var(--tint), 0.45);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.45),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08),
                inset 0 0 22px rgba(var(--tint), 0.2),
                0 12px 30px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(var(--tint), 0.28);
        }
        .btn:hover::before { transform: translateX(120%); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn:focus-visible {
            outline: 2px solid rgba(var(--tint), 0.8);
            outline-offset: 3px;
        }
        .btn-law { --tint: 110, 231, 183; }
        /* Finished midterm guides: still clickable, but faded. */
        .btn-done { opacity: 0.45; filter: saturate(0.5); }
        .btn-done:hover { opacity: 0.8; }
        .btn-disabled,
        .btn-disabled:hover,
        .btn-disabled:active {
            --tint: 161, 161, 170;
            color: rgba(244, 244, 245, 0.55);
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            cursor: not-allowed;
            transform: none;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 6px 18px rgba(0, 0, 0, 0.3);
        }
        .btn-disabled::before,
        .btn-disabled:hover::before { transform: translateX(-120%); }
        @media (prefers-reduced-motion: reduce) {
            .btn, .btn::before { transition: none; }
        }
        .footer {
            margin-top: 36px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px 24px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #52525b;
        }
        /* Status line under the buttons. */
        .status {
            margin-top: 22px;
            font-size: 0.85rem;
            color: #71717a;
            letter-spacing: 0.02em;
        }
        /* Flat clock: light grey ring and hand. The hand ticks a quarter turn
           (12, 3, 6, 9) and wobbles a little each time it lands. */
        .status-clock {
            position: relative;
            display: inline-block;
            box-sizing: border-box;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: -3px;
            border: 2px solid #c9c9cf;
            border-radius: 50%;
        }
        .status-clock::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 50%;
            width: 2px;
            height: 4px;
            margin-left: -1px;
            border-radius: 1px;
            background: #c9c9cf;
            transform-origin: 50% 100%;
            animation: clock-tick 8s ease-in-out infinite;
        }
        @keyframes clock-tick {
            0% { transform: rotate(0deg); }
            13% { transform: rotate(0deg); }
            15.5% { transform: rotate(100deg); }
            18% { transform: rotate(85deg); }
            20.5% { transform: rotate(93deg); }
            23% { transform: rotate(89deg); }
            25% { transform: rotate(90deg); }
            38% { transform: rotate(90deg); }
            40.5% { transform: rotate(190deg); }
            43% { transform: rotate(175deg); }
            45.5% { transform: rotate(183deg); }
            48% { transform: rotate(179deg); }
            50% { transform: rotate(180deg); }
            63% { transform: rotate(180deg); }
            65.5% { transform: rotate(280deg); }
            68% { transform: rotate(265deg); }
            70.5% { transform: rotate(273deg); }
            73% { transform: rotate(269deg); }
            75% { transform: rotate(270deg); }
            88% { transform: rotate(270deg); }
            90.5% { transform: rotate(370deg); }
            93% { transform: rotate(355deg); }
            95.5% { transform: rotate(363deg); }
            98% { transform: rotate(359deg); }
            100% { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .status-clock::before { animation: none; }
        }
        .footer-brand {
            color: #71717a;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .footer-sep {
            color: #3f3f46;
            margin: 0 4px;
        }
        /* "More courses to come..." with a soft white wave that sweeps
           through the letters every few seconds. */
        .footer-note {
            font-style: italic;
            padding-right: 2px; /* keep the italic tail inside the clip */
            color: #52525b;
            background-image: linear-gradient(
                100deg,
                #52525b 0%,
                #52525b 40%,
                rgba(255, 255, 255, 0.95) 50%,
                #52525b 60%,
                #52525b 100%
            );
            background-size: 300% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: note-wave 4.5s ease-in-out 1.8s infinite;
        }
        @keyframes note-wave {
            0%        { background-position: 100% 0; }
            55%, 100% { background-position: 0% 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .footer-note { animation: none; }
        }
        /* Phones and other tall/narrow screens: stack and centre the footer. */
        @media (max-width: 600px), (orientation: portrait) and (max-aspect-ratio: 3/4) {
            .container { padding: 32px 24px; }
            .footer {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to EF Buddy</h1>
        <p>Please choose what you wanna learn &amp; practice:</p>
        
        <div class="button-group">
            <span class="btn btn-disabled" aria-disabled="true" title="Coming soon">Math</span>
            <span class="btn btn-disabled" aria-disabled="true" title="Coming soon">Operations Management</span>
            <a href="statistical-analysis.html" class="btn btn-law">Statistical Analysis</a>
            <a href="marketing.html" class="btn btn-law btn-done" title="Midterm done">Marketing</a>
            <a href="law.html" class="btn btn-law btn-done" title="Midterm done">Law 1</a>
        </div>

        <div class="status"><span class="status-clock" aria-hidden="true"></span>OM scheduled</div>

        <div class="footer">
            <span class="footer-brand">SEB LU <span class="footer-sep">|</span> International Business</span>
            <span class="footer-note">More courses to come...</span>
        </div>
    </div>

</body>
</html>
