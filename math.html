<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Math Midterm 1 Practice</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1d1f24;--muted:#5d6470;--line:#dedbd2;--accent:#1f4fd8;--accent-ink:#fff;--good:#14783c;--good-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;--warn-bg:#fdf0d5;--radius:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
header h1{font-size:1.45rem;margin:0 0 2px}header p{margin:0;color:var(--muted);font-size:.92rem}
#cd{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:600;background:var(--warn-bg);border-radius:8px;padding:4px 10px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
nav button{background:none;border:1px solid transparent;border-radius:8px;padding:8px 13px;font:inherit;color:var(--muted);cursor:pointer}
nav button[aria-selected=true]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
nav button:focus-visible,.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar2{position:sticky;top:8px;z-index:5;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.meta{font-size:.82rem;color:var(--muted)}
.q{font-size:1.05rem;margin:6px 0 14px;line-height:1.9}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}

.paper{background:#fbf8ee;color:#1b2a4a;border:1px solid #d9d2bd;border-radius:8px;padding:10px 16px;margin-top:8px;font-family:"Cambria Math",Cambria,"STIX Two Math","Times New Roman",serif;font-size:1.06rem}

.pb{flex:1;min-width:0;overflow-x:auto}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;text-align:center;line-height:1.25}
.fr .nu{padding:0 .25em;border-bottom:1.4px solid currentColor}.fr .de{padding:0 .25em}
.rad{display:inline-flex;align-items:flex-start;vertical-align:baseline;white-space:nowrap}.rs{font-size:1.12em;line-height:1;margin-right:-.06em;position:relative;top:.06em}.ri{border-top:1.3px solid currentColor;padding:.05em .12em 0;line-height:1.15}
.pm{margin-top:14px}.pt{font:700 1rem system-ui,sans-serif;margin-bottom:4px}
.ptab{width:100%;border-collapse:collapse}.ptab td{padding:8px;border-bottom:1px dashed #d9d2bd;vertical-align:middle;color:#1b2a4a}.ptab .wh{font:.8rem system-ui,sans-serif;color:#6b5f3a;width:24%}.ptab .fo{font-size:1.04rem}
.wkh{font-size:1rem;margin:22px 0 0;color:var(--muted)}

.skw{background:#fbf8ee;border:1px solid #d9d2bd;border-radius:8px;padding:10px 12px;margin:8px 0;color:#1b2a4a}
.skg{display:flex;flex-wrap:wrap;gap:12px}.sk{margin:0;flex:1 1 300px;max-width:360px}.sk figcaption{font:.82rem/1.35 system-ui,sans-serif;color:#3b4561;margin-top:2px}
.sl{margin:4px 0;max-width:320px}
.ptab .fo{line-height:2.1;padding:10px 8px}.ptab sub{font-size:.72em}.ptab sup{font-size:.72em}

.bp{font-size:1.75em;line-height:1;vertical-align:middle;font-weight:300;position:relative;top:-.06em}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin-right:.2em}.lim span{font-size:.62em}
.ix{font-size:.62em;margin-right:-.35em;vertical-align:.9em}
</style>

<body>
<div class="wrap">
<header>
  <h1>Mathematics for Business and Economics: Midterm 1 practice</h1>
  <p>Scope from the Canvas announcement: functions of one variable, the derivative and its applications, functions of two variables. Lectures 1 to 6 (pages 1 to 7), exercises and seminars weeks 1 to 6, combinatorics and integrals excluded.</p>
  <span id="cd"></span>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
</div>
<script>
/* ===== Engine: random, number formatting, answer parser, math layout helpers, sketches ===== */
const R = {
  int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  sign() { return Math.random() < 0.5 ? -1 : 1; },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
};
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
/* Number to a short exact looking string: integers, simple fractions, else rounded decimals */
function toFrac(x, maxDen) {
  maxDen = maxDen || 12;
  for (let d = 1; d <= maxDen; d++) { const n = Math.round(x * d); if (Math.abs(n / d - x) < 1e-9) { const g = gcd(n, d); return [n / g, d / g]; } }
  return null;
}
function fmt(x, dec) {
  if (x === Infinity) return '∞'; if (x === -Infinity) return '−∞';
  if (!isFinite(x)) return '?';
  const f = toFrac(x);
  if (f && f[1] === 1) return neg(String(f[0]));
  if (f && Math.abs(f[0]) < 1000) return neg(f[0] + '/' + f[1]);
  const d = dec == null ? (Math.abs(x) >= 100 ? 2 : 4) : dec;
  let s = (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
  return neg(s);
}
function neg(s) { return s.replace(/^-/, '−'); }
function dec(x, d) { return neg((Math.round(x * 10 ** d) / 10 ** d).toFixed(d)); }
/* Layout helpers: stacked fraction, root, power, signed term */
function fr(n, d) { return '<span class="fr"><span class="nu">' + n + '</span><span class="de">' + d + '</span></span>'; }
function fq(x) { // number as stacked fraction when it is a simple fraction
  const f = toFrac(x); if (f && f[1] !== 1 && Math.abs(f[0]) < 1000) return (f[0] < 0 ? '−' : '') + fr(Math.abs(f[0]), f[1]);
  return fmt(x);
}
function rt(x) { return '<span class="rad"><span class="rs">√</span><span class="ri">' + x + '</span></span>'; }
function sp(b, e) { return b + '<sup>' + e + '</sup>'; }
function sgn(x, first) { // "+ 3" or "− 3" (coefficient display)
  const s = fmt(Math.abs(x)); if (first) return (x < 0 ? '−' : '') + s; return x < 0 ? ' − ' + s : ' + ' + s;
}
/* coefficient times monomial, e.g. term(3,'x²') -> "3x²", term(-1,'x') -> "−x" */
function term(c, mono, first) {
  if (Math.abs(c) < 1e-12) return '';
  const a = Math.abs(c); const cs = (a === 1 && mono) ? '' : fq(a);
  const body = cs + mono;
  if (first) return (c < 0 ? '−' : '') + body;
  return (c < 0 ? ' − ' : ' + ') + body;
}
function poly(terms) { // terms: [[coef, mono], ...]
  let s = '', first = true;
  terms.forEach(t => { const p = term(t[0], t[1], first); if (p) { s += p; first = false; } });
  return s || '0';
}
/* ===== Answer parser: numbers, fractions, + − * / ^, parentheses, sqrt, cbrt, ln, e, pi ===== */
function parseExpr(str) {
  if (str == null) return NaN;
  let s = String(str).trim().toLowerCase().replace(/−/g, '-').replace(/·|×/g, '*').replace(/√/g, 'sqrt').replace(/π/g, 'pi').replace(/\s+/g, '');
  if (!s) return NaN;
  if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  let i = 0;
  function peek() { return s[i]; }
  function eat(c) { if (s[i] === c) { i++; return true; } return false; }
  function num() { const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/); if (!m) return null; i += m[0].length; return parseFloat(m[0]); }
  function atom() {
    if (eat('(')) { const v = add(); if (!eat(')')) throw 0; return v; }
    const n = num(); if (n !== null) return n;
    const fm = s.slice(i).match(/^(sqrt|cbrt|ln|log|exp|e|pi)/);
    if (fm) {
      i += fm[0].length; const f = fm[0];
      if (f === 'e') return Math.E; if (f === 'pi') return Math.PI;
      const arg = (peek() === '(') ? atom() : unary();
      if (f === 'sqrt') return Math.sqrt(arg); if (f === 'cbrt') return Math.cbrt(arg);
      if (f === 'ln' || f === 'log') return Math.log(arg); if (f === 'exp') return Math.exp(arg);
    }
    throw 0;
  }
  function power() { let b = atom(); if (eat('^')) { const e = unary(); b = Math.pow(b, e); } return b; }
  function implicit() { let v = power(); while (i < s.length && /[\d(a-z]/.test(peek()) && !/^[+\-*/^)]/.test(peek())) { v *= power(); } return v; }
  function unary() { if (eat('-')) return -unary(); if (eat('+')) return unary(); return implicit(); }
  function mul() { let v = unary(); for (;;) { if (eat('*')) v *= unary(); else if (eat('/')) v /= unary(); else return v; } }
  function add() { let v = mul(); for (;;) { if (eat('+')) v += mul(); else if (eat('-')) v -= mul(); else return v; } }
  try { const v = add(); if (i !== s.length) return NaN; return v; } catch (e) { return NaN; }
}
function parseList(str) {
  if (str == null) return null; const t = String(str).trim(); if (!t) return null;
  if (/^(none|no|ne|\/|-|—|ø|∅)$/i.test(t)) return [];
  const parts = t.split(/[;,]/).map(x => x.trim()).filter(Boolean);
  const v = parts.map(parseExpr); if (v.some(x => !isFinite(x))) return null; return v.sort((a, b) => a - b);
}
function close(u, a, tol) { if (!isFinite(u) || !isFinite(a)) return false; const t = tol != null ? tol : Math.max(0.011, 0.006 * Math.abs(a)); return Math.abs(u - a) <= t; }
function okPart(p, raw) {
  if (p.kind === 'ch') return String(raw) === String(p.ans);
  if (p.kind === 'list') { const u = parseList(raw); if (!u) return false; const a = p.ans.slice().sort((x, y) => x - y); return u.length === a.length && a.every((x, k) => close(u[k], x, p.tol)); }
  return close(parseExpr(raw), p.ans, p.tol);
}
function ansText(p) {
  if (p.kind === 'ch') return p.opts[p.ans];
  if (p.kind === 'list') return p.ans.length ? p.ans.slice().sort((a, b) => a - b).map(x => p.show ? p.show(x) : fmt(x)).join('; ') : 'none';
  return p.show ? p.show : fmt(p.ans);
}
/* ===== Function sketch (SVG). spec: {f, x0, x1, y0, y1, pts:[{x,y,t,c}], va:[x], ha:y, xl, yl, step, flip, segs} ===== */
let skN = 0;
function plotSvg(s) {
  const W = 340, H = 260, L = 30, Rr = 12, T = 12, B = 26; const id = 'k' + (++skN);
  const X = x => L + (x - s.x0) / (s.x1 - s.x0) * (W - L - Rr), Y = y => T + (s.y1 - y) / (s.y1 - s.y0) * (H - T - B);
  let g = '';
  const st = s.step || 1;
  for (let x = Math.ceil(s.x0 / st) * st; x <= s.x1 + 1e-9; x += st) g += `<line x1="${X(x).toFixed(1)}" y1="${T}" x2="${X(x).toFixed(1)}" y2="${H - B}" stroke="#e6dfc8" stroke-width="1"/>`;
  const sty = s.ystep || st;
  for (let y = Math.ceil(s.y0 / sty) * sty; y <= s.y1 + 1e-9; y += sty) g += `<line x1="${L}" y1="${Y(y).toFixed(1)}" x2="${W - Rr}" y2="${Y(y).toFixed(1)}" stroke="#e6dfc8" stroke-width="1"/>`;
  if (s.y0 <= 0 && s.y1 >= 0) g += `<line x1="${L}" y1="${Y(0).toFixed(1)}" x2="${W - Rr}" y2="${Y(0).toFixed(1)}" stroke="#1b2a4a" stroke-width="1.3"/>`;
  if (s.x0 <= 0 && s.x1 >= 0) g += `<line x1="${X(0).toFixed(1)}" y1="${T}" x2="${X(0).toFixed(1)}" y2="${H - B}" stroke="#1b2a4a" stroke-width="1.3"/>`;
  const lab = (x, y, t, c, a) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a || 'middle'}" font-size="10.5" fill="${c || '#6b5f3a'}" font-family="system-ui,sans-serif" stroke="#fbf8ee" stroke-width="3" paint-order="stroke">${t}</text>`;
  for (let x = Math.ceil(s.x0 / st) * st; x <= s.x1 + 1e-9; x += st) if (Math.abs(x) > 1e-9 && (s.lbl == null || Math.abs(Math.round(x / st)) % s.lbl === 0)) g += lab(X(x), (s.y0 <= 0 && s.y1 >= 0 ? Y(0) : H - B) + 12, fmt(x));
  for (let y = Math.ceil(s.y0 / sty) * sty; y <= s.y1 + 1e-9; y += sty) if (Math.abs(y) > 1e-9 && (s.lbl == null || Math.abs(Math.round(y / sty)) % s.lbl === 0)) g += lab((s.x0 <= 0 && s.x1 >= 0 ? X(0) : L) - 4, Y(y) + 3.5, fmt(y), null, 'end');
  (s.va || []).forEach(a => { g += `<line x1="${X(a).toFixed(1)}" y1="${T}" x2="${X(a).toFixed(1)}" y2="${H - B}" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 4"/>`; });
  if (s.ha != null) g += `<line x1="${L}" y1="${Y(s.ha).toFixed(1)}" x2="${W - Rr}" y2="${Y(s.ha).toFixed(1)}" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  if (s.f) {
    let d = '', pen = false; const n = 400; const lo = s.d0 != null ? s.d0 : s.x0, hi = s.d1 != null ? s.d1 : s.x1;
    for (let k = 0; k <= n; k++) {
      const x = lo + (hi - lo) * k / n; const y = s.f(x);
      if (!isFinite(y) || y > s.y1 + (s.y1 - s.y0) * 2 || y < s.y0 - (s.y1 - s.y0) * 2) { pen = false; continue; }
      const yy = Math.max(s.y0 - (s.y1 - s.y0) * 0.6, Math.min(s.y1 + (s.y1 - s.y0) * 0.6, y));
      d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(yy).toFixed(1) + ' '; pen = true;
    }
    g += `<clipPath id="${id}"><rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}"/></clipPath><path d="${d}" fill="none" stroke="#1d4fb8" stroke-width="2" clip-path="url(#${id})"/>`;
  }
  (s.segs || []).forEach(q => { g += `<line x1="${X(q[0]).toFixed(1)}" y1="${Y(q[1]).toFixed(1)}" x2="${X(q[2]).toFixed(1)}" y2="${Y(q[3]).toFixed(1)}" stroke="#1d4fb8" stroke-width="2.2"/>`; });
  (s.pts || []).forEach(p => { if (p.x < s.x0 || p.x > s.x1 || p.y < s.y0 || p.y > s.y1) return; g += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.6" fill="${p.c || '#c62828'}"/>`; if (p.t) g += lab(X(p.x) + (p.dx || 0), Y(p.y) - 8 + (p.dy || 0), p.t, p.c || '#c62828', p.a); });
  if (s.xl) g += lab(W - Rr - 2, (s.y0 <= 0 && s.y1 >= 0 ? Y(0) : H - B) - 6, s.xl, '#1b2a4a', 'end');
  if (s.yl) g += lab((s.x0 <= 0 && s.x1 >= 0 ? X(0) : L) + 8, T + 10, s.yl, '#1b2a4a', 'start');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Function sketch">${g}</svg>`;
}
/* sign line (table of signs) for inequalities and monotonicity */
function signLine(pts, signs, var_) {
  const W = 320, H = 54, L = 16, Rr = 16; const n = pts.length; const X = k => L + (k + 1) * (W - L - Rr) / (n + 1);
  let g = `<line x1="${L}" y1="30" x2="${W - Rr}" y2="30" stroke="#1b2a4a" stroke-width="1.3"/><text x="${W - 6}" y="34" font-size="11" fill="#1b2a4a" font-family="system-ui">${var_ || 'x'}</text>`;
  pts.forEach((p, k) => { g += `<line x1="${X(k)}" y1="24" x2="${X(k)}" y2="36" stroke="#1b2a4a" stroke-width="1.3"/><text x="${X(k)}" y="50" text-anchor="middle" font-size="11" fill="#1b2a4a" font-family="system-ui">${p.t}</text>`; if (p.pole) g += `<text x="${X(k)}" y="18" text-anchor="middle" font-size="9.5" fill="#c62828" font-family="system-ui">pole</text>`; });
  signs.forEach((sg, k) => { const x = k === 0 ? (L + X(0)) / 2 : k === n ? (X(n - 1) + W - Rr) / 2 : (X(k - 1) + X(k)) / 2; g += `<text x="${x}" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="${sg === '+' ? '#14783c' : '#b3261e'}" font-family="system-ui">${sg === '+' ? '+' : '−'}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Sign table">${g}</svg>`;
}


/* ===== Problem generators. Each gen(o) returns {intro, parts, steps, sk, _chk}. o = fixed parameters for the class example. ===== */

const N = (label, ans, extra) => Object.assign({ label, ans, kind: 'num' }, extra || {});

function clean(t) { t.intro = fixMinus(t.intro); t.steps = t.steps.map(fixMinus); t.parts.forEach(p => { p.label = fixMinus(p.label); }); return t; }

/* ---------- 1. Graph reading (seminar 5 Oct, problems 1.8, 1.9) ---------- */
function ratParams(o) {
  for (let g = 0; g < 500; g++) {
    const p = o || {};
    const k = p.k != null ? p.k : R.pick([1, 1, 2, -1, 0.5]);
    const zs = p.zs || (R.int(0, 1) ? [R.int(-4, 4), R.int(-4, 4)] : [R.int(-4, 4)]);
    const ps = p.ps || (R.int(0, 1) ? [R.int(-4, 4), R.int(-4, 4)] : [R.int(-4, 4)]);
    if (!o) {
      if (zs.length === 2 && zs[0] === zs[1] && R.int(0, 1)) continue;
      if (ps.some(q => q === 0) || ps.some(q => zs.includes(q))) continue;
    }
    // multiplicities: two equal entries = double
    const num = x => zs.length === 2 ? (x - zs[0]) * (x - zs[1]) : (x - zs[0]) * (zs.length === 1 && ps.length === 2 ? 1 : 1);
    const nd = zs.length, dd = ps.length;
    const f = x => k * zs.reduce((s, z) => s * (x - z), 1) / ps.reduce((s, q) => s * (x - q), 1);
    return { k, zs, ps, f, nd, dd };
  }
}
function multStr(arr, v) {
  const u = [...new Set(arr)].sort((a, b) => a - b);
  return u.map(z => { const m = arr.filter(q => q === z).length; return v + ' = ' + fmt(z) + ' (' + (m === 1 ? 'simple, odd' : 'double, even') + ')'; }).join(', ');
}
function ratStr(P) {
  const fac = (arr) => { const u = [...new Set(arr)]; return u.map(z => { const m = arr.filter(q => q === z).length; const b = z === 0 ? 'x' : '(x' + (z > 0 ? ' − ' + z : ' + ' + (-z)) + ')'; return m === 2 ? (z === 0 ? 'x²' : b + '²') : b; }).join(''); };
  const kk = P.k === 1 ? '' : P.k === -1 ? '−' : fq(P.k);
  return kk + fr(fac(P.zs), fac(P.ps));
}
function ratAsym(P) { return P.nd === P.dd ? P.k : (P.nd < P.dd ? 0 : null); }
function ratView(P) {
  const lo = Math.min(...P.zs, ...P.ps) - 2.5, hi = Math.max(...P.zs, ...P.ps) + 2.5;
  const x0 = Math.min(-5, Math.floor(lo)), x1 = Math.max(5, Math.ceil(hi));
  return { f: P.f, x0, x1, y0: -5, y1: 5, va: [...new Set(P.ps)], ha: ratAsym(P), xl: 'x', yl: 'y', pts: [...new Set(P.zs)].map(z => ({ x: z, y: 0, c: '#14783c' })).concat([{ x: 0, y: P.f(0), c: '#1d4fb8' }]) };
}
CALC.graph = { wk: 'W12', name: 'Reading a graph', src: 'Seminar 5 Oct, problems 1.8 and 1.9', book: { k: 1, zs: [-2, 1], ps: [-1, 3] },
  gen(o) {
    let P, t0;
    for (;;) { P = ratParams(o); if (Math.abs(P.f(0)) <= 4.5 && P.nd <= P.dd) break; if (o) break; }
    const pz = [...new Set(P.ps)];
    do { t0 = R.int(-5, 5); } while (P.ps.includes(t0) || P.zs.includes(t0));
    if (o) t0 = -3;
    const pos = P.f(t0) > 0;
    const asy = ratAsym(P);
    return {
      intro: 'The figure shows the graph of the function f(x) (the red dashed lines are asymptotes, one square is one unit). Read from the graph: the zeros, the poles, the horizontal asymptote, an estimate of the initial value f(0), and whether f is positive or negative at x = ' + fmt(t0) + '.',
      introSk: [{ plot: ratView(P), cap: 'Graph of f(x)' }],
      parts: [LS('Zeros (all x where the graph meets the x axis)', [...new Set(P.zs)]), LS('Poles (vertical asymptotes)', pz), N('Horizontal asymptote y =', asy), N('Initial value f(0), estimate', P.f(0), { tol: 0.3 }), CH('Sign of f(' + fmt(t0) + ')', ['positive', 'negative'], pos ? 0 : 1)],
      steps: [
        B('Zeros') + ': where the graph touches or crosses the x axis: ' + multStr(P.zs, 'x') + '. Crossing means odd multiplicity, touching means even.',
        B('Poles') + ': vertical asymptotes, the function value runs to ±∞: ' + multStr(P.ps, 'x') + '. Sign changes at an odd pole, stays at an even pole.',
        B('Asymptotic behaviour') + ': for x → ±∞ the graph approaches y = ' + fmt(asy) + '.',
        B('Initial value') + ': the point on the y axis, f(0) ≈ ' + dec(P.f(0), 2) + '. (The formula behind this graph is f(x) = ' + ratStr(P) + '.)',
        B('Sign') + ' at x = ' + fmt(t0) + ': the graph is ' + (pos ? 'above' : 'below') + ' the x axis, so f is ' + (pos ? 'positive' : 'negative') + '.'
      ],
      sk: [{ plot: ratView(P), cap: 'Zeros green, initial value blue, asymptotes red' }],

/* ---------- 5. Derivative rules ---------- */
function derivTemplate(o) {
  const T = [
    () => { const a = R.int(-3, 3), b = R.pick([1, 2, -1, 3]); const x0 = R.pick([0, 1]); const f = x => (x * x + a) * Math.exp(b * x), d = x => Math.exp(b * x) * (2 * x + b * (x * x + a));
      return { fs: '(' + poly([[1, 'x²'], [a, '']]) + ')' + ex(fmt(b) === '1' ? 'x' : fmt(b).replace('−1', '−') + 'x'), rule: 'product rule and chain rule: (uv)′ = u′v + uv′', ds: ex(b === 1 ? 'x' : (b === -1 ? '−x' : fmt(b) + 'x')) + '(' + poly([[b, 'x²'], [2, 'x'], [a * b, '']]) + ')', f, d, x0 }; },
    () => { const a = R.int(-3, 3), b = R.int(1, 4); const x0 = R.int(-1, 2); const f = x => (x + a) / (x * x + b), d = x => (-x * x - 2 * a * x + b) / ((x * x + b) ** 2);
      return { fs: fr(poly([[1, 'x'], [a, '']]), poly([[1, 'x²'], [b, '']])), rule: 'quotient rule: (u/v)′ = (u′v − uv′)/v²', ds: fr(poly([[1, 'x²'], [b, '']]) + ' − 2x(' + poly([[1, 'x'], [a, '']]) + ')', '(' + poly([[1, 'x²'], [b, '']]) + ')²') + ' = ' + fr(poly([[-1, 'x²'], [-2 * a, 'x'], [b, '']]), '(' + poly([[1, 'x²'], [b, '']]) + ')²'), f, d, x0 }; },
    () => { const c = R.pick([[1, 9, 4], [1, 16, 3], [3, 1, 1], [1, 7, 3], [2, 1, 2], [5, 4, 3]]); const [a, b, x0] = c; const f = x => Math.sqrt(a * x * x + b), d = x => a * x / Math.sqrt(a * x * x + b);
      return { fs: rt(poly([[a, 'x²'], [b, '']])), rule: 'chain rule: outside √u, inside u = ' + poly([[a, 'x²'], [b, '']]), ds: fr('1', '2' + rt(poly([[a, 'x²'], [b, '']]))) + ' · ' + fmt(2 * a) + 'x = ' + fr(term(a, 'x', true), rt(poly([[a, 'x²'], [b, '']]))), f, d, x0 }; },
    () => { const a = R.int(-3, 3), b = R.int(1, 5); const x0 = R.int(0, 2); const f = x => Math.log(x * x + a * x + b), d = x => (2 * x + a) / (x * x + a * x + b);
      if (x0 * x0 + a * x0 + b <= 0) return null;
      return { fs: 'ln(' + poly([[1, 'x²'], [a, 'x'], [b, '']]) + ')', rule: 'chain rule: (ln u)′ = u′/u', ds: fr(poly([[2, 'x'], [a, '']]), poly([[1, 'x²'], [a, 'x'], [b, '']])), f, d, x0 }; },
    () => { const n = R.int(2, 4); const x0 = R.pick([1, Math.E]); const f = x => x ** n * Math.log(x), d = x => x ** (n - 1) * (n * Math.log(x) + 1);
      return { fs: sp('x', n) + ' ln x', rule: 'product rule', ds: fmt(n) + pw('x', n - 1) + ' ln x + ' + sp('x', n) + ' · ' + fr(1, 'x') + ' = ' + pw('x', n - 1) + '(' + n + ' ln x + 1)', f, d, x0, x0s: x0 === 1 ? '1' : 'e' }; },
    () => { const a = R.pick([1, -1, 2, 0.5]), b = R.int(-3, 3); const x0 = R.pick([0, 1]); const f = x => Math.exp(a * x * x + b * x), d = x => (2 * a * x + b) * Math.exp(a * x * x + b * x);
      return { fs: ex(poly([[a, 'x²'], [b, 'x']])), rule: 'chain rule: (e<sup>u</sup>)′ = e<sup>u</sup> · u′', ds: '(' + poly([[2 * a, 'x'], [b, '']]) + ')' + ex(poly([[a, 'x²'], [b, 'x']])), f, d, x0 }; }
  ];
  for (;;) { const t = R.pick(T)(); if (t) return t; }
}

        intro: 'Use the linear approximation (the differential) to estimate ' + sym + fD(tgt) + '. Use a = ' + A + '.',
        parts: [N('f(a)', f(A)), N('f′(a)', fd(A)), N('Estimate of ' + sym + fD(tgt), est, { tol: 0.002 })],
        steps: [B('Idea') + ': near a, f(x) ≈ f(a) + f′(a)(x − a). Take f(x) = ' + (cube ? 'x<sup>1/3</sup>' : rt('x')) + ', a = ' + A + ', Δx = x − a = ' + fD(d) + '.', 'f(a) = ' + fmt(f(A)), FX + ' = ' + (cube ? fr(1, '3 ∛x²') : fr(1, '2' + rt('x'))) + ' ⇒ f′(' + A + ') = ' + fq(fd(A)), 'f' + pD(tgt) + ' ≈ ' + fmt(f(A)) + ' + ' + fq(fd(A)) + ' · ' + pD(d) + ' = ' + B(dec(est, 4)), 'Exact value: ' + dec(f(tgt), 4) + '. The estimate is good because Δx is small.'],
        sk: [], _chk: { f, fd, A, d, est }

    }
    if (v === 2) {
      const h = R.pick([0.05, 0.1, -0.1, 0.2, -0.05, 0.08]); const est = h;
      return {
        intro: 'Use the differential to estimate ln ' + fD(1 + h) + '. Use a = 1.',

        steps: [B('Idea') + ': f(x) ≈ f(a) + f′(a)(x − a), f(x) = ln x, a = 1, Δx = ' + fD(h) + '.', 'f(1) = ln 1 = 0', FX + ' = ' + fr(1, 'x') + ' ⇒ f′(1) = 1', 'ln ' + fD(1 + h) + ' ≈ 0 + 1 · ' + pD(h) + ' = ' + B(fmt(est)), 'Exact value: ' + dec(Math.log(1 + h), 4) + '.'],
        sk: [], _chk: {}
      };
    }
    const a = R.int(2, 8), b = R.int(2, 5), p0 = R.int(0, b - 1), dp = R.pick([-0.1, 0.1, -0.2, 0.2, 0.3]);
    const D = p => (p + a) ** 2 * (b - p), Dd = p => 2 * (p + a) * (b - p) - (p + a) ** 2;
    const dD = Dd(p0) * dp;
    return {
      intro: 'The demand for a product is D(p) = (p + ' + a + ')²(' + b + ' − p), where p is the price. The current price is p = ' + p0 + '. Use the differential to estimate the change in demand if the price changes by ' + fD(dp) + '.',
      parts: [N('D(' + p0 + ')', D(p0)), N('D′(' + p0 + ')', Dd(p0)), N('Estimated change ΔD ≈ dD', dD, { tol: 0.01 })],
      steps: [B('Differential') + ': ΔD ≈ dD = D′(p₀) · Δp.', 'D(' + p0 + ') = ' + fmt(D(p0)), 'D′(p) = 2(p + ' + a + ')(' + b + ' − p) − (p + ' + a + ')² (product rule)', 'D′(' + p0 + ') = ' + fmt(Dd(p0)), 'ΔD ≈ ' + fmt(Dd(p0)) + ' · ' + pD(dp) + ' = ' + B(fmt(dD)) + '. ' + (dD < 0 ? 'Demand decreases' : 'Demand increases') + ' by about ' + fmt(Math.abs(dD)) + ' units.', 'Exact change: ' + dec(D(p0 + dp) - D(p0), 4) + '.'],
      sk: [], _chk: { D, Dd, p0 }
    };
  } };

/* ---------- 8. Taylor polynomial of degree 2 (problems 2.18, 2.19; Lecture 4) ---------- */
CALC.taylor = { wk: 'W4', name: 'Taylor polynomial (degree 2) and estimate', src: 'Problems 2.18f, 2.19a; Lecture 4 p2 to 8',
  gen() {
    const v = R.int(0, 3); let F, fa, f1, f2, a, xt, name, fs, d1s, d2s;
    if (v === 0) { a = R.pick([4, 9, 16, 25, 36, 49]); const d = R.pick([1, -1, 2, 0.5]); xt = a + d; F = Math.sqrt; fa = Math.sqrt(a); f1 = 1 / (2 * fa); f2 = -1 / (4 * fa ** 3); name = '√' + fD(xt); fs = rt('x'); d1s = fr(1, '2' + rt('x')); d2s = '−' + fr(1, '4' + sp('x', '3/2')); }
    else if (v === 1) { a = 1; xt = R.pick([1.1, 0.9, 1.2, 0.8, 1.05]); F = Math.log; fa = 0; f1 = 1; f2 = -1; name = 'ln ' + fD(xt); fs = 'ln x'; d1s = fr(1, 'x'); d2s = '−' + fr(1, 'x²'); }
    else if (v === 2) { a = 0; xt = R.pick([0.1, -0.2, 0.2, 0.3, -0.1]); F = Math.exp; fa = 1; f1 = 1; f2 = 1; name = 'e<sup>' + fD(xt) + '</sup>'; fs = 'e<sup>x</sup>'; d1s = 'e<sup>x</sup>'; d2s = 'e<sup>x</sup>'; }
    else { a = 2; xt = R.pick([2.1, 1.9, 2.2]); F = x => 1 / (x * x); fa = 0.25; f1 = -0.25; f2 = 6 / 16; name = '1/' + fD(xt) + '²'; fs = fr(1, 'x²'); d1s = '−' + fr(2, 'x³'); d2s = fr(6, sp('x', 4)); }
    const c2 = f2 / 2, h = xt - a; const T2 = fa + f1 * h + c2 * h * h;
    return {
      intro: 'Find the Taylor polynomial of degree 2 of f(x) = ' + fs + ' about a = ' + a + ', and use it to estimate ' + name + '.',
      parts: [N('f(a)', fa), N('f′(a)', f1), N('f″(a)', f2), N('Estimate T₂' + pD(xt) + '', T2, { tol: 0.0005 })],
      steps: [B('Formula') + ': T₂(x) = f(a) + f′(a)(x − a) + ' + fr('f″(a)', '2') + '(x − a)².', 'f(x) = ' + fs + ' ⇒ f(' + a + ') = ' + fq(fa), FX + ' = ' + d1s + ' ⇒ f′(' + a + ') = ' + fq(f1), FXX + ' = ' + d2s + ' ⇒ f″(' + a + ') = ' + fq(f2), 'T₂(x) = ' + poly([[fa, '']]) + term(f1, '(x' + (a ? ' − ' + a : '') + ')') + term(c2, '(x' + (a ? ' − ' + a : '') + ')²'), 'Estimate: T₂' + pD(xt) + ' = ' + B(dec(T2, 5)) + '. Exact: ' + dec(F(xt), 5) + '.'],
      sk: [], _chk: { F, a, fa, f1, f2 }
    };
  } };

/* ---------- 9. Local extrema of a cubic, inflection (Lecture 3, 4) ---------- */
CALC.localext = { wk: 'W4', name: 'Local extrema and inflection point', src: 'Lecture 3 p10 to 12; Lecture 4 p1',
  gen() {
    let s1, s2; do { s1 = R.int(-3, 3); s2 = R.int(-2, 4); } while (s2 <= s1);
    const sg = R.pick([1, 1, -1]), r = R.int(-6, 6);
    const c3 = 2 * sg, c2 = -3 * (s1 + s2) * sg, c1 = 6 * s1 * s2 * sg;
    const f = x => c3 * x ** 3 + c2 * x * x + c1 * x + r;
    const xmax = sg > 0 ? s1 : s2, xmin = sg > 0 ? s2 : s1, xi = (s1 + s2) / 2;
    const ys = [f(s1), f(s2)]; const yl = Math.min(...ys), yh = Math.max(...ys);
    return {
      intro: 'Consider f(x) = ' + poly([[c3, 'x³'], [c2, 'x²'], [c1, 'x'], [r, '']]) + '. Find its local extrema (with the second derivative test) and its inflection point. Is f increasing or decreasing on (' + s1 + ', ' + s2 + ')?',
      parts: [N('x of the local maximum', xmax), N('f at the maximum', f(xmax)), N('x of the local minimum', xmin), N('f at the minimum', f(xmin)), N('x of the inflection point', xi), CH('On (' + s1 + ', ' + s2 + ') f is', ['increasing', 'decreasing'], sg > 0 ? 1 : 0)],
      steps: [
        FX + ' = ' + poly([[3 * c3, 'x²'], [2 * c2, 'x'], [c1, '']]) + ' = ' + fmt(3 * c3) + '(x' + (s1 ? sgn(-s1) : '') + ')(x' + (s2 ? sgn(-s2) : '') + ')',
        B('Stationary points') + ': f′(x) = 0 ⇒ x₁ = ' + s1 + ', x₂ = ' + s2,
        FXX + ' = ' + poly([[6 * c3, 'x'], [2 * c2, '']]),
        'f″(' + s1 + ') = ' + fmt(6 * c3 * s1 + 2 * c2) + (6 * c3 * s1 + 2 * c2 < 0 ? ' < 0 ⇒ maximum' : ' > 0 ⇒ minimum') + ',  f″(' + s2 + ') = ' + fmt(6 * c3 * s2 + 2 * c2) + (6 * c3 * s2 + 2 * c2 < 0 ? ' < 0 ⇒ maximum' : ' > 0 ⇒ minimum'),
        B('Maximum M(' + fmt(xmax) + ', ' + fmt(f(xmax)) + '), minimum m(' + fmt(xmin) + ', ' + fmt(f(xmin)) + ')'),
        B('Inflection') + ': f″(x) = 0 ⇒ x = ' + fmt(xi) + ', f(' + fmt(xi) + ') = ' + fmt(f(xi)) + ' (f‴ = ' + fmt(6 * c3) + ' ≠ 0).',
        'Between the stationary points f′ has the sign of ' + fmt(3 * c3) + ' · (+) · (−), so f is ' + (sg > 0 ? 'decreasing' : 'increasing') + ' on (' + s1 + ', ' + s2 + ').'
      ],
      sk: [{ plot: { f, x0: s1 - 2, x1: s2 + 2, y0: yl - Math.max(4, (yh - yl) * 0.5), y1: yh + Math.max(4, (yh - yl) * 0.5), ystep: Math.max(1, Math.ceil((yh - yl + 8) / 10)), pts: [{ x: xmax, y: f(xmax), t: 'max' }, { x: xmin, y: f(xmin), t: 'min', dy: 22 }, { x: xi, y: f(xi), t: 'I', c: '#1d4fb8' }], lbl: 2 }, cap: 'Maximum, minimum and the inflection point I halfway between them.' }],
      _chk: { f, xmax, xmin, xi }
    };
  } };

/* ---------- 10. Full analysis A ln(b − x) + (x + c)² (Midterm 1 25/26 Problem 2; problem 2.43) ---------- */
CALC.analysis = { wk: 'W4', name: 'Function analysis: domain, derivatives, extrema, inflection', src: 'Midterm 1 2025/26 Problem 2; problem 2.43a', book: { b: 2, c: 0.5, x0: -2 },
  gen(o) {
    const combos = [[2, 0.5], [4, 1], [8, 2], [6, 1.5], [9, 1], [8, 0.5], [3, 0.75], [5, 1.8], [12, 3], [4, 0.25]];
    const [b, c] = o ? [o.b, o.c] : R.pick(combos); const A = 2 * b * c, q = Math.sqrt(b * c);
    let x0; do { x0 = o ? o.x0 : R.int(Math.floor(-3), Math.floor(b) - 1); } while (!o && (x0 === 0 || Math.abs(x0 - (b - c)) < 1e-9));
    const f = x => A * Math.log(b - x) + (x + c) ** 2, d = x => -A / (b - x) + 2 * (x + c), dd = x => -A / (b - x) ** 2 + 2;
    const r2 = b - c, xi = b - q;
    const cs = fq(c);
    const ymn = Math.min(f(0), f(xi), f(r2)), ymx = Math.max(f(0), f(xi), f(r2));
    return {
      intro: 'Consider the function f(x) = ' + fmt(A) + ' ln(' + fmt(b) + ' − x) + (x + ' + cs + ')². a) Find its domain and the first and second derivative. b) Is the function increasing or decreasing at x = ' + x0 + '? c) Find its extrema and inflection points.',
      parts: [N('a) Domain is (−∞, b): b =', b), N('b) f′(' + x0 + ')', d(x0)), CH('b) At x = ' + x0 + ' the function is', ['increasing', 'decreasing'], d(x0) > 0 ? 0 : 1), N('c) Minimum: x', 0), N('c) Minimum: f(x)', f(0)), N('c) Maximum: x', r2), N('c) Maximum: f(x)', f(r2)), N('c) Inflection point: x', xi), N('c) Inflection point: f(x)', f(xi))],
      steps: [
        B('a)') + ' ln needs a positive argument: ' + fmt(b) + ' − x > 0 ⇔ x < ' + fmt(b) + '. ' + B('D<sub>f</sub> = (−∞, ' + fmt(b) + ')'),
        FX + ' = −' + fr(fmt(A), fmt(b) + ' − x') + ' + 2(x + ' + cs + ') = ' + fr('2x(x − ' + fq(r2) + ')', 'x − ' + fmt(b)),
        FXX + ' = −' + fr(fmt(A), '(' + fmt(b) + ' − x)²') + ' + 2 = ' + fr('2(x − ' + fq(xi) + ')(x − ' + fq(b + q) + ')', '(x − ' + fmt(b) + ')²'),
        B('b)') + ' f′(' + x0 + ') = ' + fq(d(x0)) + (d(x0) < 0 ? ' < 0, the function is decreasing' : ' > 0, the function is increasing'),
        B('c)') + ' f′(x) = 0 ⇒ x₁ = 0, x₂ = ' + fq(r2) + '.  f″(0) = ' + fq(dd(0)) + ' > 0 ⇒ minimum; f″(' + fq(r2) + ') = ' + fq(dd(r2)) + ' < 0 ⇒ maximum.',
        B('E₁(0, ' + fmt(A) + ' ln ' + fmt(b) + ' + ' + fq(c * c) + ') minimum') + ' ≈ (0, ' + dec(f(0), 3) + ');  ' + B('E₂(' + fq(r2) + ', ' + fq(r2 + c === b ? b * b : (r2 + c) ** 2) + (Math.abs(c - 1) < 1e-9 ? '' : ' + ' + fmt(A) + ' ln ' + fq(c)) + ') maximum') + ' ≈ (' + fmt(r2) + ', ' + dec(f(r2), 3) + ')',
        B('Inflection') + ': f″(x) = 0 ⇒ (' + fmt(b) + ' − x)² = ' + fmt(b * c) + ' ⇒ x = ' + fq(xi) + ' (the other root ' + fq(b + q) + ' is outside D<sub>f</sub>). ' + B('I(' + fq(xi) + ', ' + dec(f(xi), 3) + ')')
      ],
      sk: [{ plot: { f, x0: Math.min(-2, x0 - 1), x1: b + 0.5, d1: b - 1e-3, y0: Math.floor(ymn - 2), y1: Math.ceil(ymx + 3), va: [b], ystep: Math.max(1, Math.round((ymx - ymn + 5) / 8)), step: b > 6 ? 2 : 1, pts: [{ x: 0, y: f(0), t: 'min', dy: 22 }, { x: r2, y: f(r2), t: 'max' }, { x: xi, y: f(xi), t: 'I', c: '#1d4fb8', dx: 10 }] }, cap: 'Graph: ln(' + fmt(b) + ' − x) → −∞ at the border x = ' + fmt(b) + '.' }],
      _chk: { f, d, dd, xi, r2 }
    };
  } };

/* ---------- 11. Global extrema on a closed interval (Midterm 1 24/25 Problem 2; problem 2.48b) ---------- */
CALC.global = { wk: 'W4', name: 'Global extrema on an interval', src: 'Midterm 1 2024/25 Problem 2; problem 2.48b', book: { al: 1, be: 5, ga: 9, de: 3 },
  gen(o) {
    if (o || R.int(0, 2) > 0) {
      for (let g = 0; g < 2000; g++) {
        const al = o ? o.al : R.pick([1, 2, 3]), de = o ? o.de : R.pick([1, 2, 3]), be = o ? o.be : R.int(1, 9), ga = o ? o.ga : R.int(2, 12);
        const lo = -be / al, hi = ga / de; if (hi - lo < 2) continue;
        const xs = (al * al * ga - de * de * be) / (al * de * (al + de));
        if (!(xs > lo + 0.3 && xs < hi - 0.3)) continue; if (!toFrac(xs, 6)) continue;
        const f = x => Math.sqrt(al * x + be) + Math.sqrt(ga - de * x);
        const fl = f(lo), fh = f(hi), fs = f(xs); if (Math.abs(fl - fh) < 0.05) continue;
        const xmin = fl < fh ? lo : hi;
        const t1 = al === 1 ? 'x' : al + 'x', t2 = de === 1 ? 'x' : de + 'x';
        return {
          intro: 'Consider the function f(x) = ' + rt(t1 + ' + ' + be) + ' + ' + rt(ga + ' − ' + t2) + '. a) Find its domain. b) Find the global extrema of f(x) on its domain.',
          parts: [N('a) Domain [a, b]: a', lo), N('a) Domain [a, b]: b', hi), N('b) Global maximum at x', xs), N('b) Global maximum value', fs), N('b) Global minimum at x', xmin), N('b) Global minimum value', f(xmin))],
          steps: [
            B('a)') + ' The square root is defined for nonnegative numbers: ' + t1 + ' + ' + be + ' ≥ 0 ⇔ x ≥ ' + fq(lo) + ';  ' + ga + ' − ' + t2 + ' ≥ 0 ⇔ x ≤ ' + fq(hi) + '. ' + B('D<sub>f</sub> = [' + fq(lo) + ', ' + fq(hi) + ']'),
            B('b)') + ' f′(x) = ' + fr(al, '2' + rt(t1 + ' + ' + be)) + ' − ' + fr(de, '2' + rt(ga + ' − ' + t2)),
            'Stationary points: ' + fr(al, '2' + rt(t1 + ' + ' + be)) + ' = ' + fr(de, '2' + rt(ga + ' − ' + t2)) + ' ⇒ ' + (al === 1 ? '' : al) + rt(ga + ' − ' + t2) + ' = ' + (de === 1 ? '' : de) + rt(t1 + ' + ' + be) + ' ⇒ ' + (al * al === 1 ? '' : al * al) + '(' + ga + ' − ' + t2 + ') = ' + (de * de === 1 ? '' : de * de) + '(' + t1 + ' + ' + be + ') ⇒ x = ' + fq(xs),
            'The solution x = ' + fq(xs) + ' ∈ D<sub>f</sub> indeed solves the first equation (both sides positive).',
            'Consider the stationary point and the endpoints: f(' + fq(xs) + ') = ' + dec(fs, 4) + ' (= ' + rt(fmt(fs * fs)) + '),  f(' + fq(lo) + ') = ' + rt(fmt(fl * fl)) + ' ≈ ' + dec(fl, 4) + ',  f(' + fq(hi) + ') = ' + rt(fmt(fh * fh)) + ' ≈ ' + dec(fh, 4),
            B('Global maximum M(' + fq(xs) + ', ' + rt(fmt(fs * fs)) + '),  global minimum m(' + fq(xmin) + ', ' + rt(fmt(f(xmin) ** 2)) + ')')
          ],
          sk: [{ plot: { f, x0: Math.floor(lo) - 1, x1: Math.ceil(hi) + 1, d0: lo, d1: hi, y0: 0, y1: Math.ceil(fs) + 1, step: hi - lo > 8 ? 2 : 1, pts: [{ x: xs, y: fs, t: 'M' }, { x: xmin, y: f(xmin), t: 'm', dy: 20 }, { x: fl < fh ? hi : lo, y: Math.max(fl, fh), c: '#1d4fb8' }] }, cap: 'Compare the stationary point with BOTH endpoints.' }],
          _chk: { f, xs, lo, hi }
        };
      }
    }
    // cubic on an interval
    for (;;) {
      let s1 = R.int(-3, 2), s2 = R.int(-1, 4); if (s2 <= s1) continue; const r = R.int(-4, 4);
      const f = x => x ** 3 - 1.5 * (s1 + s2) * x * x + 3 * s1 * s2 * x + r;
      const a = R.int(s1 - 2, s1), b = R.int(s1 + 1, s2 + 2); if (b - a < 2) continue;
      const cand = [a, b, s1, s2].filter(x => x >= a && x <= b); const vals = cand.map(f);
      const mx = Math.max(...vals), mn = Math.min(...vals); if (vals.filter(v => Math.abs(v - mx) < 1e-9).length > 1 || vals.filter(v => Math.abs(v - mn) < 1e-9).length > 1) continue;
      const xM = cand[vals.indexOf(mx)], xm = cand[vals.indexOf(mn)];
      const inside = [s1, s2].filter(x => x > a && x < b);
      return {
        intro: 'Find the global extrema of f(x) = ' + poly([[1, 'x³'], [-1.5 * (s1 + s2), 'x²'], [3 * s1 * s2, 'x'], [r, '']]) + ' on the interval I = [' + a + ', ' + b + '].',
        parts: [N('Global maximum at x', xM), N('Global maximum value', mx), N('Global minimum at x', xm), N('Global minimum value', mn)],
        steps: [B('Global extrema can be') + ': ① stationary points inside the interval, ② endpoints of the interval.', FX + ' = ' + poly([[3, 'x²'], [-3 * (s1 + s2), 'x'], [3 * s1 * s2, '']]) + ' = 3(x' + (s1 ? sgn(-s1) : '') + ')(x' + (s2 ? sgn(-s2) : '') + ') = 0 ⇒ x = ' + s1 + ', x = ' + s2 + (inside.length < 2 ? ' (only ' + (inside.length ? inside.join(' and ') : 'none') + ' inside I)' : ''), 'Values: ' + cand.map(x => 'f(' + x + ') = ' + fmt(f(x))).join(',  '), B('Global maximum M(' + xM + ', ' + fmt(mx) + '),  global minimum m(' + xm + ', ' + fmt(mn) + ')')],
        sk: [{ plot: { f, x0: a - 1, x1: b + 1, d0: a, d1: b, y0: Math.floor(mn) - 2, y1: Math.ceil(mx) + 2, ystep: Math.max(1, Math.round((mx - mn + 4) / 8)), pts: [{ x: xM, y: mx, t: 'M' }, { x: xm, y: mn, t: 'm', dy: 20 }] }, cap: 'Only the part over [' + a + ', ' + b + '] counts.' }],
        _chk: { f, cand }
      };
    }
  } };

/* ---------- 12. Elasticity of a nonlinear demand (problems 2.20 to 2.28) ---------- */
CALC.elast = { wk: 'W4', name: 'Price elasticity of demand', src: 'Seminar 26 Oct: problems 2.20, 2.27, 2.28; 2.22 to 2.26',
  gen() {
    const v = R.int(0, 3); let D, E, Pu, P0, ds, Es, us, dsym;
    if (v === 0) { const A = R.pick([100, 50, 200]), k = R.pick([0.1, 0.2, 0.25, 0.5]); D = P => A * Math.exp(-k * P); E = P => -k * P; Pu = 1 / k; P0 = R.int(1, Math.round(2 / k)); dsym = A + 'e<sup>−' + fD(k) + 'P</sup>'; ds = 'D′(P) = −' + fmt(k * A) + 'e<sup>−' + fD(k) + 'P</sup>'; Es = fr('P', A + 'e<sup>−' + fD(k) + 'P</sup>') + ' · (−' + fmt(k * A) + 'e<sup>−' + fD(k) + 'P</sup>) = −' + fD(k) + 'P'; us = fD(k) + 'P = 1 ⇒ P = ' + fmt(Pu); }
    else if (v === 1) { const b = R.pick([1, 2, 3]), u = R.int(2, 5), a = 3 * b * u * u; D = P => a - b * P * P; E = P => -2 * b * P * P / (a - b * P * P); Pu = u; P0 = R.int(1, Math.floor(Math.sqrt(a / b) - 0.01)); dsym = a + ' − ' + (b === 1 ? '' : b) + 'P²'; ds = 'D′(P) = −' + fmt(2 * b) + 'P'; Es = fr('P', dsym) + ' · (−' + fmt(2 * b) + 'P) = −' + fr(fmt(2 * b) + 'P²', dsym); us = fmt(2 * b) + 'P² = ' + a + ' − ' + (b === 1 ? '' : b) + 'P² ⇒ P² = ' + fmt(a / (3 * b)) + ' ⇒ P = ' + fmt(Pu); }
    else if (v === 2) { const A = R.pick([3, 6, 10, 20]), c = R.pick([1, 4, 9, 16]); D = P => A / (P * P + c); E = P => -2 * P * P / (P * P + c); Pu = Math.sqrt(c); P0 = R.int(1, 5); dsym = fr(A, 'P² + ' + c); ds = 'D′(P) = −' + fr(fmt(2 * A) + 'P', '(P² + ' + c + ')²'); Es = '−' + fr('2P²', 'P² + ' + c); us = '2P² = P² + ' + c + ' ⇒ P = ' + fmt(Pu); }

/* ---------- 14. Partial derivatives (problems 4.6, 4.7; Lecture 5) ---------- */

      s: { fx: ex(a === 1 ? 'y' : a === -1 ? '−y' : a + 'y') + term(2 * b, 'xy'), fy: term(a, 'x', true) + ex(a === 1 ? 'y' : a === -1 ? '−y' : a + 'y') + term(b, 'x²'), fxx: poly([[2 * b, 'y']]), fyy: term(a * a, 'x', true) + ex(a === 1 ? 'y' : a === -1 ? '−y' : a + 'y'), fxy: term(a, '', true) + ex(a === 1 ? 'y' : a === -1 ? '−y' : a + 'y') + term(2 * b, 'x') }, pt: [R.int(-2, 2), 0] }; },
    () => { return { fs: 'y ln(x² + y)', f: (x, y) => y * Math.log(x * x + y), fx: (x, y) => 2 * x * y / (x * x + y), fy: (x, y) => Math.log(x * x + y) + y / (x * x + y), fxx: (x, y) => 2 * y * (y - x * x) / (x * x + y) ** 2, fyy: (x, y) => (2 * x * x + y) / (x * x + y) ** 2, fxy: (x, y) => 2 * x ** 3 / (x * x + y) ** 2,
      s: { fx: fr('2xy', 'x² + y'), fy: 'ln(x² + y) + ' + fr('y', 'x² + y'), fxx: fr('2y(y − x²)', '(x² + y)²'), fyy: fr('2x² + y', '(x² + y)²'), fxy: fr('2x³', '(x² + y)²') }, pt: R.pick([[1, 0], [1, 1], [2, 1], [0, 1], [1, 3]]) }; },
    () => { const a = R.pick([1, 2, 3]), b = R.int(-4, 4), c = R.pick([1, -1, 2]); return { fs: poly([[a, 'x²y³'], [b, 'xy'], [c, 'y²']]), f: (x, y) => a * x * x * y ** 3 + b * x * y + c * y * y, fx: (x, y) => 2 * a * x * y ** 3 + b * y, fy: (x, y) => 3 * a * x * x * y * y + b * x + 2 * c * y, fxx: (x, y) => 2 * a * y ** 3, fyy: (x, y) => 6 * a * x * x * y + 2 * c, fxy: (x, y) => 6 * a * x * y * y + b,
      s: { fx: poly([[2 * a, 'xy³'], [b, 'y']]), fy: poly([[3 * a, 'x²y²'], [b, 'x'], [2 * c, 'y']]), fxx: poly([[2 * a, 'y³']]), fyy: poly([[6 * a, 'x²y'], [2 * c, '']]), fxy: poly([[6 * a, 'xy²'], [b, '']]) }, pt: [R.int(-2, 2), R.int(-1, 2)] }; }
  ];
  return R.pick(T)();
}

/* ---------- 16. MRS and MRTS (problems 4.16, 4.17) ---------- */
CALC.mrs = { wk: 'W5', name: 'MRS and MRTS', src: 'Seminar 2 Nov: problems 4.16, 4.17',
  gen() {
    if (R.int(0, 1)) {
      const a = R.int(1, 3), b = R.int(1, 3), x0 = R.int(1, 4), y0 = R.int(2, 10), dy = -R.int(1, 3);
      const U = (x, y) => x ** a * y ** b, Ux = (x, y) => a * x ** (a - 1) * y ** b, Uy = (x, y) => b * x ** a * y ** (b - 1);
      const mrs = Uy(x0, y0) / Ux(x0, y0); const dx = -mrs * dy;
      const us = pw('x', a) + pw('y', b);
      return {
        intro: 'A consumer has the utility function U(x, y) = ' + us + '. At the moment he consumes x = ' + x0 + ' and y = ' + y0 + ' per day. Find the marginal rate of substitution MRS<sub>y</sub>, and estimate how much x he needs to keep his utility unchanged if y decreases by ' + (-dy) + '.',
        parts: [N('U<sub>x</sub>(' + x0 + ', ' + y0 + ')', Ux(x0, y0)), N('U<sub>y</sub>(' + x0 + ', ' + y0 + ')', Uy(x0, y0)), N('MRS<sub>y</sub>', mrs), N('Required Δx', dx)],
        steps: [B('Definition') + ': MRS<sub>y</sub> = ' + fr('U<sub>y</sub>(x₀, y₀)', 'U<sub>x</sub>(x₀, y₀)') + ', the amount of x the consumer gives up for one more unit of y.', 'U<sub>x</sub> = ' + mono(a, [['x', a - 1], ['y', b]]) + ' = ' + fmt(Ux(x0, y0)) + ',  U<sub>y</sub> = ' + mono(b, [['x', a], ['y', b - 1]]) + ' = ' + fmt(Uy(x0, y0)), 'MRS<sub>y</sub> = ' + fr(fmt(Uy(x0, y0)), fmt(Ux(x0, y0))) + ' = ' + B(fq(mrs)), B('Utility unchanged') + ': dU = U<sub>x</sub>Δx + U<sub>y</sub>Δy ≈ 0 ⇒ Δx ≈ −MRS<sub>y</sub> · Δy = −' + fq(mrs) + ' · ' + pn(dy) + ' = ' + B(fmt(dx)), 'He needs about ' + dec(dx, 3) + ' more units of x.'],
        sk: [], _chk: { U, Ux, Uy, x0, y0 }
      };
    }
    const c = R.pick([[2, 1, 2, 1, 5], [1, 1, 1, 2, 3], [1, 2, 3, 1, 5], [2, 1, 1, 3, 5]]); const [p, q, K0, L0, s] = c; // Q = K L e^(pK + qL − s), pK0 + qL0 = s
    const Q = (K, L) => K * L * Math.exp(p * K + q * L - s), QK = (K, L) => L * Math.exp(p * K + q * L - s) * (1 + p * K), QL = (K, L) => K * Math.exp(p * K + q * L - s) * (1 + q * L);
    const dK = R.pick([-0.1, -0.2, 0.1]); const mrts = QL(K0, L0) / QK(K0, L0); const dL = -QK(K0, L0) * dK / QL(K0, L0);
    const es = ex(poly([[p, 'K'], [q, 'L'], [-s, '']]));

/* ---------- 17. Stationary point of a quadratic, Hessian (problem 4.20a; Lecture 5 p10) ---------- */
CALC.hessq = { wk: 'W6', name: 'Stationary point and Hessian (quadratic)', src: 'Lecture 5 p10; problem 4.20a',
  gen() {
    let a, b, c, x0, y0; do { a = R.pick([1, 2, 3, -1, -2, 4, 8]); b = R.pick([-8, -4, -2, -1, 1, 2, 3, 0]); c = R.pick([1, 2, 3, -1, -3]); x0 = R.int(-3, 3); y0 = R.int(-3, 3); } while (Math.abs(4 * a * c - b * b) < 1e-9);
    const d = -(2 * a * x0 + b * y0), e = -(b * x0 + 2 * c * y0), g = R.int(-5, 9);
    const f = (x, y) => a * x * x + b * x * y + c * y * y + d * x + e * y + g;
    const H = 4 * a * c - b * b; const type = H < 0 ? 2 : a > 0 ? 0 : 1;
    return {
      intro: 'Find and classify the stationary points of f(x, y) = ' + poly([[a, 'x²'], [b, 'xy'], [c, 'y²'], [d, 'x'], [e, 'y'], [g, '']]) + '.',
      parts: [N('Stationary point x₀', x0), N('Stationary point y₀', y0), N('f(x₀, y₀)', f(x0, y0)), N('Hessian H(x₀, y₀)', H), CH('Type', TYPES3, type)],
      steps: [B('Stationary points') + ': f<sub>x</sub> = ' + poly([[2 * a, 'x'], [b, 'y'], [d, '']]) + ' = 0,   f<sub>y</sub> = ' + poly([[b, 'x'], [2 * c, 'y'], [e, '']]) + ' = 0', 'Solve the linear system ⇒ ' + B('T(' + x0 + ', ' + y0 + ', ' + fmt(f(x0, y0)) + ')'), 'f<sub>xx</sub> = ' + fmt(2 * a) + ',  f<sub>yy</sub> = ' + fmt(2 * c) + ',  f<sub>xy</sub> = ' + fmt(b), B('Hessian') + ': H = f<sub>xx</sub> f<sub>yy</sub> − f<sub>xy</sub>² = ' + pn(2 * a) + ' · ' + pn(2 * c) + ' − ' + pn(b) + '² = ' + fmt(H), H < 0 ? 'H < 0 ⇒ neither convex nor concave ⇒ ' + B('saddle point') : 'H > 0 and f<sub>xx</sub> = ' + fmt(2 * a) + (a > 0 ? ' > 0 ⇒ strictly convex ⇒ ' + B('local minimum') : ' < 0 ⇒ strictly concave ⇒ ' + B('local maximum'))],
      sk: [], _chk: { f, x0, y0 }
    };
  } };

/* ---------- 18. Two stationary points ax³ + by² + cxy (Lecture 6 p6; problem 4.20b) ---------- */
CALC.hessc = { wk: 'W6', name: 'Extrema of two variables (two stationary points)', src: 'Exercises 9 Nov: problems 4.20c, 4.21; Lecture 6 p6; problem 4.20b',
  gen() {
    const c0 = R.pick([[1, 1, 12], [1, 1, 6], [1 / 3, 1, 2], [2 / 3, -1, 2], [1, -1, 6], [1, 3, 6], [1 / 3, -1, 4], [2, 1, 6], [1, 2, 6]]);
    let [a, b, c] = c0; if (R.int(0, 1)) c = -c;
    const f = (x, y) => a * x ** 3 + b * y * y + c * x * y; const x2 = c * c / (6 * a * b), y2 = -c * x2 / (2 * b);
    const H = (x, y) => 6 * a * x * 2 * b - c * c; const H2 = H(x2, y2); const t2 = H2 < 0 ? 2 : (6 * a * x2 > 0 ? 0 : 1);
    return {
      intro: 'Find and classify the stationary points of f(x, y) = ' + poly([[a, 'x³'], [b, 'y²'], [c, 'xy']]) + '.',
      parts: [N('Second stationary point x₂ (≠ 0)', x2), N('y₂', y2), N('H(0, 0)', H(0, 0)), CH('Type at (0, 0)', TYPES3, 2), N('H(x₂, y₂)', H2), CH('Type at (x₂, y₂)', TYPES3, t2), N('f(x₂, y₂)', f(x2, y2))],
      steps: [B('Stationary points') + ': f<sub>x</sub> = ' + poly([[3 * a, 'x²'], [c, 'y']]) + ' = 0,   f<sub>y</sub> = ' + poly([[2 * b, 'y'], [c, 'x']]) + ' = 0', 'From f<sub>y</sub>: y = ' + term(-c / (2 * b), 'x', true) + '. Insert into f<sub>x</sub>: ' + poly([[3 * a, 'x²'], [-c * c / (2 * b), 'x']]) + ' = 0 ⇒ x(' + poly([[3 * a, 'x'], [-c * c / (2 * b), '']]) + ') = 0', 'Stationary points ' + B('T₁(0, 0, 0)') + ' and ' + B('T₂(' + fmt(x2) + ', ' + fmt(y2) + ', ' + fmt(f(x2, y2)) + ')'), 'f<sub>xx</sub> = ' + fmt(6 * a) + 'x,  f<sub>yy</sub> = ' + fmt(2 * b) + ',  f<sub>xy</sub> = ' + fmt(c) + ';  H = ' + fmt(12 * a * b) + 'x − ' + fmt(c * c), 'At T₁: H(0, 0) = ' + fmt(H(0, 0)) + ' < 0 ⇒ ' + B('saddle point'), 'At T₂: H = ' + fmt(H2) + ' > 0 and f<sub>xx</sub> = ' + fmt(6 * a * x2) + (6 * a * x2 > 0 ? ' > 0 ⇒ ' + B('local minimum') : ' < 0 ⇒ ' + B('local maximum'))],
      sk: [], _chk: { f, x2, y2 }
    };
  } };

/* ---------- 19. Revenue of two substitute products (problem 4.24) ---------- */
CALC.optim2 = { wk: 'W6', name: 'Two products: maximize revenue', src: 'Exercises 9 Nov: problem 4.24', book: { P1: 10, P2: 15, be: 2, ga: 1, ep: 1 },
  gen(o) {
    for (;;) {
      const P1 = o ? o.P1 : R.int(4, 15), P2 = o ? o.P2 : R.int(4, 15), be = o ? o.be : R.pick([1, 2, 3]), ga = o ? o.ga : R.pick([1, 0.5]), ep = o ? o.ep : R.pick([1, 2, 3]);
      if (be * ep <= ga * ga) continue;
      const al = 2 * be * P1 - 2 * ga * P2, de = 2 * ep * P2 - 2 * ga * P1; if (al <= 0 || de <= 0) continue;
      const Q1 = al - be * P1 + ga * P2, Q2 = de + ga * P1 - ep * P2; if (Q1 <= 0 || Q2 <= 0) continue;
      const Rv = P1 * Q1 + P2 * Q2; const H = 4 * be * ep - 4 * ga * ga;
      return {
        intro: 'A company sells two substitute products with the joint demand Q₁ = ' + poly([[al, ''], [-be, 'P₁'], [ga, 'P₂']]) + ',  Q₂ = ' + poly([[de, ''], [ga, 'P₁'], [-ep, 'P₂']]) + '. a) Find the prices that maximize total revenue. b) How many products are sold and what is the maximized revenue?',
        parts: [N('a) P₁*', P1), N('a) P₂*', P2), N('Hessian H', H), N('b) Q₁', Q1), N('b) Q₂', Q2), N('b) Maximum revenue R*', Rv)],
        steps: [B('Revenue') + ': R = P₁Q₁ + P₂Q₂ = ' + poly([[al, 'P₁'], [-be, 'P₁²'], [2 * ga, 'P₁P₂'], [de, 'P₂'], [-ep, 'P₂²']]), 'R<sub>P₁</sub> = ' + poly([[al, ''], [-2 * be, 'P₁'], [2 * ga, 'P₂']]) + ' = 0,   R<sub>P₂</sub> = ' + poly([[de, ''], [2 * ga, 'P₁'], [-2 * ep, 'P₂']]) + ' = 0', 'Solve the system ⇒ ' + B('P₁ = ' + P1 + ', P₂ = ' + P2), 'R<sub>P₁P₁</sub> = ' + fmt(-2 * be) + ',  R<sub>P₂P₂</sub> = ' + fmt(-2 * ep) + ',  R<sub>P₁P₂</sub> = ' + fmt(2 * ga) + ' ⇒ H = ' + fmt(H) + ' > 0 and R<sub>P₁P₁</sub> < 0 ⇒ concave ⇒ ' + B('maximum'), 'Q₁ = ' + fmt(Q1) + ',  Q₂ = ' + fmt(Q2) + ',  R* = ' + P1 + ' · ' + fmt(Q1) + ' + ' + P2 + ' · ' + fmt(Q2) + ' = ' + B(fmt(Rv))],
        sk: [], _chk: { R: (p, q) => p * (al - be * p + ga * q) + q * (de + ga * p - ep * q), P1, P2 }
      };
    }
  } };

const TABS = [['study', 'Study'], ['practice', 'Practice'], ['lab', 'Calculation lab'], ['mock', 'Mock midterm'], ['past', 'Past midterms'], ['methods', 'Method sheet'], ['formulas', 'Formulas'], ['progress', 'Progress']];

/* ---------- shared problem rendering ---------- */
function skHtml(sk) {
  if (!sk || !sk.length) return '';
  return '<div class="skw"><div class="skg">' + sk.map(s => '<figure class="sk">' + (s.plot ? plotSvg(s.plot) : s.html) + '<figcaption>' + esc(s.cap || '') + '</figcaption></figure>').join('') + '</div></div>';

function paperSteps(steps) { return '<div class="paper">' + steps.map((s, i) => '<div class="ps"><span class="pn">' + (i + 1) + '</span><div class="pb">' + s + '</div></div>').join('') + '</div>'; }
function finalAns(t) { return '<div class="ans">' + t.parts.map(p => { const l = p.label.replace(/^[a-d]\)\s*/, ''); const ap = /≈\s*$/.test(l); const base = l.replace(/\s*[=:≈]\s*$/, ''); return '<span>' + base + (p.kind === 'ch' ? ': ' : ap ? ' ≈ ' : ' = ') + ansText(p) + '</span>'; }).join('') + '</div>'; }
function solHtml(t) { return skHtml(t.sk) + paperSteps(t.steps) + '<div class="meta" style="margin-top:8px">Final answers</div>' + finalAns(t); }
function partsHtml(t, pre, done) {
  return t.parts.map((p, i) => {
    const field = p.kind === 'ch' ? `<select id="${pre}${i}" ${done ? 'disabled' : ''}><option value="">choose</option>${p.opts.map((o, k) => `<option value="${k}">${esc(o)}</option>`).join('')}</select>`
      : `<input id="${pre}${i}" inputmode="text" autocomplete="off" spellcheck="false" placeholder="${p.kind === 'list' ? 'e.g. −2; 3  or none' : 'e.g. 3/2, −0.25, 2ln2+1/4'}" ${done ? 'disabled' : ''}>`;
    return `<div class="part" id="${pre}row${i}"><label for="${pre}${i}">${p.label}</label>${field}<span class="m" id="${pre}m${i}"></span></div>`;
  }).join('');
}

function stBegin(k) { S.key = k; S.mix = false; const c = CALC[k]; S.worked = c.gen(c.book); S.stage = 'study'; S.i = 0; S.good = 0; S.total = 0; study(); window.scrollTo(0, 0); }
function stNext() { S.task = CALC[S.key].gen(); S.checked = false; }
function study() {
  const v = $('#view');
  if (S.stage === 'pick') {
    let last = '';
    const rows = studyKeys().map(k => { const c = CALC[k], r = store.study[k]; const head = c.wk !== last ? `<tr class="lh"><td colspan="3"><b>${esc(WEEKS[c.wk])}</b></td></tr>` : ''; last = c.wk;
      return head + `<tr><td>${esc(c.name)}<div class="meta">${esc(c.src)}</div></td><td class="st">${r ? r.done + '× done, ' + Math.round(100 * r.good / Math.max(1, r.parts)) + '% right on new numbers' : '<span class="meta">not started</span>'}</td><td><button class="btn ghost" data-k="${k}">Start</button></td></tr>`; }).join('');
    v.innerHTML = `<div class="card"><b>How a study round works</b><ol class="steps"><li><b>Study</b>: read one worked solution in the professor's layout (where possible the problem from class).</li><li><b>Recall</b>: the solution is hidden. Write it from memory on paper, then compare line by line.</li><li><b>Try</b>: three new problems of the same type with new numbers. Solve on paper first, then type the results.</li></ol><p class="meta">After a few types, do a mixed round: the type is hidden, like in the exam. Order: start with weeks 5 and 6 (the material you missed), then week 4, then the rest.</p></div>
    ${chips(S.wk, null, true)}<div class="card"><table class="tt">${rows}</table><div class="row" style="margin-top:12px"><button class="btn" id="mx">Mixed round (5 problems from this selection)</button></div></div>`;
    bindChips(w => { S.wk = w; study(); });
    v.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => stBegin(b.dataset.k));
    $('#mx').onclick = () => { S.mix = true; S.mixN = 0; S.good = 0; S.total = 0; S.key = R.pick(studyKeys()); stNext(); S.stage = 'try'; study(); };
    return;
  }
  const c = CALC[S.key]; const back = `<button class="btn ghost" id="bk">Back to the list</button>`; const bindBack = () => { $('#bk').onclick = () => { S.stage = 'pick'; study(); }; };
  if (S.stage === 'study') {
    v.innerHTML = `<div class="card"><p class="meta">Step 1 of 3, Study · ${esc(wkShort(c.wk))} · ${esc(c.name)} · ${esc(c.src)}</p>${qHtml(S.worked)}<div class="fb"><b>Worked solution</b>${solHtml(S.worked)}</div><p class="note">Read it slowly. For every line ask: why does this step come next, which rule does it use? When you could explain it to a friend, continue.</p><div class="row"><button class="btn" id="go">I understand it, hide it</button>${back}</div></div>`;
    $('#go').onclick = () => { S.stage = 'recall'; study(); window.scrollTo(0, 0); }; bindBack(); return;
  }
  if (S.stage === 'recall') {
    v.innerHTML = `<div class="card"><p class="meta">Step 2 of 3, Recall · ${esc(c.name)}</p>${qHtml(S.worked)}<div class="fb"><b>On a blank page, without looking:</b> write the full solution of this same problem, line by line, in the same layout. About 3 to 5 minutes. Then reveal and compare.</div><div class="row" style="margin-top:12px"><button class="btn" id="rv">Reveal and compare</button>${back}</div><div id="rvs"></div></div>`;
    $('#rv').onclick = () => { $('#rvs').innerHTML = `<div class="fb"><b>Worked solution</b>${solHtml(S.worked)}</div><p class="note">Which line did you miss? Write it on your error list. Missed more than one line: study it again.</p><div class="row"><button class="btn ghost" id="again">Study it again</button><button class="btn" id="ok">I got it, give me new numbers</button></div>`; $('#again').onclick = () => { S.stage = 'study'; study(); }; $('#ok').onclick = () => { S.stage = 'try'; S.i = 1; stNext(); study(); window.scrollTo(0, 0); }; };
    bindBack(); return;
  }
  if (S.stage === 'try') {
    const t = S.task; const head = S.mix ? `Mixed round, problem ${S.mixN + 1} of 5 (type hidden until you check)` : `Step 3 of 3, New numbers ${S.i} of 3 · ${esc(c.name)}`;
    v.innerHTML = `<div class="card"><p class="meta">${head}</p>${qHtml(t)}<div id="parts">${partsHtml(t, 's', S.checked)}</div><div class="row"><button class="btn" id="chk">Check my answers</button><button class="btn ghost" id="sk">Give up, show solution</button>${back}</div><div id="sol"></div>${INPUT_NOTE}</div>`;
    const fin = good => { S.checked = true; S.good += good; S.total += t.parts.length; recCalc(S.key, good, t.parts.length); $('#chk').disabled = true; $('#sk').disabled = true;
      const last = S.mix ? S.mixN >= 4 : S.i >= 3; const nm = S.mix ? `<div class="meta">This was: ${esc(CALC[S.key].name)} (${esc(wkShort(CALC[S.key].wk))})</div>` : '';
      $('#sol').innerHTML = `<div class="fb ${good === t.parts.length ? 'good' : 'bad'}"><b>${good} of ${t.parts.length} parts correct.</b> ${good === t.parts.length ? '' : 'Find the first line where your paper differs from this solution.'}</div>${nm}<div class="fb"><b>Worked solution</b>${solHtml(t)}</div><div class="row"><button class="btn" id="nx">${last ? 'Finish' : 'Next problem'}</button></div>`;
      $('#nx').onclick = () => { if (S.mix) { if (last) S.stage = 'done'; else { S.mixN++; S.key = R.pick(studyKeys()); stNext(); } } else { if (last) { const r = store.study[S.key] || { done: 0, good: 0, parts: 0 }; r.done++; r.good += S.good; r.parts += S.total; store.study[S.key] = r; save(); S.stage = 'done'; } else { S.i++; stNext(); } } study(); window.scrollTo(0, 0); }; };
    $('#chk').onclick = () => fin(gradeParts(t, 's'));
    $('#sk').onclick = () => { gradeParts(t, 's'); fin(0); };
    $('#parts').onkeydown = e => { if (e.key === 'Enter' && !S.checked) $('#chk').click(); };
    bindBack(); return;
  }
  if (S.stage === 'done') {
    const ks = studyKeys(); const idx = ks.indexOf(S.key); const nk = !S.mix && idx >= 0 && idx < ks.length - 1 ? ks[idx + 1] : null;
    const pct = S.good / Math.max(1, S.total);
    v.innerHTML = `<div class="card"><b>${S.mix ? 'Mixed round finished' : 'Type finished: ' + esc(c.name)}</b><p class="q">You got ${S.good} of ${S.total} parts right on new numbers.</p><p class="note">${pct >= 0.8 ? 'Good. Come back to this type tomorrow without the example first (spacing beats repetition).' : 'Not stable yet. Repeat the recall step once more tonight and again tomorrow morning.'}</p><div class="row">${nk ? `<button class="btn" id="nk">Next type: ${esc(CALC[nk].name)}</button>` : ''}<button class="btn ghost" id="mx2">Mixed round</button>${back}</div></div>`;
    if (nk) $('#nk').onclick = () => stBegin(nk);
    $('#mx2').onclick = () => { S.mix = true; S.mixN = 0; S.good = 0; S.total = 0; S.key = R.pick(studyKeys()); stNext(); S.stage = 'try'; study(); }; bindBack();
  }
}

/* ---------- Practice: concept questions ---------- */
let P = { wk: 'ALL', queue: [], i: 0, ans: null };
function buildQueue() { const qs = BANK.filter(q => P.wk === 'ALL' || q.t === P.wk); const w = q => { const r = store.mc[q.id]; return !r ? 1 : r.last === 0 ? 0 : 2; }; P.queue = R.shuffle(qs).sort((a, b) => w(a) - w(b)).map(q => Object.assign({}, q, { _o: R.shuffle(q.o.map((t, i) => ({ t, i }))) })); P.i = 0; P.ans = null; }
function practice() {
  if (!P.queue.length) buildQueue();
  const v = $('#view'); const q = P.queue[P.i];
  if (!q) { v.innerHTML = chips(P.wk, null, true) + `<div class="card"><b>Round finished.</b><div class="row" style="margin-top:8px"><button class="btn" id="ag">New round</button></div></div>`; bindChips(w => { P.wk = w; buildQueue(); practice(); }); $('#ag').onclick = () => { buildQueue(); practice(); }; return; }
  const done = P.ans != null;
  const opts = q._o.map((x, k) => { let cls = 'opt'; if (done) { if (x.i === q.a) cls += ' good'; else if (x.i === P.ans) cls += ' bad'; } return `<button class="${cls}" data-i="${x.i}" ${done ? 'disabled' : ''}><span class="k">${'ABCDE'[k]}</span>${esc(x.t)}</button>`; }).join('');
  v.innerHTML = chips(P.wk, null, true) + `<div class="card"><div class="meta">Question ${P.i + 1} of ${P.queue.length} · ${esc(wkShort(q.t))} · ${esc(q.src)}</div><div class="q">${esc(q.q)}</div>${opts}${done ? `<div class="fb ${P.ans === q.a ? 'good' : 'bad'}"><b>${P.ans === q.a ? 'Correct.' : 'Not quite.'}</b> ${esc(q.e)}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">Next</button></div>` : ''}</div><p class="note">Questions you missed come first next time.</p>`;
  bindChips(w => { P.wk = w; buildQueue(); practice(); });
  v.querySelectorAll('.opt').forEach(b => b.onclick = () => { P.ans = +b.dataset.i; const r = store.mc[q.id] || { r: 0, w: 0 }; if (P.ans === q.a) { r.r++; r.last = 1; } else { r.w++; r.last = 0; } store.mc[q.id] = r; save(); practice(); });
  const nx = $('#nx'); if (nx) nx.onclick = () => { P.i++; P.ans = null; practice(); window.scrollTo(0, 0); };
}

/* ---------- Calculation lab: unlimited practice of one type ---------- */
let L = { wk: 'W5', key: 'partials', t: null, checked: false };
function lab() {
  const keys = CALC_ORDER.filter(k => CALC[k].wk === L.wk); if (!keys.includes(L.key)) { L.key = keys[0]; L.t = null; }
  if (!L.t) { L.t = CALC[L.key].gen(); L.checked = false; }
  const t = L.t; const r = store.calc[L.key];
  $('#view').innerHTML = chips(L.wk) + `<div class="card"><div class="row"><select id="ty">${keys.map(k => `<option value="${k}" ${k === L.key ? 'selected' : ''}>${esc(CALC[k].name)}</option>`).join('')}</select><span class="meta">${esc(CALC[L.key].src)}${r ? ' · ' + r.tasks + ' done, ' + Math.round(100 * r.good / r.parts) + '% parts right' : ''}</span></div></div>
  <div class="card">${qHtml(t)}<div id="parts">${partsHtml(t, 'l', L.checked)}</div><div class="row"><button class="btn" id="chk" ${L.checked ? 'disabled' : ''}>Check</button><button class="btn ghost" id="sol">Show solution</button><button class="btn ghost" id="nw">New problem</button></div><div id="out"></div>${INPUT_NOTE}</div>`;
  bindChips(w => { L.wk = w; L.key = null; L.t = null; lab(); });
  $('#ty').onchange = e => { L.key = e.target.value; L.t = null; lab(); };
  $('#nw').onclick = () => { L.t = null; lab(); };
  const showSol = good => { $('#out').innerHTML = (good != null ? `<div class="fb ${good === t.parts.length ? 'good' : 'bad'}"><b>${good} of ${t.parts.length} parts correct.</b></div>` : '') + `<div class="fb"><b>Worked solution</b>${solHtml(t)}</div><div class="row"><button class="btn" id="nw2">Next problem of this type</button></div>`; $('#nw2').onclick = () => { L.t = null; lab(); window.scrollTo(0, 0); }; };
  $('#chk').onclick = () => { const g = gradeParts(t, 'l'); L.checked = true; $('#chk').disabled = true; recCalc(L.key, g, t.parts.length); showSol(g); };
  $('#sol').onclick = () => { if (!L.checked) { gradeParts(t, 'l'); L.checked = true; $('#chk').disabled = true; recCalc(L.key, 0, t.parts.length); } showSol(null); };
  $('#parts').onkeydown = e => { if (e.key === 'Enter' && !L.checked) $('#chk').click(); };
}

/* ---------- Mock midterm: 30 minutes, 3 problems of 5 points ---------- */
const MOCK_POOLS = [['lindem', 'lndom', 'elast', 'optim1'], ['analysis', 'global', 'localext', 'taylor', 'approx'], ['partials', 'totdiff', 'mrs', 'hessq', 'hessc', 'optim2']];
let M = { state: 'idle', probs: [], left: 1800, timer: null, res: null };
function mock() {
  const v = $('#view');
  if (M.state === 'idle') {
    const last = store.mocks.slice(-5).reverse().map(m => `<tr><td>${esc(m.date)}</td><td>${m.pts.join(' + ')}</td><td><b>${m.total} / 15</b></td></tr>`).join('');
    v.innerHTML = `<div class="card"><h2 style="margin-top:0">Mock midterm, 30 minutes</h2><p>Three problems of 5 points: ① a demand or optimisation problem, ② a one variable analysis problem, ③ a two variable problem. New numbers every time. Only a simple calculator, no notes, everything on paper first.</p><p class="meta">The real Midterm 1 had 2 problems in 2024 and 2025 (5 + 5 and 6 + 9 points). This year's scope adds functions of two variables, so this mock covers all three areas.</p><button class="btn" id="go">Start the 30 minute mock</button></div>${last ? `<div class="card"><b>Recent mocks</b><table><tr><th>Date</th><th>Points per problem</th><th>Total</th></tr>${last}</table></div>` : ''}`;
    $('#go').onclick = () => { M = { state: 'run', probs: MOCK_POOLS.map(p => { const k = R.pick(p); return { k, t: CALC[k].gen() }; }), left: 1800, timer: null, res: null }; M.timer = setInterval(tick, 1000); mock(); window.scrollTo(0, 0); };
    return;
  }
  if (M.state === 'run') {
    v.innerHTML = `<div class="card row bar2"><span>Time left <span class="timer" id="tm">${mmss(M.left)}</span></span><button class="btn" id="fin">Submit</button></div>` + M.probs.map((p, i) => `<div class="card"><div class="meta">Problem ${i + 1} (5 points)</div>${qHtml(p.t)}${partsHtml(p.t, 'k' + i + '_', false)}</div>`).join('') + INPUT_NOTE;
    $('#fin').onclick = () => { const b = $('#fin'); if (b.dataset.arm) finishMock(); else { b.dataset.arm = 1; b.textContent = 'Click again to submit'; setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = 'Submit'; } }, 4000); } };
    return;
  }
  const r = M.res;
  v.innerHTML = `<div class="card"><h2 style="margin-top:0">Result: ${r.total} / 15</h2><p>${r.pts.map((x, i) => 'Problem ' + (i + 1) + ': ' + x + ' / 5').join(' · ')}</p><p class="meta">Points here = 5 × share of correct parts, rounded to half points. A real marker gives method points too, so compare your paper with every line below.</p><button class="btn" id="re">Back to start</button></div>` + M.probs.map((p, i) => `<div class="card"><div class="meta">Problem ${i + 1} · ${esc(CALC[p.k].name)}</div>${qHtml(p.t)}${partsHtml(p.t, 'k' + i + '_', true)}<div class="fb"><b>Solution</b>${solHtml(p.t)}</div></div>`).join('');
  M.probs.forEach((p, i) => p.t.parts.forEach((q, j) => { const el = document.getElementById('k' + i + '_' + j); if (el) el.value = p.vals[j]; const ok = okPart(q, p.vals[j]); document.getElementById('k' + i + '_row' + j).className = 'part ' + (ok ? 'ok' : 'no'); document.getElementById('k' + i + '_m' + j).textContent = ok ? '✓' : '✗'; }));
  $('#re').onclick = () => { M.state = 'idle'; mock(); };
}
function mmss(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick() { M.left--; const el = $('#tm'); if (el) { el.textContent = mmss(M.left); if (M.left < 300) el.classList.add('low'); } if (M.left <= 0) finishMock(); }
function finishMock() {
  clearInterval(M.timer); if (M.state !== 'run') return;
  const pts = M.probs.map((p, i) => { p.vals = p.t.parts.map((q, j) => { const el = document.getElementById('k' + i + '_' + j); return el ? el.value : ''; }); const g = p.t.parts.filter((q, j) => okPart(q, p.vals[j])).length; recCalc(p.k, g, p.t.parts.length); return Math.round(10 * g / p.t.parts.length) / 2; });
  const total = pts.reduce((a, b) => a + b, 0); M.res = { pts, total }; store.mocks.push({ date: new Date().toISOString().slice(0, 10), pts, total }); save(); M.state = 'done'; if (tab === 'mock') mock();
}

/* ---------- Past midterms ---------- */
let PP = { id: null, checked: false };
function past() {
  const v = $('#view');
  if (!PP.id) {
    v.innerHTML = `<div class="card"><b>The real papers, problem by problem</b><p class="meta">Official Canvas files from the professor, with her solutions. Do each one timed (30 minutes) on paper first, then type the results and check. Version A and B of the same year are the same problems with other numbers: do A, check, then B as a fresh test.</p></div>` + PAST.map(p => { const b = store.past[p.id]; return `<div class="card row" style="justify-content:space-between"><div><b>${esc(p.title)}</b><div class="meta">${esc(p.note)}</div>${b ? `<div class="meta">Best: ${b.best}% of parts, ${b.n} attempt(s)</div>` : ''}</div><button class="btn ghost" data-p="${p.id}">Open</button></div>`; }).join('');
    v.querySelectorAll('button[data-p]').forEach(b => b.onclick = () => { PP = { id: b.dataset.p, checked: false }; past(); window.scrollTo(0, 0); });
    return;
  }
  const p = PAST.find(x => x.id === PP.id);
  v.innerHTML = `<div class="card"><b>${esc(p.title)}</b><div class="meta">${esc(p.note)}</div></div>` + p.probs.map(q => `<div class="card"><div class="meta">Problem ${q.n} (${q.pts} points)</div><div class="q">${q.text}</div>${q.sk ? skHtml([{ plot: q.sk, cap: 'P on the vertical axis!' }]) : ''}${partsHtml(q, 'p' + q.n + '_', PP.checked)}${PP.checked ? `<div class="fb"><b>Official solution</b>${paperSteps(q.sol)}<div class="meta" style="margin-top:8px">Final answers</div>${finalAns(q)}</div>` : ''}</div>`).join('') + `<div class="card row"><button class="btn" id="chk" ${PP.checked ? 'disabled' : ''}>Check my answers</button><button class="btn ghost" id="bk">Back to the papers</button></div>${INPUT_NOTE}`;
  $('#bk').onclick = () => { PP = { id: null }; past(); };
  $('#chk').onclick = () => { const vals = {}; p.probs.forEach(q => q.parts.forEach((x, j) => { vals[q.n + '_' + j] = (document.getElementById('p' + q.n + '_' + j) || {}).value; }));
    PP.checked = true; past(); let good = 0, n = 0;
    p.probs.forEach(q => q.parts.forEach((x, j) => { const el = document.getElementById('p' + q.n + '_' + j); el.value = vals[q.n + '_' + j] || ''; const ok = okPart(x, el.value); if (ok) good++; n++; document.getElementById('p' + q.n + '_row' + j).className = 'part ' + (ok ? 'ok' : 'no'); document.getElementById('p' + q.n + '_m' + j).textContent = ok ? '✓' : '✗'; }));
    const b = store.past[p.id] || { best: 0, n: 0 }; b.n++; b.best = Math.max(b.best, Math.round(100 * good / n)); store.past[p.id] = b; save();
    document.querySelector('#view').insertAdjacentHTML('afterbegin', `<div class="card fb ${good === n ? 'good' : 'bad'}"><b>${good} of ${n} parts correct.</b> Compare your paper with the official solution under each problem.</div>`); window.scrollTo(0, 0); };
}

/* ---------- Method sheet and formulas ---------- */
function methods() {
  let last = '';
  $('#view').innerHTML = `<p class="note" style="margin-top:0">How to solve each type, in the order you write it on paper. Built from the 2026 lectures, the exercises and the official midterm solutions.</p>` + METHODS.map(m => { const h = m[0] !== last ? `<h3 class="wkh">${esc(m[0])}</h3>` : ''; last = m[0]; return h + `<div class="paper pm"><div class="pt">${m[1]}</div>${m[2].map((l, i) => `<div class="ps"><span class="pn">${i + 1}</span><div class="pb">${l}</div></div>`).join('')}</div>`; }).join('');
}
function formulas() {
  const grp = g => `<div class="paper pm"><div class="pt">${g[0]}</div><table class="ptab">${g[1].map(r => `<tr><td class="fo">${r[0]}</td><td class="wh">${esc(r[1])}</td></tr>`).join('')}</table></div>`;
  $('#view').innerHTML = `<div class="chips"><button class="chip" aria-pressed="true" data-j="f1">Formulas</button><button class="chip" aria-pressed="false" data-j="r1">Rules by lecture</button></div><p class="note" style="margin-top:0">No handbook or formula sheet is allowed in this exam, so learn these by heart. Cover the left column and recite, then check.</p><h3 class="wkh" id="f1">Formulas</h3>` + FORMULAS.map(grp).join('') + `<h3 class="wkh" id="r1">Rules by lecture (everything taught before Midterm 1)</h3>` + RULES.map(grp).join('');
  document.querySelectorAll('.chip[data-j]').forEach(b => b.onclick = () => { document.getElementById(b.dataset.j).scrollIntoView({ behavior: 'smooth' }); });
}

/* ---------- Progress ---------- */
function progress() {
  const wk = WK_KEYS.map(k => { const qs = BANK.filter(q => q.t === k); const right = qs.filter(q => store.mc[q.id] && store.mc[q.id].last === 1).length; const tried = qs.filter(q => store.mc[q.id]).length; const cs = CALC_ORDER.filter(c => CALC[c].wk === k).map(c => store.calc[c]).filter(Boolean); const cg = cs.reduce((a, c) => a + c.good, 0), cp = cs.reduce((a, c) => a + c.parts, 0); const pct = cp ? Math.round(100 * cg / cp) : 0;
    return `<div class="stat"><div class="meta">${esc(wkShort(k))}</div><b>${cp ? pct + '%' : 'no data'}</b><div class="bar"><i style="width:${pct}%"></i></div><div class="meta">Calculations: ${cg} of ${cp} parts right. Concepts: ${right} of ${qs.length} right (${tried} tried)</div></div>`; }).join('');
  const rows = CALC_ORDER.map(k => { const r = store.calc[k]; return `<tr><td>${esc(wkShort(CALC[k].wk))}</td><td>${esc(CALC[k].name)}</td><td>${r ? r.tasks : 0}</td><td>${r ? Math.round(100 * r.good / r.parts) + '%' : '<span class="meta">not tried</span>'}</td></tr>`; }).join('');
  $('#view').innerHTML = `<div class="grid">${wk}</div><div class="card" style="margin-top:14px"><b>Problem types</b><table><tr><th>Week</th><th>Type</th><th>Problems</th><th>Parts right</th></tr>${rows}</table></div>
  <div class="card"><b>Session summary for your study record</b><p class="meta">Copy this into the Campus Mathematics inbox (or paste it to Claude) so the next session continues from here.</p><textarea id="sum" readonly></textarea><div class="row"><button class="btn" id="cp">Copy</button><button class="btn ghost" id="rs">Reset all progress</button></div></div><p class="note">Progress is saved in this browser when storage is available. The summary is your backup.</p>`;
  $('#sum').value = summaryText();
  $('#cp').onclick = () => { const t = $('#sum'); t.select(); const done = ok => { $('#cp').textContent = ok ? 'Copied' : 'Selected, press Cmd C'; }; try { navigator.clipboard.writeText(t.value).then(() => done(true), () => done(false)); } catch (e) { done(false); } };
  $('#rs').onclick = () => { const b = $('#rs'); if (b.dataset.arm) { store = { mc: {}, calc: {}, study: {}, mocks: [], past: {} }; save(); progress(); } else { b.dataset.arm = 1; b.textContent = 'Click again to delete all progress'; } };
}
function summaryText() {
  let s = 'Mathematics Midterm 1 trainer, summary ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + '\n';
  CALC_ORDER.forEach(k => { const r = store.calc[k]; if (r) s += `${wkShort(CALC[k].wk)} | ${CALC[k].name}: ${r.tasks} problems, ${Math.round(100 * r.good / r.parts)}% parts right, last ${r.last || '?'}\n`; });
  const miss = BANK.filter(q => store.mc[q.id] && store.mc[q.id].last === 0).map(q => q.id); if (miss.length) s += 'Concept questions currently missed: ' + miss.join(', ') + '\n';
  Object.keys(store.past).forEach(id => { const p = PAST.find(x => x.id === id); s += `Past paper ${p ? p.title : id}: best ${store.past[id].best}% (${store.past[id].n} attempts)\n`; });
  if (store.mocks.length) { const m = store.mocks[store.mocks.length - 1]; s += `Last mock ${m.date}: ${m.total}/15 (${m.pts.join(' + ')}), ${store.mocks.length} mocks total\n`; }
  const weak = CALC_ORDER.filter(k => store.calc[k] && store.calc[k].good / store.calc[k].parts < 0.7).map(k => CALC[k].name); if (weak.length) s += 'Weak types (under 70%): ' + weak.join('; ') + '\n';
  return s;
}
renderTabs(); show(); countdown(); setInterval(countdown, 30000);
