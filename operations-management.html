const TABS=[['start','Start'],['theory','Theory'],['quiz','Quiz'],['lab','Calculation lab'],['mock','Mock midterm'],['work','Your workings'],['methods','Methods'],['formulas','Formulas'],['progress','Progress']];
let tab='start';
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]===tab}" data-t="${t[0]}">${t[1]}</button>`).join('');$$('#tabs button').forEach(b=>b.onclick=()=>{if(M.state==='run'&&b.dataset.t!=='mock'&&!confirm('The mock is running. Leave it?'))return;tab=b.dataset.t;render();window.scrollTo(0,0)})}
function render(){renderTabs();({start,theory,quiz,lab,mock,work,methods,formulas,progress})[tab]()}
function countdown(){const t=new Date('2026-11-23T17:00:00+01:00').getTime()-Date.now();const el=$('#cd');if(t<=0){el.textContent='Midterm time: Mon 23 Nov 2026, 17:00, VD (A to O) or MD (P to Ž)';return}const h=Math.floor(t/36e5),d=Math.floor(h/24);el.textContent='Midterm Mon 23 Nov 17:00 (hall VD for surnames A to O, MD for P to Ž): '+d+' days '+(h%24)+' h left'}

/* ===== start ===== */
function start(){
 const total=300+120+60+80+60;
 $('#view').innerHTML=`<div class="card"><h2>The exam in one box</h2>${TB(['Item','Detail'],[['When','Mon 23 Nov 2026, 17:00, 50 minutes'],['Hall','VD for surnames A to O, MD for P to Ž (check which applies to your surname, you are listed as both Lazarov and Saje)'],['Scope','Modules 1 to 4. Regression (Exercise 4.2) is excluded.'],['Format','Closed book. About 60% multiple choice theory, 40% two calculation exercises.'],['Bring','ID, pen, simple calculator'],['Weight','Optional, worth 40% of the final grade. 50% or more allows the partial end exam.']])}<p class="meta">Source: Canvas announcement and syllabus. The Canvas Practice Mid-term Exam quiz (9 questions, 40 points, unlimited attempts) is unstarted: do it once after the mock.</p></div>
<div class="card"><h2>Study load</h2><p>About <b>${Math.round(total/60*10)/10} hours</b> in total: theory 5 h (M1 60, M2 90, M3 75, M4 75 minutes), calculation lab 2 h, quiz 1 h, mock plus review 80 min, workings and gaps 1 h. Theory is 60% of the marks, so read the pictures first.</p>${TB(['When','Time','What'],PLAN.map(p=>[p[0],p[1],p[2]]))}</div>
<div class="card"><h2>Files to open for the text heavy parts</h2>${TB(['Material','File in your folder'],SRC)}<p class="note">Syllabus section 6 restricts uploading course materials to generative AI systems. Check it before you share these files further.</p></div>`}

/* ===== theory ===== */
function theory(){
 $('#view').innerHTML=`<p class="note" style="margin-top:0">Each module explains the lecture pictures step by step. Open one, read, then cover the page and answer the recall questions.</p>`+THEORY.map(m=>`<details class="mod" id="d_${m.id}"><summary>${m.title} <span class="meta">${m.time}</span></summary><div class="inner"><p class="meta">Source file: ${esc(m.file)}</p><p>${m.intro}</p>${m.blocks.map(b=>`<div class="blk"><h3>${b.h}</h3>${b.html}</div>`).join('')}<div class="recall"><b>Recall check</b>${m.recall.map((q,i)=>`<label class="chk"><input type="checkbox" data-r="${m.id}_${i}" ${store.rec[m.id+'_'+i]?'checked':''}> <span>${esc(q)}</span></label>`).join('')}</div></div></details>`).join('');
 $$('input[data-r]').forEach(c=>c.onchange=()=>{store.rec[c.dataset.r]=c.checked?1:0;save()});
 const qm=$('#qm');if(qm){const draw=()=>{const m=+$('#qm').value,a=+$('#qa').value,p=+$('#qp').value;$('#qav').textContent=a;$('#qpv').textContent=p;$('#qsvg').innerHTML=qCurve(m,a,p)};['qm','qa','qp'].forEach(i=>$('#'+i).oninput=draw);draw()}}

/* ===== quiz ===== */
let Q={mod:'all',list:[],i:0,sel:null,done:false,right:0,mode:'new'};
function quiz(){
 if(!Q.list.length){
  $('#view').innerHTML=`<div class="card"><h2>Concept quiz</h2><p>${BANK.length} multiple choice questions on all four modules, shuffled. Explanations appear after each answer.</p><div class="chips" id="mods">${[['all','All modules']].concat(WK_KEYS.map(k=>[k,MOD[k]])).concat([['miss','Missed ones only']]).map(c=>`<button class="chip" aria-pressed="${Q.mod===c[0]}" data-m="${c[0]}">${c[1]}</button>`).join('')}</div><button class="btn" id="go">Start</button></div>`;
  $$('#mods .chip').forEach(b=>b.onclick=()=>{Q.mod=b.dataset.m;quiz()});
  $('#go').onclick=()=>{let pool=BANK.filter(q=>Q.mod==='all'||(Q.mod==='miss'?store.mc[q.id]&&store.mc[q.id].last===0:q.t===Q.mod));if(!pool.length){alert('No questions here yet.');return}Q.list=R.shuffle(pool);Q.i=0;Q.sel=null;Q.done=false;Q.right=0;quiz()};return}
 if(Q.i>=Q.list.length){const n=Q.list.length;$('#view').innerHTML=`<div class="card"><h2>Result: ${Q.right} of ${n} (${Math.round(100*Q.right/n)}%)</h2><p>Aim for 80% or more across all modules before the mock.</p><button class="btn" id="again">Back</button></div>`;$('#again').onclick=()=>{Q.list=[];quiz()};return}
 const q=Q.list[Q.i];const order=q._o||(q._o=R.shuffle([0,1,2,3]));
 $('#view').innerHTML=`<div class="card"><div class="meta">${MOD[q.t]} · question ${Q.i+1} of ${Q.list.length}</div><div class="q">${esc(q.q)}</div>${order.map((oi,k)=>`<button class="opt ${Q.done?(oi===q.a?'good':(oi===Q.sel?'bad':'')):''}" data-o="${oi}" ${Q.done?'disabled':''}><span class="k">${'ABCD'[k]}</span>${esc(q.o[oi])}</button>`).join('')}${Q.done?`<div class="fb ${Q.sel===q.a?'good':'bad'}"><b>${Q.sel===q.a?'Correct.':'Not quite.'}</b>${esc(q.e)}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${Q.i+1<Q.list.length?'Next':'Finish'}</button></div>`:''}</div>`;
 $$('.opt').forEach(b=>b.onclick=()=>{Q.sel=+b.dataset.o;Q.done=true;const ok=Q.sel===q.a;if(ok)Q.right++;const r=store.mc[q.id]||{n:0};r.n++;r.last=ok?1:0;store.mc[q.id]=r;save();quiz()});
 if(Q.done)$('#nx').onclick=()=>{q._o=null;Q.i++;Q.sel=null;Q.done=false;quiz()}}

/* ===== calc rendering ===== */
function partsHtml(t,pre,reveal){return t.parts.map((p,j)=>`<div class="part" id="${pre}row${j}"><label for="${pre}${j}">${esc(p.label)}</label><input id="${pre}${j}" type="text" inputmode="decimal" autocomplete="off"><span class="m" id="${pre}m${j}"></span></div>`).join('')}
function gradeParts(t,pre){let good=0;t.parts.forEach((p,j)=>{const v=$('#'+pre+j).value;const ok=okPart(p,v);if(ok)good++;$('#'+pre+'row'+j).className='part '+(ok?'ok':'no');$('#'+pre+'m'+j).textContent=ok?'✓':'✗ '+fm(p.ans,2)});return good}
function recCalc(k,good,parts){const r=store.calc[k]||{tasks:0,good:0,parts:0};r.tasks++;r.good+=good;r.parts+=parts;store.calc[k]=r;save()}
let L={key:'cap',t:null,seed:null,checked:false};
function lab(){
 if(!L.t){L.seed=R.newSeed();L.t=R.seeded(L.seed,()=>CALC[L.key].gen());L.checked=false}
 const t=L.t;
 $('#view').innerHTML=`<div class="chips">${CALC_ORDER.map(k=>`<button class="chip" aria-pressed="${k===L.key}" data-k="${k}">${esc(CALC[k].name)}</button>`).join('')}</div><div class="card">${t.text}<div id="pp">${partsHtml(t,'l')}</div><div class="row"><button class="btn" id="chk" ${L.checked?'disabled':''}>Check</button><button class="btn ghost" id="nw">New problem</button></div><div id="out"></div><p class="note">Try on paper first. Numbers only, a comma or dot both work, rounding tolerance is built in.</p></div>`;
 $$('.chip[data-k]').forEach(b=>b.onclick=()=>{L.key=b.dataset.k;L.t=null;lab()});
 $('#nw').onclick=()=>{L.t=null;lab()};
 $('#chk').onclick=()=>{const g=gradeParts(t,'l');L.checked=true;$('#chk').disabled=true;recCalc(L.key,g,t.parts.length);$('#out').innerHTML=`<div class="fb ${g===t.parts.length?'good':'bad'}"><b>${g} of ${t.parts.length} parts correct.</b></div><div class="fb sol"><b>Worked solution</b>${t.sol}</div>`};
 $('#pp').onkeydown=e=>{if(e.key==='Enter'&&!L.checked)$('#chk').click()}}

/* ===== mock ===== */
const MOCKQ=[]; let M={state:'idle'};
const mleft=()=>Math.max(0,3000-Math.floor((Date.now()-M.start)/1000));
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function mock(){
 const v=$('#view');
 if(M.state==='idle'){const last=store.mocks.slice(-5).reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${m.mc} / 12</td><td>${m.calc}</td><td><b>${m.pct}%</b></td></tr>`).join('');
  v.innerHTML=`<div class="card"><h2>Mock midterm, 50 minutes</h2><p>12 multiple choice questions (3 per module, about 60% of the marks) and 2 calculation exercises (about 40%). New numbers every time. Paper first, simple calculator only, no notes.</p><button class="btn" id="go">Start the 50 minute mock</button></div>${last?`<div class="card"><b>Recent mocks</b><table><tr><th>Date</th><th>Multiple choice</th><th>Calculation parts</th><th>Weighted score</th></tr>${last}</table></div>`:''}`;
  $('#go').onclick=()=>{const mc=[];WK_KEYS.forEach(k=>mc.push(...R.shuffle(BANK.filter(q=>q.t===k)).slice(0,3)));mc.forEach(q=>q._o=R.shuffle([0,1,2,3]));
   const cA=R.pick(['cap','little','line']),cB=R.pick(['fc','craft']);const probs=[cA,cB].map(k=>{const s=R.newSeed();return{k,seed:s,t:R.seeded(s,()=>CALC[k].gen())}});
   M={state:'run',mc:R.shuffle(mc),ans:{},probs,start:Date.now(),timer:null};M.timer=setInterval(()=>{const el=$('#tm');const l=mleft();if(el){el.textContent=mmss(l);if(l<300)el.classList.add('low')}if(l<=0)finishMock()},1000);mock();window.scrollTo(0,0)};return}
 if(M.state==='run'){
  v.innerHTML=`<div class="card row bar2"><span>Time left <span class="timer" id="tm">${mmss(mleft())}</span></span><button class="btn" id="fin">Submit</button></div>`+M.mc.map((q,i)=>`<div class="card"><div class="meta">Question ${i+1} (${MOD[q.t]})</div><div class="q">${esc(q.q)}</div>${q._o.map((oi,k)=>`<button class="opt ${M.ans[q.id]===oi?'sel':''}" data-q="${q.id}" data-o="${oi}"><span class="k">${'ABCD'[k]}</span>${esc(q.o[oi])}</button>`).join('')}</div>`).join('')+M.probs.map((p,i)=>`<div class="card"><div class="meta">Calculation exercise ${i+1}</div>${p.t.text}${partsHtml(p.t,'k'+i+'_')}</div>`).join('');
  $$('.opt[data-q]').forEach(b=>b.onclick=()=>{M.ans[b.dataset.q]=+b.dataset.o;$$('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.toggle('sel',x===b))});
  M.probs.forEach((p,i)=>p.t.parts.forEach((q,j)=>{const el=$('#k'+i+'_'+j);if(M.vals&&M.vals[i+'_'+j])el.value=M.vals[i+'_'+j];el.oninput=()=>{M.vals=M.vals||{};M.vals[i+'_'+j]=el.value}}));
  $('#fin').onclick=()=>{const b=$('#fin');if(b.dataset.arm)finishMock();else{b.dataset.arm=1;b.textContent='Click again to submit';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='Submit'}},4000)}};return}
 const r=M.res;
 v.innerHTML=`<div class="card"><h2>Result: ${r.pct}%</h2><p>Multiple choice ${r.mc} of 12. Calculation parts ${r.calc}. Weighted 60% and 40%. The Canvas practice quiz is the next step.</p><button class="btn" id="re">Back</button></div>`+M.mc.map((q,i)=>`<div class="card"><div class="meta">Question ${i+1}</div><div class="q">${esc(q.q)}</div>${q._o.map((oi,k)=>`<div class="opt ${oi===q.a?'good':(M.ans[q.id]===oi?'bad':'')}"><span class="k">${'ABCD'[k]}</span>${esc(q.o[oi])}</div>`).join('')}<div class="fb"><b>Why</b>${esc(q.e)}</div></div>`).join('')+M.probs.map((p,i)=>`<div class="card"><div class="meta">Calculation exercise ${i+1}</div>${p.t.text}${partsHtml(p.t,'k'+i+'_')}<div class="fb sol"><b>Solution</b>${p.t.sol}</div></div>`).join('');
 M.probs.forEach((p,i)=>{p.t.parts.forEach((q,j)=>{$('#k'+i+'_'+j).value=(M.vals&&M.vals[i+'_'+j])||''});gradeParts(p.t,'k'+i+'_')});
 $('#re').onclick=()=>{M={state:'idle'};mock()}}
function finishMock(){clearInterval(M.timer);if(M.state!=='run')return;let mc=0;M.mc.forEach(q=>{const ok=M.ans[q.id]===q.a;if(ok)mc++;const r=store.mc[q.id]||{n:0};r.n++;r.last=ok?1:0;store.mc[q.id]=r});
 let cg=0,cp=0;M.probs.forEach((p,i)=>{let g=0;p.t.parts.forEach((q,j)=>{if(okPart(q,(M.vals||{})[i+'_'+j]))g++});cg+=g;cp+=p.t.parts.length;recCalc(p.k,g,p.t.parts.length)});
 const pct=Math.round(60*mc/12+40*cg/cp);M.res={mc,calc:cg+' / '+cp,pct};store.mocks.push({date:new Date().toISOString().slice(0,10),mc,calc:cg+' / '+cp,pct});save();M.state='done';if(tab==='mock')mock()}

/* ===== workings, methods, formulas, progress ===== */
function work(){
 $('#view').innerHTML=`<div class="card"><h2>Your tutorial workings, checked</h2><p class="meta">Each result was recomputed independently. VERIFIED means your result matches my independent calculation or the professor files. CORRECTION means one of your numbers was wrong and should be fixed in your notes.</p>${TB(['Item','Status','Check'],WORKINGS.map(w=>[w[0],`<span class="tag ${w[1]==='OK'?'v':'f'}">${w[1]==='OK'?'VERIFIED':'CORRECTION'}</span>`,w[2]]))}</div><div class="card"><h2>Gaps explained</h2>${TB(['Exercise','What to know'],GAPS)}</div>`}
function methods(){let last='';$('#view').innerHTML=METHODS.map(m=>{const h=m[0]!==last?`<h3>${m[0]}</h3>`:'';last=m[0];return h+`<div class="card"><b>${m[1]}</b><ol class="sol">${m[2].map(l=>'<li>'+l+'</li>').join('')}</ol></div>`}).join('')}
function formulas(){$('#view').innerHTML=`<p class="note" style="margin-top:0">No formula sheet in the exam. Cover the formulas, say them out loud, then check.</p>`+FORMULAS.map(g=>`<div class="card"><b>${g[0]}</b>${g[1].map(r=>`<div class="mrow">${EQ(r[0])}<span class="meta">${esc(r[1])}</span></div>`).join('')}</div>`).join('')}
function progress(){
 const tiles=WK_KEYS.map(k=>{const qs=BANK.filter(q=>q.t===k),right=qs.filter(q=>store.mc[q.id]&&store.mc[q.id].last===1).length,tried=qs.filter(q=>store.mc[q.id]).length;const th=THEORY.find(t=>t.id===k),rc=th.recall.filter((x,i)=>store.rec[k+'_'+i]).length;const pct=Math.round(100*right/qs.length);return`<div class="stat"><div class="meta">${MOD[k]}</div><b>${pct}%</b><div class="bar"><i style="width:${pct}%"></i></div><div class="meta">Quiz: ${right} of ${qs.length} right (${tried} tried). Recall ticks: ${rc} of ${th.recall.length}</div></div>`}).join('');
 const rows=CALC_ORDER.map(k=>{const r=store.calc[k];return`<tr><td>${esc(CALC[k].name)}</td><td>${r?r.tasks:0}</td><td>${r?Math.round(100*r.good/r.parts)+'%':'<span class="meta">not tried</span>'}</td></tr>`}).join('');
 const sum='OM midterm trainer, summary '+new Date().toISOString().slice(0,16).replace('T',' ')+'\n'+WK_KEYS.map(k=>{const qs=BANK.filter(q=>q.t===k);return MOD[k]+': quiz '+qs.filter(q=>store.mc[q.id]&&store.mc[q.id].last===1).length+'/'+qs.length}).join('\n')+'\n'+CALC_ORDER.filter(k=>store.calc[k]).map(k=>CALC[k].name+': '+store.calc[k].tasks+' problems, '+Math.round(100*store.calc[k].good/store.calc[k].parts)+'% parts right').join('\n')+(store.mocks.length?'\nLast mock: '+store.mocks[store.mocks.length-1].pct+'% ('+store.mocks.length+' mocks)':'');
 $('#view').innerHTML=`<div class="grid">${tiles}</div><div class="card" style="margin-top:14px"><b>Calculation types</b><table><tr><th>Type</th><th>Problems</th><th>Parts right</th></tr>${rows}</table></div><div class="card"><b>Session summary</b><p class="meta">Paste this to Claude so the next session resumes from here.</p><textarea id="sum" readonly></textarea><div class="row"><button class="btn" id="cp">Copy</button><button class="btn ghost" id="rs">Reset all progress</button></div></div>`;
 $('#sum').value=sum;
 $('#cp').onclick=()=>{const t=$('#sum');t.select();try{navigator.clipboard.writeText(t.value).then(()=>$('#cp').textContent='Copied',()=>$('#cp').textContent='Selected, press Cmd C')}catch(e){$('#cp').textContent='Selected, press Cmd C'}};
 $('#rs').onclick=()=>{const b=$('#rs');if(b.dataset.arm){store=EMPTY();store.epoch=Date.now();save();progress()}else{b.dataset.arm=1;b.textContent='Click again to delete all progress'}}}

render();countdown();setInterval(countdown,30000);setStatus('','Progress is saved in this browser');initSync();
</script>
</body>
</html>
